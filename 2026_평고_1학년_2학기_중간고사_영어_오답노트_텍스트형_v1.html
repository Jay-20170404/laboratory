e="status"></div><details id="teacher-reference"><summary>교사용 정답·해설 확인</summary><p class="answer-source">문제 DOCX에 포함된 정답·핵심 근거를 반영했습니다.</p><div id="teacher-explanation"></div></details><div id="content"></div></main></div><div id="print"></div>
<script>
const EXAM={id:'2026-pyeonggo-g1-s2-midterm-english',title:'평고 1학년 2학기 중간고사',subject:'영어',rangeLabel:'1~28번',version:1};
const EXAM_ID=EXAM.id,STORAGE='incorrect-notes:'+EXAM_ID+':v1';
const DB={"1": {"label": "1번", "type": "글의 목적", "score": "3.1점", "correctAnswer": "②", "answerItems": [{"label": "1번", "answer": "②", "note": ""}], "explanation": "1번: 실제 언어 사용 경험을 강조하며 언어 캠프 참여를 독려합니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">1. 다음 글의 목적으로 가장 적절한 것은?</div><div class=\"given\"><p>Dear Parents,</p><p>True language fluency comes from real-life practice, not simple memorization. Children master languages deeply when they actually use them in a meaningful context. Our upcoming Language Camp offers the perfect authentic environment for your child to learn by doing! Instead of sitting through repetitive grammar exercises, campers will actively speak, collaborate, and solve fun everyday challenges in their target language. This natural, engaging atmosphere helps them build lasting confidence and true fluency. Give your child the opportunity to experience a language naturally and express themselves with confidence. Join us this season for an unforgettable adventure in real-world learning!</p><p>Warm regards,</p><p>Community Language Network</p></div><div class=\"text-options\"><div>① 외국어 캠프 일정을 안내하려고</div><div>② 외국어 캠프 참여를 독려하려고</div><div>③ 외국어 교육의 필요성을 강조하려고</div><div>④ 외국어 수업의 커리큘럼을 설명하려고</div><div>⑤ 외국어 학교 입학 설명회를 홍보하려고</div></div></div>", "layout": "standard", "members": ["1"], "sourceText": "\nDear Parents,\nTrue language fluency comes from real-life practice, not simple memorization. Children master languages deeply when they actually use them in a meaningful context. Our upcoming Language Camp offers the perfect authentic environment for your child to learn by doing! Instead of sitting through repetitive grammar exercises, campers will actively speak, collaborate, and solve fun everyday challenges in their target language. This natural, engaging atmosphere helps them build lasting confidence and true fluency. Give your child the opportunity to experience a language naturally and express themselves with confidence. Join us this season for an unforgettable adventure in real-world learning!\nWarm regards,\nCommunity Language Network\n① 외국어 캠프 일정을 안내하려고\n② 외국어 캠프 참여를 독려하려고\n③ 외국어 교육의 필요성을 강조하려고\n④ 외국어 수업의 커리큘럼을 설명하려고\n⑤ 외국어 학교 입학 설명회를 홍보하려고"}, "2": {"label": "2번", "type": "심경 변화", "score": "3.1점", "correctAnswer": "③", "answerItems": [{"label": "2번", "answer": "③", "note": ""}], "explanation": "2번: 반복된 거절로 좌절하다가 연구직 지원 소식에 감사함을 느낍니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">2. 다음 글에 드러난 ‘I’의 심경 변화로 가장 적절한 것은?</div><div class=\"given\"><p>When I was living in London in 1999, my head was full of ideas about physics, but I had almost no way to work on them. Every time I sent an application, the answer was the same: “No”. Soon I stopped opening the emails because I already knew what they said. Night after night, I asked myself if I had wasted many years on a dream that no one wanted to support. I almost decided to give up on science forever. One day, a visiting professor at Imperial College came to see me and told me that a donor who loved physics had funded a research position for me. I couldn’t believe it and my heart was filled with gratitude. Someone believed in my work, and I could finally go back to my research.</p></div><div class=\"text-options\"><div>① bored → lonely</div><div>② ashamed → proud</div><div>③ frustrated → grateful</div><div>④ frightened → indifferent</div><div>⑤ embarrassed → disappointed</div></div></div>", "layout": "standard", "members": ["2"], "sourceText": "\nWhen I was living in London in 1999, my head was full of ideas about physics, but I had almost no way to work on them. Every time I sent an application, the answer was the same: “No”. Soon I stopped opening the emails because I already knew what they said. Night after night, I asked myself if I had wasted many years on a dream that no one wanted to support. I almost decided to give up on science forever. One day, a visiting professor at Imperial College came to see me and told me that a donor who loved physics had funded a research position for me. I couldn’t believe it and my heart was filled with gratitude. Someone believed in my work, and I could finally go back to my research.\n① bored → lonely\n② ashamed → proud\n③ frustrated → grateful\n④ frightened → indifferent\n⑤ embarrassed → disappointed"}, "3": {"label": "3번", "type": "필자의 주장", "score": "3.2점", "correctAnswer": "①", "answerItems": [{"label": "3번", "answer": "①", "note": ""}], "explanation": "3번: 짧은 휴식이 습관화를 막고 집중력과 생산성을 높인다는 주장입니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">3. 필자의 주장으로 가장 적절한 것은?</div><div class=\"given\"><p>If we stick with a task too long, we lose sight of the goal we’re trying to achieve, and this process is known as “habituation.” Short breaks from a task can prevent habituation, help us maintain focus, and reactivate our commitment to a goal. And frequent short breaks are more effective than occasional ones. DeskTime, a company that makes productivity-tracking software, says that “what the most productive 10% of our users have in common is their ability to take effective breaks.” Specifically, after analyzing its own data, DeskTime claims to have discovered a golden ratio of work and rest. High performers, its research concludes, work for fifty-two minutes and then break for seventeen minutes. DeskTime never published the data in a peer reviewed journal, so your mileage may vary. But the evidence is overwhelming that short breaks are effective — and deliver considerable effect for their limited cost. Even “micro-breaks” can be helpful.</p></div><div class=\"text-options\"><div>① 짧은 휴식을 취하는 것이 생산성 향상에 도움이 된다.</div><div>② 휴식의 반복되는 패턴을 통해 작업의 효율성을 높일 수 있다.</div><div>③ 업무의 습관화를 통해 불필요한 에너지 낭비를 막을 수 있다.</div><div>④ 체계적인 계획이 생산성 향상에 항상 도움이 되는 것은 아니다.</div><div>⑤ 업무 시간과 휴식 시간의 불균형이 생산성 저하의 주요 원인이 된다.</div></div></div>", "layout": "standard", "members": ["3"], "sourceText": "\nIf we stick with a task too long, we lose sight of the goal we’re trying to achieve, and this process is known as “habituation.” Short breaks from a task can prevent habituation, help us maintain focus, and reactivate our commitment to a goal. And frequent short breaks are more effective than occasional ones. DeskTime, a company that makes productivity-tracking software, says that “what the most productive 10% of our users have in common is their ability to take effective breaks.” Specifically, after analyzing its own data, DeskTime claims to have discovered a golden ratio of work and rest. High performers, its research concludes, work for fifty-two minutes and then break for seventeen minutes. DeskTime never published the data in a peer reviewed journal, so your mileage may vary. But the evidence is overwhelming that short breaks are effective — and deliver considerable effect for their limited cost. Even “micro-breaks” can be helpful.\n① 짧은 휴식을 취하는 것이 생산성 향상에 도움이 된다.\n② 휴식의 반복되는 패턴을 통해 작업의 효율성을 높일 수 있다.\n③ 업무의 습관화를 통해 불필요한 에너지 낭비를 막을 수 있다.\n④ 체계적인 계획이 생산성 향상에 항상 도움이 되는 것은 아니다.\n⑤ 업무 시간과 휴식 시간의 불균형이 생산성 저하의 주요 원인이 된다."}, "4": {"label": "4번", "type": "함축 의미", "score": "3.6점", "correctAnswer": "⑤", "answerItems": [{"label": "4번", "answer": "⑤", "note": ""}], "explanation": "4번: 개인별 정서적 필요가 같다고 가정하여 획일적인 보상을 제공하는 방식입니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">4. 밑줄 친 a one-size-fits-all template가 다음 글에서 의미하는 바로 가장 적절한 것은?</div><div class=\"given\"><p>When we ask people to tell us about the most meaningful recognition they’ve received, they consistently say that it’s “personal.” They say that it feels special. That’s why it’s so important for you as a leader to pay attention to the likes and dislikes of each and every individual in your group. You get a lot more emotional bang for your buck when you make recognition and rewards personal. Step into the shoes of other people and ask yourself, “What do I wish someone would do to celebrate and recognize my contribution?” Let your answer to this question guide your own thinking about how to acknowledge the contributions of others, while also being sensitive to the fact that not everyone is just like you. This means that you have to get close enough to others to know about what would make recognition meaningful to them. Ultimately, as a leader, you must avoid relying on <u>a one-size-fits-all template</u>.</p></div><div class=\"text-options\"><div>① the strict demand for team members to adapt to the leader’s specific operational style</div><div>② the evaluation of objective performance through highly subjective personal standards</div><div>③ the prioritization of emotional connections over concrete financial incentives for your team</div><div>④ the separation of your personal preferences from the collective goals of the organization</div><div>⑤ the distribution of standardized rewards based on the assumption of uniform emotional needs</div></div></div>", "layout": "standard", "members": ["4"], "sourceText": "\nWhen we ask people to tell us about the most meaningful recognition they’ve received, they consistently say that it’s “personal.” They say that it feels special. That’s why it’s so important for you as a leader to pay attention to the likes and dislikes of each and every individual in your group. You get a lot more emotional bang for your buck when you make recognition and rewards personal. Step into the shoes of other people and ask yourself, “What do I wish someone would do to celebrate and recognize my contribution?” Let your answer to this question guide your own thinking about how to acknowledge the contributions of others, while also being sensitive to the fact that not everyone is just like you. This means that you have to get close enough to others to know about what would make recognition meaningful to them. Ultimately, as a leader, you must avoid relying on a one-size-fits-all template.\n① the strict demand for team members to adapt to the leader’s specific operational style\n② the evaluation of objective performance through highly subjective personal standards\n③ the prioritization of emotional connections over concrete financial incentives for your team\n④ the separation of your personal preferences from the collective goals of the organization\n⑤ the distribution of standardized rewards based on the assumption of uniform emotional needs"}, "5": {"label": "5번", "type": "글의 요지", "score": "3.4점", "correctAnswer": "②", "answerItems": [{"label": "5번", "answer": "②", "note": ""}], "explanation": "5번: 머릿속에 내재된 지식이 문제 해결·아이디어 생성·효율적인 검색을 가능하게 합니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">5. 다음 글의 요지로 가장 적절한 것은?</div><div class=\"given\"><p>Relegating knowledge to search engines and apps differs greatly from actually knowing something. Outsourced knowledge can become unavailable when a device crashes or the internet fails. But even when all external sources are working fine, you think differently. If you cognitively know in your own head a rich array of causal patterns, you can problem-solve and create new ideas more rapidly and fluidly. Our weekly lab meetings include many back-and-forth exchanges between about a dozen people. These exchanges require fast recall of models, patterns, and paradigms to recognize flaws or generate new ideas and solutions. If everyone had to pause and Google information, the process would take much longer or would not work at all. Moreover, without enough internal knowledge, you wouldn’t know how to search effectively. People grossly underestimate how much prior understanding is needed to perform efficient searches for information.</p></div><div class=\"text-options\"><div>① 정확한 정보를 얻으려면 여러 검색 엔진을 비교하며 활용해야 한다.</div><div>② 내재된 지식이 있어야 효과적인 문제 해결과 정보 검색이 가능하다.</div><div>③ 디지털 기기에 대한 지나친 의존은 인간의 기억력 저하를 초래한다.</div><div>④ 토론 중 실시간 검색을 활용해 아이디어 도출 시간을 단축할 수 있다.</div><div>⑤ 지식을 직접 암기하는 것보다 정보 검색 능력을 기르는 것이 더 중요하다.</div></div></div>", "layout": "standard", "members": ["5"], "sourceText": "\nRelegating knowledge to search engines and apps differs greatly from actually knowing something. Outsourced knowledge can become unavailable when a device crashes or the internet fails. But even when all external sources are working fine, you think differently. If you cognitively know in your own head a rich array of causal patterns, you can problem-solve and create new ideas more rapidly and fluidly. Our weekly lab meetings include many back-and-forth exchanges between about a dozen people. These exchanges require fast recall of models, patterns, and paradigms to recognize flaws or generate new ideas and solutions. If everyone had to pause and Google information, the process would take much longer or would not work at all. Moreover, without enough internal knowledge, you wouldn’t know how to search effectively. People grossly underestimate how much prior understanding is needed to perform efficient searches for information.\n① 정확한 정보를 얻으려면 여러 검색 엔진을 비교하며 활용해야 한다.\n② 내재된 지식이 있어야 효과적인 문제 해결과 정보 검색이 가능하다.\n③ 디지털 기기에 대한 지나친 의존은 인간의 기억력 저하를 초래한다.\n④ 토론 중 실시간 검색을 활용해 아이디어 도출 시간을 단축할 수 있다.\n⑤ 지식을 직접 암기하는 것보다 정보 검색 능력을 기르는 것이 더 중요하다."}, "6": {"label": "6번", "type": "글의 제목", "score": "3.5점", "correctAnswer": "⑤", "answerItems": [{"label": "6번", "answer": "⑤", "note": ""}], "explanation": "6번: 재능이 잠재력을 결정한다고 단정하면 배움의 기회를 차단하는 자기실현적 예언이 됩니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">6. 다음 글의 제목으로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>When people assume that talent plays a major, even determining, role in how accomplished a person can become, that assumption points one toward certain decisions and actions. If you assume that people who are not innately gifted are never going to be good at something, then the children who don’t excel at something right away are encouraged to try something else. The clumsy ones are pushed away from sports, the ones who can’t carry a tune right away are told they should try something other than music, and the ones who don’t immediately get comfortable with numbers are told they are no good at math. And, no surprise, the predictions come true: the girl who was told to forget about sports never becomes any good at hitting a tennis ball or kicking a soccer ball; the boy who was told he was tone-deaf never learns to play a musical instrument or to sing well; and the children who were told they were no good at math grow up believing it. The idea becomes self-fulfilling.</p></div><div class=\"text-options\"><div>① Impacts of Predicting Future on Children’s Achievement</div><div>② Strategies to Compensate for Lacking Academic Talents</div><div>③ How Do Our Children Overcome People’s Bias on Talents</div><div>④ Similarities and Differences between Boys and Girls in Talents</div><div>⑤ The Danger of Assuming Talents Determine Human Potential</div></div></div>", "layout": "standard", "members": ["6"], "sourceText": "\nWhen people assume that talent plays a major, even determining, role in how accomplished a person can become, that assumption points one toward certain decisions and actions. If you assume that people who are not innately gifted are never going to be good at something, then the children who don’t excel at something right away are encouraged to try something else. The clumsy ones are pushed away from sports, the ones who can’t carry a tune right away are told they should try something other than music, and the ones who don’t immediately get comfortable with numbers are told they are no good at math. And, no surprise, the predictions come true: the girl who was told to forget about sports never becomes any good at hitting a tennis ball or kicking a soccer ball; the boy who was told he was tone-deaf never learns to play a musical instrument or to sing well; and the children who were told they were no good at math grow up believing it. The idea becomes self-fulfilling.\n① Impacts of Predicting Future on Children’s Achievement\n② Strategies to Compensate for Lacking Academic Talents\n③ How Do Our Children Overcome People’s Bias on Talents\n④ Similarities and Differences between Boys and Girls in Talents\n⑤ The Danger of Assuming Talents Determine Human Potential"}, "7": {"label": "7번", "type": "글의 제목", "score": "3.6점", "correctAnswer": "①", "answerItems": [{"label": "7번", "answer": "①", "note": ""}], "explanation": "7번: 감정의 분류는 언어·문화에 따라 다르며, 학계에서도 보편적 합의가 이루어지지 않았습니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">7. 다음 글의 제목으로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>The English language has words for hundreds of emotions. Other languages have far fewer; for example, there are just seven in the Chewong language of the Malay Peninsula. As one emotion researcher put it, “Different languages recognize different emotions. They carve up the domain of emotion differently.” That’s not to say that different people experience different emotions, but rather that the categories of emotion identified in various cultures are somewhat arbitrary. That supports the idea that our feelings are not, as Darwin believed, innate hardwired responses to a set of archetypal stimuli. In an article co-authored with Ralph Adolphs, Barrett argued that science has not yet identified fully objective criteria to reliably determine whether a person or an animal is in one emotional state or another. Adolphs, like the majority of emotion researchers, recognizes her point, but wouldn’t go that far in dismissing the usual categories. As to which school of thought is correct, the jury is still out.</p></div><div class=\"text-options\"><div>① Categorizing Emotions: Far From a Universal Consensus</div><div>② The Need for Objective Criteria to Overcome Language Barriers</div><div>③ Innate Responses: The Unchanging Core Across Diverse Cultures</div><div>④ Limitations in Measuring the Emotional States of Non-human Animals</div><div>⑤ How Linguistic Differences Alter Our Actual Emotional Experiences</div></div></div>", "layout": "standard", "members": ["7"], "sourceText": "\nThe English language has words for hundreds of emotions. Other languages have far fewer; for example, there are just seven in the Chewong language of the Malay Peninsula. As one emotion researcher put it, “Different languages recognize different emotions. They carve up the domain of emotion differently.” That’s not to say that different people experience different emotions, but rather that the categories of emotion identified in various cultures are somewhat arbitrary. That supports the idea that our feelings are not, as Darwin believed, innate hardwired responses to a set of archetypal stimuli. In an article co-authored with Ralph Adolphs, Barrett argued that science has not yet identified fully objective criteria to reliably determine whether a person or an animal is in one emotional state or another. Adolphs, like the majority of emotion researchers, recognizes her point, but wouldn’t go that far in dismissing the usual categories. As to which school of thought is correct, the jury is still out.\n① Categorizing Emotions: Far From a Universal Consensus\n② The Need for Objective Criteria to Overcome Language Barriers\n③ Innate Responses: The Unchanging Core Across Diverse Cultures\n④ Limitations in Measuring the Emotional States of Non-human Animals\n⑤ How Linguistic Differences Alter Our Actual Emotional Experiences"}, "8": {"label": "8번", "type": "도표 내용 불일치", "score": "3.2점", "correctAnswer": "④", "answerItems": [{"label": "8번", "answer": "④", "note": ""}], "explanation": "8번: 2025년 수력은 20%, 풍력은 35%이므로 수력이 풍력보다 앞서거나 2위라는 설명이 틀립니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">8. 다음 도표의 내용과 일치하지 않는 것은?</div><svg class=\"data-chart\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 320\" role=\"img\" aria-labelledby=\"chart8-title chart8-desc\"><title id=\"chart8-title\">Percentage of Renewable Energy Sources Used in Korea</title><desc id=\"chart8-desc\">2015: Hydro 40%, Wind 30%, Solar 15%, Biomass 15%. 2025: Hydro 20%, Wind 35%, Solar 40%, Biomass 5%.</desc><defs><pattern id=\"chart8-hatch\" width=\"8\" height=\"8\" patternUnits=\"userSpaceOnUse\"><rect width=\"8\" height=\"8\" fill=\"white\"/><path d=\"M-2 2L2 -2M0 8L8 0M6 10L10 6\" stroke=\"black\" stroke-width=\"1.3\"/></pattern></defs><g font-family=\"Arial,sans-serif\" font-size=\"14\" fill=\"#111\"><text x=\"360\" y=\"23\" text-anchor=\"middle\" font-size=\"18\">Percentage of Renewable Energy Sources Used in Korea</text><line x1=\"55\" x2=\"600\" y1=\"270\" y2=\"270\" stroke=\"#ccc\"/><text x=\"44\" y=\"275\" text-anchor=\"end\">0</text><line x1=\"55\" x2=\"600\" y1=\"230\" y2=\"230\" stroke=\"#ccc\"/><text x=\"44\" y=\"235\" text-anchor=\"end\">10</text><line x1=\"55\" x2=\"600\" y1=\"190\" y2=\"190\" stroke=\"#ccc\"/><text x=\"44\" y=\"195\" text-anchor=\"end\">20</text><line x1=\"55\" x2=\"600\" y1=\"150\" y2=\"150\" stroke=\"#ccc\"/><text x=\"44\" y=\"155\" text-anchor=\"end\">30</text><line x1=\"55\" x2=\"600\" y1=\"110\" y2=\"110\" stroke=\"#ccc\"/><text x=\"44\" y=\"115\" text-anchor=\"end\">40</text><line x1=\"55\" x2=\"600\" y1=\"70\" y2=\"70\" stroke=\"#ccc\"/><text x=\"44\" y=\"75\" text-anchor=\"end\">50</text><path d=\"M55 70V270H600\" fill=\"none\" stroke=\"black\" stroke-width=\"1.5\"/><text x=\"10\" y=\"176\">(%)</text><rect x=\"82\" y=\"110\" width=\"42\" height=\"160\" fill=\"#ddd\" stroke=\"black\" stroke-width=\"1.2\"/><rect x=\"124\" y=\"190\" width=\"42\" height=\"80\" fill=\"url(#chart8-hatch)\" stroke=\"black\" stroke-width=\"1.2\"/><text x=\"124\" y=\"294\" text-anchor=\"middle\">Hydro</text><rect x=\"215\" y=\"150\" width=\"42\" height=\"120\" fill=\"#ddd\" stroke=\"black\" stroke-width=\"1.2\"/><rect x=\"257\" y=\"130\" width=\"42\" height=\"140\" fill=\"url(#chart8-hatch)\" stroke=\"black\" stroke-width=\"1.2\"/><text x=\"257\" y=\"294\" text-anchor=\"middle\">Wind</text><rect x=\"348\" y=\"210\" width=\"42\" height=\"60\" fill=\"#ddd\" stroke=\"black\" stroke-width=\"1.2\"/><rect x=\"390\" y=\"110\" width=\"42\" height=\"160\" fill=\"url(#chart8-hatch)\" stroke=\"black\" stroke-width=\"1.2\"/><text x=\"390\" y=\"294\" text-anchor=\"middle\">Solar</text><rect x=\"481\" y=\"210\" width=\"42\" height=\"60\" fill=\"#ddd\" stroke=\"black\" stroke-width=\"1.2\"/><rect x=\"523\" y=\"250\" width=\"42\" height=\"20\" fill=\"url(#chart8-hatch)\" stroke=\"black\" stroke-width=\"1.2\"/><text x=\"523\" y=\"294\" text-anchor=\"middle\">Biomass</text><rect x=\"620\" y=\"140\" width=\"26\" height=\"13\" fill=\"#ddd\" stroke=\"black\"/><text x=\"654\" y=\"152\">2015</text><rect x=\"620\" y=\"166\" width=\"26\" height=\"13\" fill=\"url(#chart8-hatch)\" stroke=\"black\"/><text x=\"654\" y=\"178\">2025</text></g></svg><div class=\"given\"><p>The above graph illustrates the respective shares of four distinct renewable energy sources used in Korea in 2015 and 2025. ① In 2015, hydro power took the lead as the primary renewable energy source, accounting for exactly 40 percent, and was immediately followed by wind power. ② In 2025, however, solar power had overtaken the others to become the dominant source, surging to 40 percent, which was more than twice that of 2015. ③ Over the same period, the proportion of wind power saw a steady expansion, rising from 30 percent in 2015 to 35 percent in 2025. ④ Although the share of hydro power was cut in half over the decade, it still preceded wind power in 2025, claiming the second highest spot. ⑤ Biomass, which had matched the proportion of solar power in the initial year, fell to a mere 5 percent, thereby following all other sources in 2025.</p></div></div>", "layout": "standard", "members": ["8"], "sourceText": "\nThe above graph illustrates the respective shares of four distinct renewable energy sources used in Korea in 2015 and 2025. ① In 2015, hydro power took the lead as the primary renewable energy source, accounting for exactly 40 percent, and was immediately followed by wind power. ② In 2025, however, solar power had overtaken the others to become the dominant source, surging to 40 percent, which was more than twice that of 2015. ③ Over the same period, the proportion of wind power saw a steady expansion, rising from 30 percent in 2015 to 35 percent in 2025. ④ Although the share of hydro power was cut in half over the decade, it still preceded wind power in 2025, claiming the second highest spot. ⑤ Biomass, which had matched the proportion of solar power in the initial year, fell to a mere 5 percent, thereby following all other sources in 2025."}, "9": {"label": "9번", "type": "내용 불일치", "score": "3.2점", "correctAnswer": "④", "answerItems": [{"label": "9번", "answer": "④", "note": ""}], "explanation": "9번: 당시에는 의학 지식이 없는 사람들이 시신을 검시하지 않고도 사망 사건을 종결했습니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">9. 다음 글의 내용과 일치하지 않는 것은?</div><div class=\"given\"><p>Frances Glessner Lee was born into a rich family in Chicago in 1878. She became interested in medicine at a young age. Her dream was to attend Harvard Medical School, but at that time, the school did not accept women. She had no choice but to get married. It was not until she was in her fifties that Lee was able to start a career in medicine. Lee heard many interesting stories of real-life crime from her friend, George Burgess Magrath. He was a medical examiner who wanted to change the investigation system. This was because, at that time, people with no medical knowledge investigated and closed many death cases without examining the bodies. He also had a passion for educating medical students in legal medicine. Magrath’s passion sparked Lee’s interest in legal medicine. Lee started studying legal medicine by reading books and speaking with experts. She believed that medical examiner systems would be adopted more widely across the country.</p></div><div class=\"text-options\"><div>① Lee는 1878년 시카고의 부유한 가정에서 태어났다.</div><div>② 당시 Harvard 의과대학은 여성의 입학을 허용하지 않았다.</div><div>③ Lee는 50대가 되어서야 의학 분야에서 일을 시작했다.</div><div>④ 당시에는 시신을 검시한 뒤에만 사망 사건을 종결했다.</div><div>⑤ Magrath의 열정은 Lee가 법의학에 관심을 갖게 했다.</div></div></div>", "layout": "standard", "members": ["9"], "sourceText": "\nFrances Glessner Lee was born into a rich family in Chicago in 1878. She became interested in medicine at a young age. Her dream was to attend Harvard Medical School, but at that time, the school did not accept women. She had no choice but to get married. It was not until she was in her fifties that Lee was able to start a career in medicine. Lee heard many interesting stories of real-life crime from her friend, George Burgess Magrath. He was a medical examiner who wanted to change the investigation system. This was because, at that time, people with no medical knowledge investigated and closed many death cases without examining the bodies. He also had a passion for educating medical students in legal medicine. Magrath’s passion sparked Lee’s interest in legal medicine. Lee started studying legal medicine by reading books and speaking with experts. She believed that medical examiner systems would be adopted more widely across the country.\n① Lee는 1878년 시카고의 부유한 가정에서 태어났다.\n② 당시 Harvard 의과대학은 여성의 입학을 허용하지 않았다.\n③ Lee는 50대가 되어서야 의학 분야에서 일을 시작했다.\n④ 당시에는 시신을 검시한 뒤에만 사망 사건을 종결했다.\n⑤ Magrath의 열정은 Lee가 법의학에 관심을 갖게 했다."}, "10": {"label": "10번", "type": "안내문 내용 일치", "score": "3.2점", "correctAnswer": "⑤", "answerItems": [{"label": "10번", "answer": "⑤", "note": ""}], "explanation": "10번: 나무 심기 참여자는 편안한 신발과 장갑을 지참해야 합니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">10. 다음 글의 내용과 일치하는 것은?</div><div class=\"given\"><p><b>Carbon-Neutral Festival 2026</b></p><p>One of our school’s signature events, the Carbon-Neutral Festival will take place from Monday to Thursday. Join us in making our school more sustainable through simple actions.</p><p><b>• Eco-Market</b></p><p>✓ Monday, 12:30-2:00 p.m. / School Courtyard</p><p>✓ Bring clean, reusable items from home and exchange them with others.</p><p><b>• Green Ideas Exhibition</b></p><p>✓ Wednesday / School Cafeteria</p><p>✓ Visit student projects on renewable energy, waste reduction, and sustainable transportation.</p><p><b>• Tree-Planting Activity</b></p><p>✓ Thursday, 3:30 p.m. / School Garden</p><p>✓ You must bring comfortable shoes and gloves.</p><p>✓ Participants will plant native trees and learn how they help local ecosystems.</p></div><div class=\"text-options\"><div>① 전체 행사는 월요일부터 금요일까지 진행된다.</div><div>② 에코 마켓에서는 재사용 가능한 물품을 구입할 수 있다.</div><div>③ 녹색 아이디어 전시회에서는 신재생 에너지에 관한 작품만 전시된다.</div><div>④ 나무 심기 활동은 수요일 오후에 학교 정원에서 진행된다.</div><div>⑤ 나무 심기 활동에 참여하려면 편안한 신발과 장갑을 지참해야 한다.</div></div></div>", "layout": "standard", "members": ["10"], "sourceText": "\nCarbon-Neutral Festival 2026\nOne of our school’s signature events, the Carbon-Neutral Festival will take place from Monday to Thursday. Join us in making our school more sustainable through simple actions.\n• Eco-Market\n✓ Monday, 12:30-2:00 p.m. / School Courtyard\n✓ Bring clean, reusable items from home and exchange them with others.\n• Green Ideas Exhibition\n✓ Wednesday / School Cafeteria\n✓ Visit student projects on renewable energy, waste reduction, and sustainable transportation.\n• Tree-Planting Activity\n✓ Thursday, 3:30 p.m. / School Garden\n✓ You must bring comfortable shoes and gloves.\n✓ Participants will plant native trees and learn how they help local ecosystems.\n① 전체 행사는 월요일부터 금요일까지 진행된다.\n② 에코 마켓에서는 재사용 가능한 물품을 구입할 수 있다.\n③ 녹색 아이디어 전시회에서는 신재생 에너지에 관한 작품만 전시된다.\n④ 나무 심기 활동은 수요일 오후에 학교 정원에서 진행된다.\n⑤ 나무 심기 활동에 참여하려면 편안한 신발과 장갑을 지참해야 한다."}, "11": {"label": "11번", "type": "어법", "score": "3.5점", "correctAnswer": "④", "answerItems": [{"label": "11번", "answer": "④", "note": ""}], "explanation": "11번: 문장의 본동사가 필요하므로 damaging → damaged가 적절합니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">11. 다음 글의 밑줄 친 부분 중, 어법상 틀린 것을 고르시오.</div><div class=\"given\"><p>How can pattern recognition and prediction skills be developed? The ability to “guess” or predict where the music likely ① <u>proceeds</u> is dependent on how well the musician understands the different musical styles and their structure, typical formulas, harmony, and phrasing. Musicians are more inclined to sight-read a new piece by the same composer with a higher level of accuracy when they become familiar with the composer’s melodic shapes, choices of harmony, and compositional style from ② <u>having learned</u> other pieces by the same composer. This is because accumulated experience allows musicians ③ <u>to predict</u> upcoming material when reading a new (yet similar) work for the first time. Similarly, musicians will have more difficulty in sight-reading a work by a composer they have never played before. This point has also been shown in choral singing, where, in one study, altering the melody and disrupting the underlying harmony in four obscure Bach chorales ④ <u>damaging</u> the sight-singing performance of experienced choral singers. This type of finding suggests that musical accomplishment leads to the accumulation of knowledge of melodic patterns and harmony relevant to a particular musical period/style and ⑤ <u>that</u> these play an important role in sight-reading performance. Violating these expectations affects the accuracy of sight-reading.</p></div><div class=\"text-options grammar-options\"><div>① proceeds</div><div>② having learned</div><div>③ to predict</div><div>④ damaging</div><div>⑤ that</div></div></div>", "layout": "standard", "members": ["11"], "sourceText": "\nHow can pattern recognition and prediction skills be developed? The ability to “guess” or predict where the music likely ① proceeds is dependent on how well the musician understands the different musical styles and their structure, typical formulas, harmony, and phrasing. Musicians are more inclined to sight-read a new piece by the same composer with a higher level of accuracy when they become familiar with the composer’s melodic shapes, choices of harmony, and compositional style from ② having learned other pieces by the same composer. This is because accumulated experience allows musicians ③ to predict upcoming material when reading a new (yet similar) work for the first time. Similarly, musicians will have more difficulty in sight-reading a work by a composer they have never played before. This point has also been shown in choral singing, where, in one study, altering the melody and disrupting the underlying harmony in four obscure Bach chorales ④ damaging the sight-singing performance of experienced choral singers. This type of finding suggests that musical accomplishment leads to the accumulation of knowledge of melodic patterns and harmony relevant to a particular musical period/style and ⑤ that these play an important role in sight-reading performance. Violating these expectations affects the accuracy of sight-reading."}, "12": {"label": "12번", "type": "어법", "score": "3.6점", "correctAnswer": "③", "answerItems": [{"label": "12번", "answer": "③", "note": ""}], "explanation": "12번: 주어가 단수인 The favored response이므로 are → is입니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">12. 다음 글의 밑줄 친 부분 중, 어법상 틀린 것을 고르시오.</div><div class=\"given\"><p>Dinosaurs had indeed adapted and, as a group, they survived for millions of years. Under other circumstances, they almost certainly ① <u>would</u> have survived many more. But they couldn’t adapt to environmental conditions that they had never before experienced — which originated in an object from outer space. Studies of evolution now recognize that adaptation is almost always too slow a process ② <u>to cope with</u> any but the most gradual environmental changes. Adaptations seem to yield species with truly distinct properties only in isolated environments. The favored response to changing conditions ③ <u>are</u> most often migration to a new location with a more suitable environment — but of course only if such an environment is accessible. When a species can’t adapt or relocate to a suitable habitat, it doesn’t stand a chance. In our ④ <u>rapidly</u> changing environment, people would do well to take this into consideration. ⑤ <u>Despite</u> the fact that technological advances have been made, the lesson is probably relevant when evaluating the likely geopolitical implications of today’s changing environment.</p></div><div class=\"text-options grammar-options\"><div>① would</div><div>② to cope with</div><div>③ are</div><div>④ rapidly</div><div>⑤ Despite</div></div></div>", "layout": "standard", "members": ["12"], "sourceText": "\nDinosaurs had indeed adapted and, as a group, they survived for millions of years. Under other circumstances, they almost certainly ① would have survived many more. But they couldn’t adapt to environmental conditions that they had never before experienced — which originated in an object from outer space. Studies of evolution now recognize that adaptation is almost always too slow a process ② to cope with any but the most gradual environmental changes. Adaptations seem to yield species with truly distinct properties only in isolated environments. The favored response to changing conditions ③ are most often migration to a new location with a more suitable environment — but of course only if such an environment is accessible. When a species can’t adapt or relocate to a suitable habitat, it doesn’t stand a chance. In our ④ rapidly changing environment, people would do well to take this into consideration. ⑤ Despite the fact that technological advances have been made, the lesson is probably relevant when evaluating the likely geopolitical implications of today’s changing environment."}, "13": {"label": "13번", "type": "어법", "score": "3.6점", "correctAnswer": "③", "answerItems": [{"label": "13번", "answer": "③", "note": ""}], "explanation": "13번: 관계대명사 which의 선행사가 복수인 miniature scenes이므로 was → were입니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">13. 다음 글의 밑줄 친 부분 중, 어법상 틀린 것을 고르시오.</div><div class=\"given\"><p>Thanks to Lee’s efforts, the Legal Medicine department at Harvard began to train future medical examiners in 1940. However, detectives were not careful with potential evidence. By touching and stepping on things, they often destroyed clues without realizing it. Due to this fact, ① <u>analyzing</u> the clues later was impossible. Lee thought detectives also ② <u>had to</u> learn how to observe crime scenes from a medical point of view. In order to educate detectives effectively, Lee came up with a creative tool. Her idea came from her hobby: creating miniatures. She created around twenty miniature scenes during the 1940s and 1950s, which ③ <u>was</u> used to train detectives to notice tiny clues. In 1945, she held a week-long seminar and gave her first lecture using her miniature crime scenes. While ④ <u>reading</u> case files, the detectives studied the details of the miniature scenes. They looked for clues in order to determine if the scene in the miniature ⑤ <u>resulted</u> from an accident or a violent crime. The detectives learned to notice tiny details, and to observe a scene without destroying any evidence. By developing their observation skills, they were able to improve their ability to solve crime cases.</p></div><div class=\"text-options grammar-options\"><div>① analyzing</div><div>② had to</div><div>③ was</div><div>④ reading</div><div>⑤ resulted</div></div></div>", "layout": "standard", "members": ["13"], "sourceText": "\nThanks to Lee’s efforts, the Legal Medicine department at Harvard began to train future medical examiners in 1940. However, detectives were not careful with potential evidence. By touching and stepping on things, they often destroyed clues without realizing it. Due to this fact, ① analyzing the clues later was impossible. Lee thought detectives also ② had to learn how to observe crime scenes from a medical point of view. In order to educate detectives effectively, Lee came up with a creative tool. Her idea came from her hobby: creating miniatures. She created around twenty miniature scenes during the 1940s and 1950s, which ③ was used to train detectives to notice tiny clues. In 1945, she held a week-long seminar and gave her first lecture using her miniature crime scenes. While ④ reading case files, the detectives studied the details of the miniature scenes. They looked for clues in order to determine if the scene in the miniature ⑤ resulted from an accident or a violent crime. The detectives learned to notice tiny details, and to observe a scene without destroying any evidence. By developing their observation skills, they were able to improve their ability to solve crime cases."}, "14": {"label": "14번", "type": "문맥상 어휘", "score": "3.5점", "correctAnswer": "②", "answerItems": [{"label": "14번", "answer": "②", "note": ""}], "explanation": "14번: 기자의 취재원 보호 특권을 인정해서는 안 된다는 입장이므로 agree → disagree입니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">14. 다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것을 고르시오.</div><div class=\"given\"><p>In general, protecting sources has not been easy. Journalists argue that they should have an automatic right to ① <u>hide</u> the identity of their sources (and related notes and videos) if they are questioned about those sources in a courtroom. Many police and government investigators ② <u>agree</u> with this claim, arguing that journalists are no different from anyone else and shouldn’t have the privilege of protecting people who may be lawbreakers. Journalists reply that people who might be afraid to speak to government authorities (possibly because they are speaking against those authorities or because they are criminals) may talk to reporters if they believe they will be ③ <u>safe</u> from retaliation. Being able to talk to such people is ④ <u>essential</u> to covering the world, journalists argue. Forcing journalists to ⑤ <u>expose</u> the identity of their sources could deter people from talking to them and so harm the public interest.</p></div><div class=\"text-options grammar-options\"><div>① hide</div><div>② agree</div><div>③ safe</div><div>④ essential</div><div>⑤ expose</div></div></div>", "layout": "standard", "members": ["14"], "sourceText": "\nIn general, protecting sources has not been easy. Journalists argue that they should have an automatic right to ① hide the identity of their sources (and related notes and videos) if they are questioned about those sources in a courtroom. Many police and government investigators ② agree with this claim, arguing that journalists are no different from anyone else and shouldn’t have the privilege of protecting people who may be lawbreakers. Journalists reply that people who might be afraid to speak to government authorities (possibly because they are speaking against those authorities or because they are criminals) may talk to reporters if they believe they will be ③ safe from retaliation. Being able to talk to such people is ④ essential to covering the world, journalists argue. Forcing journalists to ⑤ expose the identity of their sources could deter people from talking to them and so harm the public interest."}, "15": {"label": "15번", "type": "문맥상 어휘", "score": "3.6점", "correctAnswer": "②", "answerItems": [{"label": "15번", "answer": "②", "note": ""}], "explanation": "15번: 돈에 대한 만족은 타인·과거 소득과의 비교에 좌우되므로 absolute → relative입니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">15. 다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것을 고르시오.</div><div class=\"given\"><p>Imagine you’ve bought a nice piece of land and built a house. The house is magnificent, with at least three more bedrooms than you need. One year later, somebody else buys the neighboring plot and constructs a house so ① <u>fancy</u> it makes yours look like a garden shed. What happens? Your blood pressure rises and your life satisfaction drops — even though you’re still living very well. Money is ② <u>absolute</u>. Not just in comparison to others, but in comparison to your past. If you earned $50,000 per year during the first half of your career and today you earn $75,000, you’ll be ③ <u>more</u> satisfied than if you first earned $75,000 and now earn just $60,000. This is despite the fact that, averaging the figures, you come out ④ <u>ahead</u> in the second scenario. Simply put, the definition of the wealth over the poverty line is ⑤ <u>subjective</u>. But this is good news; it means it’s up to you whether money makes you happy or not.</p></div><div class=\"text-options grammar-options\"><div>① fancy</div><div>② absolute</div><div>③ more</div><div>④ ahead</div><div>⑤ subjective</div></div></div>", "layout": "standard", "members": ["15"], "sourceText": "\nImagine you’ve bought a nice piece of land and built a house. The house is magnificent, with at least three more bedrooms than you need. One year later, somebody else buys the neighboring plot and constructs a house so ① fancy it makes yours look like a garden shed. What happens? Your blood pressure rises and your life satisfaction drops — even though you’re still living very well. Money is ② absolute. Not just in comparison to others, but in comparison to your past. If you earned $50,000 per year during the first half of your career and today you earn $75,000, you’ll be ③ more satisfied than if you first earned $75,000 and now earn just $60,000. This is despite the fact that, averaging the figures, you come out ④ ahead in the second scenario. Simply put, the definition of the wealth over the poverty line is ⑤ subjective. But this is good news; it means it’s up to you whether money makes you happy or not."}, "16": {"label": "16번", "type": "빈칸 추론", "score": "3.8점", "correctAnswer": "①", "answerItems": [{"label": "16번", "answer": "①", "note": ""}], "explanation": "16번: 도박사의 오류는 독립적인 무작위 사건들이 서로 상쇄한다(offset)는 잘못된 가정입니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">16. 다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>An objectively obtained probability is not a guarantee. Although in the long run, we expect a coin to come up heads half the time, probability is not a self-correcting process. The coin has no memory, knowledge, willpower, or volition. There is not some overlord of the theory of probability making sure that everything works out just the way you expect. If you get “heads” ten times in a row, the probability of the coin coming up “tails” on the next toss is still 50%. Tails is not more likely and it is not “due.” The gambler’s fallacy rests on the false assumption that separate random events naturally <span class=\"answer-blank wide-blank\">&nbsp;</span> one another, and it has made many casino owners, including Steve Wynn, very wealthy. Millions of people have continued to put money into slot machines under the illusion that their payout is due. It’s true that probabilities tend to even out, but only in the long run. And that long run can take more time and money than anyone has.</p></div><div class=\"text-options\"><div>① offset</div><div>② repeat</div><div>③ attract</div><div>④ predict</div><div>⑤ contradict</div></div></div>", "layout": "standard", "members": ["16"], "sourceText": "\nAn objectively obtained probability is not a guarantee. Although in the long run, we expect a coin to come up heads half the time, probability is not a self-correcting process. The coin has no memory, knowledge, willpower, or volition. There is not some overlord of the theory of probability making sure that everything works out just the way you expect. If you get “heads” ten times in a row, the probability of the coin coming up “tails” on the next toss is still 50%. Tails is not more likely and it is not “due.” The gambler’s fallacy rests on the false assumption that separate random events naturally ____________________ one another, and it has made many casino owners, including Steve Wynn, very wealthy. Millions of people have continued to put money into slot machines under the illusion that their payout is due. It’s true that probabilities tend to even out, but only in the long run. And that long run can take more time and money than anyone has.\n① offset　　② repeat\n③ attract　　④ predict\n⑤ contradict"}, "17": {"label": "17번", "type": "빈칸 추론", "score": "3.7점", "correctAnswer": "④", "answerItems": [{"label": "17번", "answer": "④", "note": ""}], "explanation": "17번: 동기는 고정된 것이 아니라 현재 상황에 따라 달라지므로 situational입니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">17. 다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Motivation is what helps us change ourselves, our situation, or our environment. All animals have motivation, it’s what stimulates them to find food, a safe place to sleep, and a mate. Contrary to popular belief, motivation isn’t a static thing that you either do or don’t have. It comes and goes. All animals appear to be motivated to secure food, safety, and companionship, but basically no one wants these things all the time. As humans, we’re motivated by far more than basic survival needs, but even still, we don’t pursue social acceptance, fast cars, or fancy jewelry all the time. Motivation is <span class=\"answer-blank wide-blank\">&nbsp;</span>, and it’s highly influenced by what’s going on right now. For example, people love eating, but when we just loaded up at the buffet, we’re less motivated to seek out food than if we haven’t eaten in a while.</p></div><div class=\"text-options\"><div>① essential</div><div>② individual</div><div>③ universal</div><div>④ situational</div><div>⑤ hardwired</div></div></div>", "layout": "standard", "members": ["17"], "sourceText": "\nMotivation is what helps us change ourselves, our situation, or our environment. All animals have motivation, it’s what stimulates them to find food, a safe place to sleep, and a mate. Contrary to popular belief, motivation isn’t a static thing that you either do or don’t have. It comes and goes. All animals appear to be motivated to secure food, safety, and companionship, but basically no one wants these things all the time. As humans, we’re motivated by far more than basic survival needs, but even still, we don’t pursue social acceptance, fast cars, or fancy jewelry all the time. Motivation is ____________________, and it’s highly influenced by what’s going on right now. For example, people love eating, but when we just loaded up at the buffet, we’re less motivated to seek out food than if we haven’t eaten in a while.\n① essential　　② individual\n③ universal　　④ situational\n⑤ hardwired"}, "18": {"label": "18번", "type": "빈칸 추론", "score": "3.9점", "correctAnswer": "⑤", "answerItems": [{"label": "18번", "answer": "⑤", "note": ""}], "explanation": "18번: 진화는 복잡성의 일방적 증가가 아니라, 다양한 생물이 접근 가능한 생태적 공간을 차지하도록 해 왔습니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">18. 다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Life on Earth is not defined solely by the largest creatures that we see inhabiting the lands and the oceans of the planet, even though those are the ones with which we are most familiar. Rather, it appears that the most abundant life on Earth may also be the simplest life — bacteria. In this sense, we cannot view the evolution of life on Earth as being a continuing evolution toward more-complex organisms. All the life that exists today is the equal product of 4 b.y. of evolution, whether it be the simplest bacteria, the smallest plants, humans, or the largest organisms on the planet. That is, evolution has allowed organisms <span class=\"answer-blank wide-blank\">&nbsp;</span>. The largest species — those that we see on the surface of the planet — are in some sense no more evolved than the simplest bacteria.</p></div><div class=\"text-options\"><div>① to follow the hierarchy to avoid unnecessary competition</div><div>② to change the space advantageous for them to meet their needs</div><div>③ to evolve while recognizing their strength and weakness for survival</div><div>④ to cooperate and compete in order to achieve balance in ecosystem</div><div>⑤ to develop to occupy nearly all of the accessible ecological space</div></div></div>", "layout": "standard", "members": ["18"], "sourceText": "\nLife on Earth is not defined solely by the largest creatures that we see inhabiting the lands and the oceans of the planet, even though those are the ones with which we are most familiar. Rather, it appears that the most abundant life on Earth may also be the simplest life — bacteria. In this sense, we cannot view the evolution of life on Earth as being a continuing evolution toward more-complex organisms. All the life that exists today is the equal product of 4 b.y. of evolution, whether it be the simplest bacteria, the smallest plants, humans, or the largest organisms on the planet. That is, evolution has allowed organisms ____________________. The largest species — those that we see on the surface of the planet — are in some sense no more evolved than the simplest bacteria.\n① to follow the hierarchy to avoid unnecessary competition\n② to change the space advantageous for them to meet their needs\n③ to evolve while recognizing their strength and weakness for survival\n④ to cooperate and compete in order to achieve balance in ecosystem\n⑤ to develop to occupy nearly all of the accessible ecological space"}, "19": {"label": "19번", "type": "빈칸 추론", "score": "4.0점", "correctAnswer": "④", "answerItems": [{"label": "19번", "answer": "④", "note": ""}], "explanation": "19번: 사람을 단순한 범주로 분류하면 그 사람에 대한 진정한 이해를 방해합니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">19. 다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>We like to put people into categories. Categories are simple and safe — black or white, good or evil. They save us the effort of looking beyond our own biases to become genuinely curious about someone else. In fact, categories <span class=\"answer-blank wide-blank\">&nbsp;</span>. While it’s easy to assume that the person who dings your car and drives off is an awful person, the truth is there’s probably a lot more to it. Similarly, if someone you love or admire is accused of doing something hurtful, you might jump to their defense. “Oh, they didn’t mean it,” you might say. “They just made a mistake.” Some would prefer to be willfully blind to the fact that a good or kind person did a bad thing if it allows them to sustain an uncomplicated way of viewing the world. We would rather judge people by who we believe them to be rather than by their actions. Conversely, we like to imagine that one bad action can determine a person’s overall character or humanity. It doesn’t.</p></div><div class=\"text-options\"><div>① provide a reliable standard for distinguishing good from evil</div><div>② cause us to separate a person’s true character from their actions</div><div>③ result in overestimating the psychological complexity of strangers</div><div>④ hinder our genuine understanding by oversimplifying others’ identities</div><div>⑤ trigger unnecessary interpersonal conflicts by exposing our hidden biases</div></div></div>", "layout": "standard", "members": ["19"], "sourceText": "\nWe like to put people into categories. Categories are simple and safe — black or white, good or evil. They save us the effort of looking beyond our own biases to become genuinely curious about someone else. In fact, categories ____________________. While it’s easy to assume that the person who dings your car and drives off is an awful person, the truth is there’s probably a lot more to it. Similarly, if someone you love or admire is accused of doing something hurtful, you might jump to their defense. “Oh, they didn’t mean it,” you might say. “They just made a mistake.” Some would prefer to be willfully blind to the fact that a good or kind person did a bad thing if it allows them to sustain an uncomplicated way of viewing the world. We would rather judge people by who we believe them to be rather than by their actions. Conversely, we like to imagine that one bad action can determine a person’s overall character or humanity. It doesn’t.\n① provide a reliable standard for distinguishing good from evil\n② cause us to separate a person’s true character from their actions\n③ result in overestimating the psychological complexity of strangers\n④ hinder our genuine understanding by oversimplifying others’ identities\n⑤ trigger unnecessary interpersonal conflicts by exposing our hidden biases"}, "20": {"label": "20번", "type": "무관한 문장", "score": "3.6점", "correctAnswer": "③", "answerItems": [{"label": "20번", "answer": "③", "note": ""}], "explanation": "20번: 변하지 않는 우주에 관한 설명 중 아인슈타인의 철학·음악 분야 전문성은 무관합니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">20. 다음 글에서 전체 흐름과 관계 없는 것은?</div><div class=\"given\"><p>To the ancients, looking out at the night sky, the Universe seemed eternal and unchanging. Right up until the 1920s, what we now know to be the Milky Way galaxy, an island of a few hundred billion stars, was thought to be the entire Universe. ① Within this universe, individual stars might be born, live and die, but the overall appearance always remained the same, like a forest in which individual trees live and die without changing the overall appearance. ② The idea of an unchanging Universe was so deeply rooted that even Albert Einstein, usually willing to entertain new ideas, accepted it without question. ③ Beyond his scientific achievements, he was also widely recognized as an expert in various other fields, such as philosophy and music. ④ When he applied the equations of his general theory of relativity to describe the behavior of the entire Universe (all of space and time), he found that the mathematics said that the Universe could not be static, but must be either expanding or contracting. ⑤ This seemed so improbable to him that he added an extra factor to the equations, called the cosmological constant, to hold everything still.</p></div></div>", "layout": "standard", "members": ["20"], "sourceText": "\nTo the ancients, looking out at the night sky, the Universe seemed eternal and unchanging. Right up until the 1920s, what we now know to be the Milky Way galaxy, an island of a few hundred billion stars, was thought to be the entire Universe. ① Within this universe, individual stars might be born, live and die, but the overall appearance always remained the same, like a forest in which individual trees live and die without changing the overall appearance. ② The idea of an unchanging Universe was so deeply rooted that even Albert Einstein, usually willing to entertain new ideas, accepted it without question. ③ Beyond his scientific achievements, he was also widely recognized as an expert in various other fields, such as philosophy and music. ④ When he applied the equations of his general theory of relativity to describe the behavior of the entire Universe (all of space and time), he found that the mathematics said that the Universe could not be static, but must be either expanding or contracting. ⑤ This seemed so improbable to him that he added an extra factor to the equations, called the cosmological constant, to hold everything still."}, "21": {"label": "21번", "type": "글의 순서", "score": "3.7점", "correctAnswer": "③", "answerItems": [{"label": "21번", "answer": "③", "note": ""}], "explanation": "21번: B → C → A", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">21. 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Compean, an experienced hiker who knew the area well, went on a hike alone on April 12. However, a recent forest fire had destroyed some signs, which caused him to take a wrong turn and get lost.</p></div><p>(A) The picture shared by the police was seen by a Californian named Ben Kuo. When Kuo saw the black ash on Compean’s legs, it reminded him of a recent forest fire. From the plants and trees in Compean’s picture, Kuo guessed that it must be the south side of the mountain. As a final step, Kuo compared the view in Compean’s picture with more satellite images. Finally, he found a match and provided the police with Compean’s probable location.</p><p>(B) Compean was deep in the forest, so his cell phone couldn’t get a signal. He climbed up to a higher spot and found a weak signal. He used the last of his battery to send a text message to his friend. He also sent a picture to show his surroundings. Compean’s friend shared the message and the picture with the local police.</p><p>(C) When the local police were informed of the missing hiker, they immediately sent a rescue team. However, the picture didn’t help the police much because the quality was poor due to the weak signal, and his location settings were turned off. So they decided to use social media to find out if anyone could find clues in the picture. They posted the picture and asked if anyone recognized the scenery.</p><div class=\"text-options\"><div>① (A) - (C) - (B)</div><div>② (B) - (A) - (C)</div><div>③ (B) - (C) - (A)</div><div>④ (C) - (A) - (B)</div><div>⑤ (C) - (B) - (A)</div></div></div>", "layout": "standard", "members": ["21"], "sourceText": "\nCompean, an experienced hiker who knew the area well, went on a hike alone on April 12. However, a recent forest fire had destroyed some signs, which caused him to take a wrong turn and get lost.\n(A) The picture shared by the police was seen by a Californian named Ben Kuo. When Kuo saw the black ash on Compean’s legs, it reminded him of a recent forest fire. From the plants and trees in Compean’s picture, Kuo guessed that it must be the south side of the mountain. As a final step, Kuo compared the view in Compean’s picture with more satellite images. Finally, he found a match and provided the police with Compean’s probable location.\n(B) Compean was deep in the forest, so his cell phone couldn’t get a signal. He climbed up to a higher spot and found a weak signal. He used the last of his battery to send a text message to his friend. He also sent a picture to show his surroundings. Compean’s friend shared the message and the picture with the local police.\n(C) When the local police were informed of the missing hiker, they immediately sent a rescue team. However, the picture didn’t help the police much because the quality was poor due to the weak signal, and his location settings were turned off. So they decided to use social media to find out if anyone could find clues in the picture. They posted the picture and asked if anyone recognized the scenery.\n① (A) - (C) - (B)　　② (B) - (A) - (C)\n③ (B) - (C) - (A)　　④ (C) - (A) - (B)\n⑤ (C) - (B) - (A)"}, "22": {"label": "22번", "type": "글의 순서", "score": "3.9점", "correctAnswer": "⑤", "answerItems": [{"label": "22번", "answer": "⑤", "note": ""}], "explanation": "22번: C → B → A", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">22. 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>In fashion, designers build fortunes based on copying each other’s creations. The labor that goes into original designs is not protected. Knockoffs are not theft. They are perfectly legal.</p></div><p>(A) In many pockets of the modern economy — chefs’ recipes, coaches’ sports plays, stand-up comedians’ routines, and numerous other creative arenas — we have decided that vibrant competition and unrestricted innovation matter more than rewarding creative labor with ownership.</p><p>(B) Based on that law, the industry has filed, settled, or threatened legal action against at least thirty thousand people. Unfortunately for the big music labels, all that activity hasn’t ended illegal downloading — but it did turn popular opinion against them.</p><p>(C) In other words, the rule is often I reap what you sow. Every year fashion designers push Congress to change the rules, so they can reap what they “sew,” but they lose. The music recording industry, on the other hand, was more effective than the high-end fashion houses at lobbying Congress. It secured legislation so that digital music conforms to the industry’s ownership story.</p><div class=\"text-options\"><div>① (A) - (C) - (B)</div><div>② (B) - (A) - (C)</div><div>③ (B) - (C) - (A)</div><div>④ (C) - (A) - (B)</div><div>⑤ (C) - (B) - (A)</div></div></div>", "layout": "standard", "members": ["22"], "sourceText": "\nIn fashion, designers build fortunes based on copying each other’s creations. The labor that goes into original designs is not protected. Knockoffs are not theft. They are perfectly legal.\n(A) In many pockets of the modern economy — chefs’ recipes, coaches’ sports plays, stand-up comedians’ routines, and numerous other creative arenas — we have decided that vibrant competition and unrestricted innovation matter more than rewarding creative labor with ownership.\n(B) Based on that law, the industry has filed, settled, or threatened legal action against at least thirty thousand people. Unfortunately for the big music labels, all that activity hasn’t ended illegal downloading — but it did turn popular opinion against them.\n(C) In other words, the rule is often I reap what you sow. Every year fashion designers push Congress to change the rules, so they can reap what they “sew,” but they lose. The music recording industry, on the other hand, was more effective than the high-end fashion houses at lobbying Congress. It secured legislation so that digital music conforms to the industry’s ownership story.\n① (A) - (C) - (B)　　② (B) - (A) - (C)\n③ (B) - (C) - (A)　　④ (C) - (A) - (B)\n⑤ (C) - (B) - (A)"}, "23": {"label": "23번", "type": "글의 순서", "score": "3.7점", "correctAnswer": "④", "answerItems": [{"label": "23번", "answer": "④", "note": ""}], "explanation": "23번: C → A → B", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">23. 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Hudson Hoagland, an American doctor, had shown in the 1930s that the ability to ‘count’ time was temperature dependent.</p></div><p>(A) In truth, his trip had only taken about 20 minutes. His wife’s misperception interested Hoagland. Without telling her what he was thinking, he asked her to estimate the duration of a minute by counting to 60 at the rate of one number per second.</p><p>(B) It turned out that his wife’s estimate of a minute was only 30 seconds long. She did much better as her temperature fell. Her ability to time intervals obviously varied with temperature, so her interval timer worked in an entirely different way to a temperature-compensated circadian clock.</p><p>(C) His wife was ill and had a very high fever, somewhere around 39°C. Hoagland needed to go to the drugstore for some medication for her. When he got home his wife was quite upset with him for taking so long, claiming that he had been away for hours.</p><div class=\"text-options\"><div>① (A) - (C) - (B)</div><div>② (B) - (A) - (C)</div><div>③ (B) - (C) - (A)</div><div>④ (C) - (A) - (B)</div><div>⑤ (C) - (B) - (A)</div></div></div>", "layout": "standard", "members": ["23"], "sourceText": "\nHudson Hoagland, an American doctor, had shown in the 1930s that the ability to ‘count’ time was temperature dependent.\n(A) In truth, his trip had only taken about 20 minutes. His wife’s misperception interested Hoagland. Without telling her what he was thinking, he asked her to estimate the duration of a minute by counting to 60 at the rate of one number per second.\n(B) It turned out that his wife’s estimate of a minute was only 30 seconds long. She did much better as her temperature fell. Her ability to time intervals obviously varied with temperature, so her interval timer worked in an entirely different way to a temperature-compensated circadian clock.\n(C) His wife was ill and had a very high fever, somewhere around 39°C. Hoagland needed to go to the drugstore for some medication for her. When he got home his wife was quite upset with him for taking so long, claiming that he had been away for hours.\n① (A) - (C) - (B)　　② (B) - (A) - (C)\n③ (B) - (C) - (A)　　④ (C) - (A) - (B)\n⑤ (C) - (B) - (A)"}, "24": {"label": "24번", "type": "글의 순서", "score": "3.8점", "correctAnswer": "③", "answerItems": [{"label": "24번", "answer": "③", "note": ""}], "explanation": "24번: B → C → A", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">24. 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>By moving our bodies, we activate a deeply ingrained and mostly unconscious metaphor connecting dynamic motion with dynamic thinking. Call to mind the words we use when we can’t seem to come up with an original idea — we’re “stuck,” “in a rut” — and those we reach for when we feel visited by the muse.</p></div><p>(A) The participants who did their thinking literally “outside the box” came up with a list of creative solutions that was, on average, 20 percent longer than the list produced by those who brainstormed inside the box.</p><p>(B) Then we’re “on a roll,” our thoughts are “flowing.” Research has demonstrated that people can be placed in a creative state of mind by physically acting out creativity-related figures of speech — like “thinking outside the box.”</p><p>(C) Psychologist Evan Polman designed an experiment in which participants were asked to complete a creative thinking task. Some students carried out the assignment while sitting inside a five-foot-square cardboard box; others completed the task while sitting next to the box.</p><div class=\"text-options\"><div>① (A) - (C) - (B)</div><div>② (B) - (A) - (C)</div><div>③ (B) - (C) - (A)</div><div>④ (C) - (A) - (B)</div><div>⑤ (C) - (B) - (A)</div></div></div>", "layout": "standard", "members": ["24"], "sourceText": "\nBy moving our bodies, we activate a deeply ingrained and mostly unconscious metaphor connecting dynamic motion with dynamic thinking. Call to mind the words we use when we can’t seem to come up with an original idea — we’re “stuck,” “in a rut” — and those we reach for when we feel visited by the muse.\n(A) The participants who did their thinking literally “outside the box” came up with a list of creative solutions that was, on average, 20 percent longer than the list produced by those who brainstormed inside the box.\n(B) Then we’re “on a roll,” our thoughts are “flowing.” Research has demonstrated that people can be placed in a creative state of mind by physically acting out creativity-related figures of speech — like “thinking outside the box.”\n(C) Psychologist Evan Polman designed an experiment in which participants were asked to complete a creative thinking task. Some students carried out the assignment while sitting inside a five-foot-square cardboard box; others completed the task while sitting next to the box.\n① (A) - (C) - (B)　　② (B) - (A) - (C)\n③ (B) - (C) - (A)　　④ (C) - (A) - (B)\n⑤ (C) - (B) - (A)"}, "25": {"label": "25번", "type": "문장 삽입", "score": "3.9점", "correctAnswer": "②", "answerItems": [{"label": "25번", "answer": "②", "note": ""}], "explanation": "25번: ‘조작 수단으로 사용하지 않는다’ 뒤에 Instead로 정직한 소통 방식을 설명해야 합니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">25. 주어진 문장이 들어갈 곳으로 가장 적절한 곳을 고르시오.</div><div class=\"given\"><p>Authentic storytelling does not use rational and emotional communication as a means of manipulation.</p></div><p>We are living in the age of connectivity driven by the permeating and relatively inexpensive and proliferated wireless broadband, fastest-growing mobile technology, and social media mediated peer-to-peer communication. As a result, marketing is changing with the power of authentic, relevant, and experiential storytelling. <span class=\"insertion-point\">(①)</span> Social media is shifting the power from marketers to consumers where the stories told by the consumers themselves are often more potent than the ones told by the brands. <span class=\"insertion-point\">(②)</span> Instead, it uses the power of storytelling honestly and sincerely to connect with the customer at a deeper level. <span class=\"insertion-point\">(③)</span> Authentic storytelling invites customers on a transformational journey through a rational message wrapped in emotion. <span class=\"insertion-point\">(④)</span> “A well-told story captures our attention, holds us in suspense, and pays off with a meaningful emotional experience.” <span class=\"insertion-point\">(⑤)</span> A well-told brand story uses characters through whose eyes the customer can see the world and be empathetic for the character, who therefore can relate to the character.</p></div>", "layout": "standard", "members": ["25"], "sourceText": "\nAuthentic storytelling does not use rational and emotional communication as a means of manipulation.\nWe are living in the age of connectivity driven by the permeating and relatively inexpensive and proliferated wireless broadband, fastest-growing mobile technology, and social media mediated peer-to-peer communication. As a result, marketing is changing with the power of authentic, relevant, and experiential storytelling. ( ① ) Social media is shifting the power from marketers to consumers where the stories told by the consumers themselves are often more potent than the ones told by the brands. ( ② ) Instead, it uses the power of storytelling honestly and sincerely to connect with the customer at a deeper level. ( ③ ) Authentic storytelling invites customers on a transformational journey through a rational message wrapped in emotion. ( ④ ) “A well-told story captures our attention, holds us in suspense, and pays off with a meaningful emotional experience.” ( ⑤ ) A well-told brand story uses characters through whose eyes the customer can see the world and be empathetic for the character, who therefore can relate to the character."}, "26": {"label": "26번", "type": "문장 삽입", "score": "3.6점", "correctAnswer": "⑤", "answerItems": [{"label": "26번", "answer": "⑤", "note": ""}], "explanation": "26번: 몸이 계속 여름이라고 착각함 → 겨울에 대비해 체중을 늘림 → ‘끝없는 여름’으로 정리됩니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">26. 주어진 문장이 들어갈 곳으로 가장 적절한 곳을 고르시오.</div><div class=\"given\"><p>This prompts us to constantly pack on pounds in anticipation of the shorter daylight hours of upcoming winter, which never arrives, thanks to electric lights.</p></div><p>Modern life is dominated by blue light, creating an unnatural and practically nonstop exposure to this wavelength. <span class=\"insertion-point\">(①)</span> Televisions, cell phones, tablets, other electronic devices, and even certain energy-saving lightbulbs emit light in the blue range of the spectrum, which is known to interfere with sleep. <span class=\"insertion-point\">(②)</span> Blue light suppresses the production of melatonin, the hormone that helps you fall asleep, and sleep deprivation is associated with obesity. <span class=\"insertion-point\">(③)</span> Blue light also stimulates ghrelin and cortisol, which are, respectively, the “hunger” and “awake” hormones. <span class=\"insertion-point\">(④)</span> And because our genetic programming associates blue light with daylight, this constant exposure tricks our bodies into thinking we’re perpetually in the season with longer daylight hours (summer). <span class=\"insertion-point\">(⑤)</span> Now that this ancient rhythm has been completely disrupted, we live in 365 days of “endless summer.”</p></div>", "layout": "standard", "members": ["26"], "sourceText": "\nThis prompts us to constantly pack on pounds in anticipation of the shorter daylight hours of upcoming winter, which never arrives, thanks to electric lights.\nModern life is dominated by blue light, creating an unnatural and practically nonstop exposure to this wavelength. ( ① ) Televisions, cell phones, tablets, other electronic devices, and even certain energy-saving lightbulbs emit light in the blue range of the spectrum, which is known to interfere with sleep. ( ② ) Blue light suppresses the production of melatonin, the hormone that helps you fall asleep, and sleep deprivation is associated with obesity. ( ③ ) Blue light also stimulates ghrelin and cortisol, which are, respectively, the “hunger” and “awake” hormones. ( ④ ) And because our genetic programming associates blue light with daylight, this constant exposure tricks our bodies into thinking we’re perpetually in the season with longer daylight hours (summer). ( ⑤ ) Now that this ancient rhythm has been completely disrupted, we live in 365 days of “endless summer.”"}, "27": {"label": "27번", "type": "요약문 완성", "score": "3.7점", "correctAnswer": "①", "answerItems": [{"label": "27번", "answer": "①", "note": ""}], "explanation": "27번: 노동의 다양화로 도덕이 복잡해지고(complicated), 기존의 성별(gender) 분업을 넘어선 역할을 인정하게 됩니다.", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">27. 다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>At the dawn of history, some of us became herders, others hunters and others farmers. This development of individual skills was undoubtedly a difficult challenge because it required a whole new way to understand right and wrong. For the first time in the history of our species, labor was not just divided into two kinds, the male kind and the female kind. Suddenly, one’s labor might be any one of a number of different things. Within the sexes, one male or female could be doing something different from other males or females and still must be looked upon as doing right. How do we know what is right when everyone is doing his or her own thing? Morality expanded in complexity as the notion of individuality and community became more sophisticated. Before we could do different things, the idea that different things could be done needed to be accepted.</p></div><div class=\"summary-arrow\">↓</div><div class=\"given\"><p>Labor diversification forced morality to grow <span class=\"answer-blank summary-blank\">(A)</span>, accepting individual roles beyond traditional <span class=\"answer-blank summary-blank\">(B)</span> divisions.</p></div><table class=\"summary-options\"><colgroup><col class=\"choice-number\"><col><col></colgroup><thead><tr><th></th><th><p>(A)</p></th><th><p>(B)</p></th></tr></thead><tbody><tr><td><p>①</p></td><td><p>complicated</p></td><td><p>gender</p></td></tr><tr><td><p>②</p></td><td><p>vague</p></td><td><p>social</p></td></tr><tr><td><p>③</p></td><td><p>complex</p></td><td><p>economic</p></td></tr><tr><td><p>④</p></td><td><p>strict</p></td><td><p>gender</p></td></tr><tr><td><p>⑤</p></td><td><p>simplistic</p></td><td><p>economic</p></td></tr></tbody></table></div>", "layout": "standard", "members": ["27"], "sourceText": "\nAt the dawn of history, some of us became herders, others hunters and others farmers. This development of individual skills was undoubtedly a difficult challenge because it required a whole new way to understand right and wrong. For the first time in the history of our species, labor was not just divided into two kinds, the male kind and the female kind. Suddenly, one’s labor might be any one of a number of different things. Within the sexes, one male or female could be doing something different from other males or females and still must be looked upon as doing right. How do we know what is right when everyone is doing his or her own thing? Morality expanded in complexity as the notion of individuality and community became more sophisticated. Before we could do different things, the idea that different things could be done needed to be accepted.\n↓\nLabor diversification forced morality to grow _____(A)_____, accepting individual roles beyond traditional _____(B)_____ divisions.\n | (A) | (B)\n① | complicated | gender\n② | vague | social\n③ |
