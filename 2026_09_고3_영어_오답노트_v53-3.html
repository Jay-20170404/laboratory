<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 9월 고3 영어 모의평가 오답노트 시스템 (v53-3)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Malgun Gothic", sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #1a202c;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 사이드바 스타일 (화면 전용) */
        .sidebar {
            width: 320px;
            background-color: #1a202c;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d3748;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            background-color: #2d3748;
            border-bottom: 1px solid #4a5568;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            color: #63b3ed;
            line-height: 1.4;
        }

        .sidebar-header p {
            margin: 5px 0 0 0;
            font-size: 0.78rem;
            color: #a0aec0;
        }

        .bulk-print-controls {
            padding: 12px 20px;
            background-color: #2d3748;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #4a5568;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-sm-primary {
            background-color: #3182ce;
            color: white;
        }

        .btn-sm-primary:hover {
            background-color: #2b6cb0;
        }

        .btn-sm-secondary {
            background-color: #4a5568;
            color: #e2e8f0;
        }

        .btn-sm-secondary:hover {
            background-color: #718096;
        }

        .btn-sm-success {
            background-color: #38a169;
            color: white;
        }

        .btn-sm-success:hover {
            background-color: #2f855a;
        }

        /* 문항 리스트 */
        .question-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .question-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background-color: #2d3748;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s;
            color: #e2e8f0;
        }

        .question-item:hover {
            background-color: #4a5568;
        }

        .question-item.active {
            background-color: #3182ce;
            border-color: #63b3ed;
            color: white;
        }

        .question-item-chk {
            margin-right: 10px;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .question-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .question-item-num {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .question-item-type {
            font-size: 0.75rem;
            color: #cbd5e0;
        }
        .question-item.active .question-item-type {
            color: #ebf8ff;
        }

        /* 메인 워크스페이스 */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #f7fafc;
            overflow: hidden;
            position: relative;
        }

        .workspace-header {
            height: 70px;
            background-color: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .active-title-block {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .active-num-tag {
            background-color: #ebf8ff;
            color: #2b6cb0;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 1.1rem;
            border: 1px solid #bee3f8;
        }

        .active-type-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #2d3748;
        }

        .print-btn-main {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }
        .print-btn-main:hover {
            background-color: #2b6cb0;
        }

        /* 오답카드 스크롤 영역 */
        .workspace-scrollable {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* 공통 A4 규격 카드 */
        .a4-page {
            background-color: white;
            width: 210mm;
            height: 297mm;
            padding: 10mm 15mm;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
            flex-shrink: 0;
        }

        /* 카드 헤더 */
        .card-inner-header {
            border-bottom: 2px solid #1a202c;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 4px;
        }

        .card-main-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1a202c;
        }

        .card-label {
            font-size: 1.2rem;
            font-weight: 800;
            color: #2b6cb0;
            letter-spacing: 2px;
        }

        .card-meta-row {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: #4a5568;
        }

        .meta-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .meta-group span {
            color: #718096;
            font-weight: 500;
        }

        .meta-line {
            border-bottom: 1px solid #cbd5e0;
            width: 42px;
            display: inline-block;
            height: 16px;
        }

        .meta-line-lg {
            border-bottom: 1px solid #cbd5e0;
            width: 140px;
            display: inline-block;
            height: 16px;
        }

        /* 레이아웃 칼럼 분할 */
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        /* 1페이지 세로 기둥 분할 구조 (18~40번용) */
        .card-body-layout {
            width: 100%;
            height: 227mm;
        }

        .col-left {
            width: 74%;
            float: left;
            height: 100%;
            padding-right: 12px;
            display: flex;
            flex-direction: column;
        }

        .col-right {
            width: 26%;
            float: right;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* 개별 영역의 세로 길이 독립 제어를 위한 래퍼 */
        .passage-wrapper {
            display: flex;
            flex-direction: column;
            height: 176mm;
            margin-bottom: 5mm;
        }

        .analysis-wrapper {
            display: flex;
            flex-direction: column;
            height: 46mm;
        }

        .reason-wrapper {
            display: flex;
            flex-direction: column;
            height: 41mm;
            margin-bottom: 10mm;
        }

        .correct-wrapper {
            display: flex;
            flex-direction: column;
            height: 56mm;
            margin-bottom: 10mm;
        }

        .vocab-wrapper {
            display: flex;
            flex-direction: column;
            height: 110mm;
        }

        /* 구획 타이틀 */
        .section-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #2b6cb0;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 10px;
            background-color: #3182ce;
            border-radius: 1px;
        }

        /* 본문 및 보기 텍스트박스 */
        .passage-box {
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            background-color: #fafbfe;
            padding: 10px 12px;
            font-size: 0.81rem;
            line-height: 1.5;
            white-space: pre-wrap;
            color: #2d3748;
            flex: 1;
            overflow-y: auto;
        }

        /* 필기용 줄눈(Ruled Lines) 스타일 */
        .ruled-box {
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            padding: 8px 10px;
            background-color: #ffffff;
            font-size: 0.78rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .reason-box {
            height: 100%;
        }

        .correct-box {
            height: 100%;
        }

        .analysis-box {
            height: 100%;
        }

        .vocab-box {
            height: 100%;
        }

        .reason-checkboxes {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 6px;
            border-bottom: 1px dashed #cbd5e0;
            padding-bottom: 6px;
        }

        .chk-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            color: #4a5568;
        }

        .chk-square {
            width: 10px;
            height: 10px;
            border: 1px solid #cbd5e0;
            background-color: white;
            display: inline-block;
            border-radius: 2px;
        }

        /* 필기 공간 줄눈 처리 */
        .ruled-lines-area {
            flex: 1;
            background-image: linear-gradient(to bottom, transparent 21px, #edf2f7 22px);
            background-size: 100% 22px;
            line-height: 22px;
        }

        /* 단어장 테이블 */
        .vocab-table-container {
            flex: 1;
            overflow: hidden;
        }

        .vocab-table {
            width: 100%;
            border-collapse: collapse;
        }

        .vocab-table th, .vocab-table td {
            border-bottom: 1px solid #e2e8f0;
            padding: 5px 4px;
            font-size: 0.72rem;
            text-align: left;
            height: 23px;
        }

        .vocab-table th {
            color: #4a5568;
            font-weight: 700;
            border-bottom: 2px solid #cbd5e0;
            background-color: #f7fafc;
        }

        /* 2페이지 레이아웃 (41~42번, 43~45번 장문) */
        .long-page-layout {
            width: 100%;
            height: 195mm;
        }

        .col-half-left {
            width: 58%;
            float: left;
            height: 100%;
            padding-right: 15px;
            display: flex;
            flex-direction: column;
        }

        .col-half-right {
            width: 42%;
            float: right;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* 장문 분석 페이지 2 레이아웃 */
        .analysis-page2-middle {
            width: 100%;
            height: 100mm;
            margin-bottom: 10px;
        }

        .analysis-page2-bottom {
            width: 100%;
            height: 85mm;
        }

        .options-block {
            margin-top: 10px;
            font-size: 0.78rem;
            line-height: 1.45;
            color: #4a5568;
            border-top: 1px dashed #cbd5e0;
            padding-top: 8px;
        }

        .options-block div {
            margin-bottom: 2px;
        }

        /* 인쇄 전용 영역 */
        #print-container {
            display: none;
        }

        /* 인쇄 및 화면 전환 최적화 */
        @media print {
            html, body {
                display: block !important;
                width: 210mm !important;
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                background-color: white !important;
                overflow: visible !important;
            }

            .sidebar, .workspace-header, .workspace-scrollable {
                display: none !important;
            }

            #print-container {
                display: block !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background-color: white !important;
            }

            .a4-page {
                display: flex !important;
                width: 210mm !important;
                height: auto !important;
                padding: 10mm 15mm !important;
                margin: 0 !important;
                border: none !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                page-break-after: always !important;
                page-break-inside: avoid !important;
                background-color: white !important;
            }
            .a4-page:last-child {
                page-break-after: avoid !important;
            }

        /* --- 다중 학생 오답노트 관리 전용 스타일 (v41) --- */
        .sidebar-tabs {
            display: flex;
            background-color: #2d3748;
            border-bottom: 1px solid #4a5568;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 700;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            outline: none;
        }
        .tab-btn.active {
            color: #63b3ed !important;
            border-bottom-color: #63b3ed !important;
            background-color: #1a202c;
        }
        .student-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background-color: #2d3748;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            border-left: 5px solid transparent;
            transition: all 0.2s ease-in-out;
            color: #e2e8f0;
        }
        .student-item:hover {
            background-color: #3d4a5e;
        }
        .student-item.active {
            background-color: #2b6cb0 !important;
            border-left: 6px solid #f6ad55 !important;
            color: white !important;
            box-shadow: 0 0 15px rgba(99, 179, 237, 0.45);
            transform: scale(1.02);
            transition: all 0.2s ease-in-out;
        }
        .student-item-name {
            font-weight: 700;
            font-size: 0.9rem;
        }
        .student-item-count {
            font-size: 0.72rem;
            color: #cbd5e0;
            background-color: #1a202c;
            padding: 2px 7px;
            border-radius: 10px;
            margin-left: 8px;
            font-weight: bold;
        }
        .student-item.active .student-item-count {
            background-color: #2b6cb0 !important;
            color: white !important;
        }
        .student-delete-btn {
            background: none;
            border: none;
            color: #fc8181;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            font-weight: bold;
            border-radius: 4px;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .student-delete-btn:hover {
            background-color: #e53e3e;
            color: white;
        }
        }
    </style>
</head>
<body>

    <!-- 사이드바 -->
    <div class="sidebar no-print">
        <div class="sidebar-header">
            <h2>고3 영어 오답노트 시스템 (v53-3)</h2>
            <p>2026학년도 9월 모의평가</p>
        </div>

        <!-- 학생관리 / 오답지정 탭 버튼 -->
        <div class="sidebar-tabs">
            <button class="tab-btn active" id="tab-btn-students" onclick="switchSidebarTab('students')">👤 학생 목록</button>
            <button class="tab-btn" id="tab-btn-questions" onclick="switchSidebarTab('questions')">📝 오답 지정</button>
        </div>

        <!-- 1. 학생 목록 탭 컨텐츠 -->
        <div id="tab-content-students" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
            <div class="student-add-box" style="padding: 12px 15px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid #4a5568; background-color: #2d3748;">
                <label style="font-size: 0.72rem; color: #cbd5e0; font-weight: bold; display: flex; align-items: center; gap: 4px;">
                    👤 학생 이름 등록 <span style="font-size: 0.65rem; color: #a0aec0; font-weight: normal;">(쉼표나 줄바꿈으로 다중 등록 가능)</span>
                </label>
                <div style="display: flex; gap: 8px; width: 100%;">
                    <textarea id="student-name-input" rows="2" placeholder="예: 홍길동, 김철수, 이영희" style="flex: 1; padding: 6px 10px; border-radius: 4px; border: 1px solid #4a5568; background-color: #1a202c; color: white; font-size: 0.8rem; outline: none; resize: none; font-family: inherit; line-height: 1.4; height: 38px;"></textarea>
                    <button class="btn-sm btn-sm-primary" onclick="addStudent()" style="align-self: flex-end; height: 38px; padding: 0 12px; font-weight: 700;">등록</button>
                </div>
            </div>
            
            <div id="student-print-controls-area" style="padding: 10px 15px; background-color: #24303f; border-bottom: 1px solid #4a5568; display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem;">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <input type="checkbox" id="student-all-print-chk" onchange="toggleAllStudentsPrintCheck(this.checked)" style="width: 14px; height: 14px; cursor: pointer;">
                    <span style="color: #cbd5e0; font-weight: bold; cursor: pointer;" onclick="document.getElementById('student-all-print-chk').click()">전체 학생 지정</span>
                </div>
                <span id="student-print-count-badge" style="color: #63b3ed; font-weight: bold;">0명 지정됨</span>
            </div>
            
            <div id="students-list-container" style="flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px;">
                <!-- JS 동적 생성 -->
            </div>

            <div style="padding: 15px; background-color: #2d3748; border-top: 1px solid #4a5568; display: flex; flex-direction: column; gap: 8px;">
                <button class="btn-sm btn-sm-primary" id="student-bulk-print-btn" style="width: 100%; padding: 10px; font-size: 0.85rem; background-color: #319795;" onclick="triggerSelectedStudentsBulkPrint()">🖨️ 지정 학생 일괄 인쇄 (0명)</button>
            </div>
        </div>

        <!-- 2. 오답 지정 탭 컨텐츠 -->
        <div id="tab-content-questions" style="display: none; flex-direction: column; flex: 1; overflow: hidden;">
            <div id="editing-student-banner" style="padding: 8px 15px; background-color: #2b6cb0; color: white; font-size: 0.8rem; font-weight: bold; text-align: center;">
                편집 중인 학생: 없음
            </div>
            <div class="bulk-print-controls" style="padding: 12px 20px; background-color: #2d3748; display: flex; gap: 8px; border-bottom: 1px solid #4a5568;">
                <button class="btn-sm btn-sm-secondary" style="flex: 1;" onclick="checkAllForPrint(true)">전체 선택</button>
                <button class="btn-sm btn-sm-secondary" style="flex: 1;" onclick="checkAllForPrint(false)">선택 해제</button>
                <button class="btn-sm btn-sm-primary" id="sidebar-print-btn" style="flex: 1.2;" onclick="triggerBulkPrint()">🖨️ 인쇄 (0개)</button>
            </div>

            <!-- 문항 리스트 -->
            <div class="question-list" id="question-list-container">
                <!-- JS 동적 생성 -->
            </div>

            <!-- 완료 버튼 컨테이너 -->
            <div style="padding: 15px; background-color: #2d3748; border-top: 1px solid #4a5568; display: flex; flex-direction: column; gap: 8px;">
                <button class="btn-sm btn-sm-success" style="width: 100%; padding: 10px; font-size: 0.85rem; font-weight: bold; border-radius: 4px;" onclick="switchSidebarTab('students')">✅ 완료 (학생 목록으로)</button>
            </div>
        </div>
    </div>

    <!-- 메인 워크스페이스 -->
    <div class="workspace no-print">
        <div class="workspace-header">
            <div class="active-title-block">
                <span class="active-num-tag" id="active-num-tag">18번</span>
                <span class="active-type-name" id="active-type-name">글의 목적</span>
            </div>
            
            <div style="display: flex; gap: 12px; align-items: center;">
                <!-- 뷰 전환 토글 (미리보기 vs 대시보드) -->
                <div class="view-toggle-group" style="display: flex; background-color: #edf2f7; border: 1px solid #cbd5e0; border-radius: 6px; padding: 2px;">
                    <button id="toggle-view-preview" class="toggle-view-btn" onclick="switchWorkspaceView('preview')" style="padding: 6px 14px; font-size: 0.78rem; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; transition: all 0.15s; outline: none; background-color: #3182ce; color: white;">🔍 오답노트 미리보기</button>
                    <button id="toggle-view-dashboard" class="toggle-view-btn" onclick="switchWorkspaceView('dashboard')" style="padding: 6px 14px; font-size: 0.78rem; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; transition: all 0.15s; outline: none; background: none; color: #4a5568;">📋 전체 출력 현황판</button>
                </div>

                <button class="print-btn-main" id="workspace-print-btn" onclick="triggerBulkPrint()">
                    🖨️ 선택 문항 인쇄하기
                </button>

        let activeKey = "18"; // 기본값

        window.onload = function() {
            loadStudentsData();
            buildStudentList();
            buildQuestionList();
            switchQuestion("18");
            updatePrintButtonText();
            updateStudentBanner();
        }

        // LocalStorage 기반 학생 데이터 입출력
        function loadStudentsData() {
            const saved = localStorage.getItem('incorrect_notes_students_2609_g3_v53_3');
            if (saved) {
                try {
                    studentsList = JSON.parse(saved);
                } catch(e) {
                    studentsList = [];
                }
            }
            
            // 기본 샘플 데이터 자동 생성 (처음 사용자 편의용)
            if (!studentsList || studentsList.length === 0) {
                studentsList = [
                    { id: "s-" + Date.now() + "-1", name: "홍길동", incorrectQuestions: ["18", "19", "20", "29", "41-42"], printChecked: true },
                    { id: "s-" + Date.now() + "-2", name: "김철수", incorrectQuestions: ["18", "21", "25", "33", "43-45"], printChecked: true }
                ];
                saveStudentsData();
            }
            
            // 활성 학생 설정
            if (studentsList.length > 0) {
                activeStudentId = studentsList[0].id;
            }
            
            // 인쇄 체크 기본값 보정
            studentsList.forEach(s => {
                if (s.printChecked === undefined) {
                    s.printChecked = true;
                }
            });
        }

        function saveStudentsData() {
            localStorage.setItem('incorrect_notes_students_2609_g3_v53_3', JSON.stringify(studentsList));
        }

        // 탭 제어 기능
        function switchSidebarTab(tabName) {
            const tabStudents = document.getElementById('tab-btn-students');
            const tabQuestions = document.getElementById('tab-btn-questions');
            const contentStudents = document.getElementById('tab-content-students');
            const contentQuestions = document.getElementById('tab-content-questions');

            if (tabName === 'students') {
                tabStudents.classList.add('active');
                tabQuestions.classList.remove('active');
                contentStudents.style.display = 'flex';
                contentQuestions.style.display = 'none';
            } else {
                tabQuestions.classList.add('active');
                tabStudents.classList.remove('active');
                contentStudents.style.display = 'none';
                contentQuestions.style.display = 'flex';
                
                // 오답지정 탭 전환 시 UI 갱신
                buildQuestionList();
                updatePrintButtonText();
                updateStudentBanner();
            }
        }

        // 현재 활성화된 학생 객체 가져오기
        function getActiveStudent() {
            return studentsList.find(s => s.id === activeStudentId) || null;
        }

        // 학생 추가 (v44: 쉼표, 줄바꿈, 탭을 통한 다중 일괄 등록 완벽 지원)
        function addStudent() {
            const nameInput = document.getElementById('student-name-input');
            const rawValue = nameInput.value.trim();
            if (!rawValue) {
                alert('학생 이름을 입력해 주세요!');
                return;
            }

            // 쉼표, 엔터, 탭으로 쪼개서 배열로 만듦
            const names = rawValue.split(/[\n,\t]+/).map(n => n.trim()).filter(n => n.length > 0);
            if (names.length === 0) {
                alert('유효한 학생 이름을 찾을 수 없습니다.');
                return;
            }

            let lastId = "";
            names.forEach((name, index) => {
                const id = "s-" + (Date.now() + index) + "-" + Math.floor(Math.random() * 1000);
                const newStudent = {
                    id: id,
                    name: name,
                    incorrectQuestions: [],
                    printChecked: true
                };
                studentsList.push(newStudent);
                lastId = id;
            });

            saveStudentsData();
            
            activeStudentId = lastId; // 마지막 추가된 학생을 활성 학생으로 지정
            nameInput.value = '';
            
            buildStudentList();
            updateStudentBanner();
            
            // 다중 등록 시 친절하게 수량 보고
            if (names.length > 1) {
                alert(`총 ${names.length}명의 학생이 성공적으로 한 번에 등록되었습니다!`);
            }
            
            switchSidebarTab('questions');
        }

        // 학생 삭제
        function deleteStudent(id, event) {
            if (event) event.stopPropagation();
            
            const student = studentsList.find(s => s.id === id);
            if (!student) return;
            
            if (!confirm(`정말 ${student.name} 학생의 오답노트 데이터를 삭제하시겠습니까?`)) {
                return;
            }

            studentsList = studentsList.filter(s => s.id !== id);
            saveStudentsData();

            if (activeStudentId === id) {
                activeStudentId = studentsList.length > 0 ? studentsList[0].id : "";
            }

            buildStudentList();
            updateStudentBanner();
            buildQuestionList();
            updatePrintButtonText();
            
            if (activeStudentId) {
                switchQuestion(activeKey);
            } else {
                document.getElementById('workspace-scrollable-area').innerHTML = `
                    <div style="text-align: center; color: #718096; padding-top: 100px; font-weight: bold;">
                        등록된 학생이 없습니다. 사이드바에서 학생을 먼저 추가해 주세요!
                    </div>
                `;
            }
        }

        // 학생 선택
        function selectStudent(id) {
            activeStudentId = id;
            buildStudentList();
            updateStudentBanner();
            buildQuestionList();
            updatePrintButtonText();
            switchQuestion(activeKey);
        }

            container.innerHTML = '';

            studentsList.forEach(student => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `student-item ${student.id === activeStudentId ? 'active' : ''}`;
                itemDiv.onclick = () => selectStudent(student.id);

                const leftBox = document.createElement('div');
                leftBox.style.display = 'flex';
                leftBox.style.alignItems = 'flex-start';

                const printChk = document.createElement('input');

                printChk.style.cursor = 'pointer';
                printChk.style.marginTop = '3px';
                printChk.style.width = '14px';
                printChk.style.height = '14px';

                    e.stopPropagation();

        // 전체 선택 및 해제
        function checkAllForPrint(checked) {
            Object.keys(examDatabase).forEach(key => {

                if (chk) chk.checked = checked;
            });

        // 사이드바 문항 목록 생성 (v41 학생 개별 선택 방식)
        function buildQuestionList() {
            const container = document.getElementById('question-list-container');
            container.innerHTML = '';

            const activeStudent = getActiveStudent();
            const checkedSet = new Set(activeStudent ? activeStudent.incorrectQuestions : []);

            Object.keys(examDatabase).forEach(key => {
                const item = examDatabase[key];
                const isChecked = checkedSet.has(key);

                const itemDiv = document.createElement('div');
                itemDiv.className = `question-item ${key === activeKey ? 'active' : ''}`;
                itemDiv.id = `q-item-${key}`;
                itemDiv.onclick = () => switchQuestion(key);

                itemDiv.innerHTML = `
                    <input type="checkbox" id="sidebar-chk-${key}" class="question-item-chk" ${isChecked ? 'checked' : ''} 
                           onclick="event.stopPropagation(); togglePrintCheck('${key}')">
                    <div class="question-item-info">
                        <span class="question-item-num">${key}번 문항</span>
                        <span class="question-item-type">${item.type.split(' (')[0]}</span>
                    </div>
                `;
                container.appendChild(itemDiv);
            });

        // 개별 체크박스 상태 변경
        function togglePrintCheck(key) {
            const activeStudent = getActiveStudent();
            if (!activeStudent) {
                alert('오답을 지정할 학생을 먼저 추가/선택해 주세요!');
                const chk = document.getElementById('sidebar-chk-' + key);
                if (chk) chk.checked = false;
                return;
            }

            const chk = document.getElementById('sidebar-chk-' + key);
            const idx = activeStudent.incorrectQuestions.indexOf(key);

            if (chk.checked) {
                if (idx === -1) activeStudent.incorrectQuestions.push(key);
            } else {
                if (idx !== -1) activeStudent.incorrectQuestions.splice(idx, 1);
            }

            // 문항 숫자 오름차순 정렬 가동
            activeStudent.incorrectQuestions.sort((a, b) => {
                const parseKey = (x) => {
                    if (x.includes('-')) return parseInt(x.split('-')[0], 10);
                    return parseInt(x, 10);
                };
                return parseKey(a) - parseKey(b);
            });

            saveStudentsData();
            buildStudentList();
            updatePrintButtonText();
            switchQuestion(activeKey);
        }

            saveStudentsData();
            buildStudentList();
            buildQuestionList();
            updatePrintButtonText();
            switchQuestion(activeKey);
        }

                                <div class="section-title">핵심/구문 분석 필요한 문장 및 해석</div>
                                <div class="ruled-box analysis-box">
                                    <div class="ruled-lines-area"></div>
                                </div>
                            </div>
                        </div>

                        <div class="col-right">
                            <div class="reason-wrapper">
                                <div class="ruled-box reason-box">
                                    <div class="section-title">오답을 고른 이유</div>
                                    <div class="reason-checkboxes">
                                        <div class="chk-item"><div class="chk-square"></div> 어휘/숙어 해석 부족</div>
                                        <div class="chk-item"><div class="chk-square"></div> 매력적 오답에 유혹됨</div>
                                        <div class="chk-item"><div class="chk-square"></div> 구문 독해 오류</div>
                                        <div class="chk-item"><div class="chk-square"></div> 시간 부족/대충 읽음</div>
                                    </div>
                                    <div class="ruled-lines-area"></div>
                                </div>
                            </div>

                            <div class="correct-wrapper">
                                <div class="ruled-box correct-box">
                                    <div class="section-title">정답의 근거 및 단서</div>
                                    <div class="ruled-lines-area"></div>
                                </div>
                            </div>

                            <div class="vocab-wrapper">
                                <div class="ruled-box vocab-box">
                                    <div class="section-title">핵심 어휘 정리</div>
                                    <div class="vocab-table-container">
                                        <table class="vocab-table">
                                            <thead>
                                                <tr>
                                                    <th style="width: 45%;">단어/숙어</th>
                                                    <th style="width: 55%;">뜻</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${vocabRows}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // 인쇄 동작 (선택된 1명 학생의 오답노트 일괄 인쇄)
        function triggerBulkPrint() {
            const activeStudent = getActiveStudent();
            if (!activeStudent) {
                alert('선택된 학생이 없습니다. 학생 목록에서 학생을 먼저 선택해 주세요!');
                return;
            }

            const checkedKeys = activeStudent.incorrectQuestions;
            if (checkedKeys.length === 0) {
                alert(`${activeStudent.name} 학생의 오답 문항이 선택되지 않았습니다. 문항 리스트에서 오답을 체크해 주세요!`);
                return;
            }

            const printContainer = document.getElementById('print-container');
            printContainer.innerHTML = ''; // 초기화

            let studentPages = 0;
            checkedKeys.forEach(key => {
                const cardHtml = renderPageHtml(key, activeStudent.name);
                printContainer.innerHTML += cardHtml;
                if (key === "41-42" || key === "43-45") {
                    studentPages += 2;
                } else {
                    studentPages += 1;
                }
            });

            // 양면 인쇄 편의 보정: 페이지 장수가 홀수일 때 공백 페이지 삽입
            if (studentPages % 2 !== 0) {
                const blankPageHtml = `<div class="a4-page blank-duplex-page" style="display: flex !important; flex-direction: column; justify-content: center; align-items: center; background-color: white !important; page-break-after: always !important; break-after: page !important;">
                        <div style="text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; max-width: 80%;">
                            <div style="font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; font-size: 1.45rem; font-weight: 700; color: #2d3748; letter-spacing: 1px; line-height: 1.5;">
                                우리는 당신의 내일을 응원합니다.
                            </div>
                        </div>
                    </div>`;
                printContainer.innerHTML += blankPageHtml;
            }

            window.print();
        }

        // 전체 학생 오답노트 개별 이름 연동 일괄 출력 기능 (지정 학생 일괄 인쇄)
        function triggerSelectedStudentsBulkPrint() {
            const printableStudents = studentsList.filter(s => s.incorrectQuestions && s.incorrectQuestions.length > 0 && s.printChecked !== false);
            if (printableStudents.length === 0) {
                alert('인쇄가 지정되었고 오답 문항이 등록된 학생이 없습니다. 인쇄할 학생의 인쇄 체크를 활성화하고 오답을 먼저 체크해 주세요!');
                return;
            }

            if (!confirm(`지정된 학생(${printableStudents.length}명)의 개별 오답노트를 한 번에 프린터로 전송하시겠습니까? (이름 자동 매핑, 쪽 끊김 방지 완벽 지원)`)) {
                return;
            }

            const printContainer = document.getElementById('print-container');
            printContainer.innerHTML = ''; // 초기화

            printableStudents.forEach(student => {
                let studentPages = 0;
                student.incorrectQuestions.forEach(key => {
                    const cardHtml = renderPageHtml(key, student.name);
                    printContainer.innerHTML += cardHtml;
                    if (key === "41-42" || key === "43-45") {
                        studentPages += 2;
                    } else {
                        studentPages += 1;
                    }
                });

                // 양면 인쇄 편의 보정: 페이지 장수가 홀수일 때 공백 페이지 삽입
                if (studentPages % 2 !== 0) {
                    const blankPageHtml = `<div class="a4-page blank-duplex-page" style="display: flex !important; flex-direction: column; justify-content: center; align-items: center; background-color: white !important; page-break-after: always !important; break-after: page !important;">
                        <div style="text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; max-width: 80%;">
                            <div style="font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; font-size: 1.45rem; font-weight: 700; color: #2d3748; letter-spacing: 1px; line-height: 1.5;">
                                우리는 당신의 내일을 응원합니다.
                            </div>
                        </div>
                    </div>`;
                    printContainer.innerHTML += blankPageHtml;
                }
            });

            window.print();
        }

        // 전체 학생 인쇄 체크 토글
        function toggleAllStudentsPrintCheck(checked) {
            studentsList.forEach(student => {
                if (student.incorrectQuestions && student.incorrectQuestions.length > 0) {
                    student.printChecked = checked;
                } else {
                    student.printChecked = false;
                }
            });
            saveStudentsData();
            buildStudentList();
        }

        // 인쇄 컨트롤러 요약 UI 업데이트 (대시보드 실시간 업데이트 연동)
        function updateStudentPrintControls() {
            const printChkAll = document.getElementById('student-all-print-chk');
            const printCountBadge = document.getElementById('student-print-count-badge');
            const bulkPrintBtn = document.getElementById('student-bulk-print-btn');
            
            const printableStudents = studentsList.filter(s => s.incorrectQuestions && s.incorrectQuestions.length > 0);
            const checkedStudents = printableStudents.filter(s => s.printChecked !== false);
            
            if (printChkAll) {
                printChkAll.checked = printableStudents.length > 0 && checkedStudents.length === printableStudents.length;
            }
            if (printCountBadge) {
                printCountBadge.innerText = `${checkedStudents.length}명 지정됨`;
            }
            if (bulkPrintBtn) {
                bulkPrintBtn.innerText = `🖨️ 지정 학생 일괄 인쇄 (${checkedStudents.length}명)`;
            }

            // 대시보드 뷰가 열려있다면 즉시 대시보드도 실시간 재렌더링 (반응형 연동)
            const dashboardArea = document.getElementById('workspace-dashboard-area');
            if (dashboardArea && dashboardArea.style.display !== 'none') {
                buildPrintDashboard();
            }
        }

        // --- v44 새롭게 도입되는 워크스페이스 뷰 전환 및 출력 대시보드 시스템 ---
        let currentWorkspaceView = 'preview'; // 'preview' 또는 'dashboard'

        function switchWorkspaceView(viewName) {
            currentWorkspaceView = viewName;
            const previewArea = document.getElementById('workspace-scrollable-area');
            const dashboardArea = document.getElementById('workspace-dashboard-area');
            const previewBtn = document.getElementById('toggle-view-preview');
            const dashboardBtn = document.getElementById('toggle-view-dashboard');

            if (viewName === 'preview') {
                previewArea.style.display = 'flex';
                if (dashboardArea) dashboardArea.style.display = 'none';
                
                // 버튼 스타일 활성화
                previewBtn.style.backgroundColor = '#3182ce';
                previewBtn.style.color = 'white';
                dashboardBtn.style.background = 'none';
                dashboardBtn.style.color = '#4a5568';
            } else {
                previewArea.style.display = 'none';
                if (dashboardArea) {
                    dashboardArea.style.display = 'block';
                    buildPrintDashboard(); // 대시보드 렌더링
                }
                
                // 버튼 스타일 활성화
                dashboardBtn.style.backgroundColor = '#3182ce';
                dashboardBtn.style.color = 'white';
                previewBtn.style.background = 'none';
                previewBtn.style.color = '#4a5568';
            }
        }

        // 전체 학생 인쇄 대기 종합 현황판 렌더링
        function buildPrintDashboard() {
            const container = document.getElementById('workspace-dashboard-area');
            if (!container) return;

            // 인쇄 체크가 활성화된 학생들만 필터링
            const printableStudents = studentsList.filter(s => s.incorrectQuestions && s.incorrectQuestions.length > 0 && s.printChecked !== false);
            const totalStudents = studentsList.length;
            const targetStudentsCount = printableStudents.length;

            // 총 인쇄 예정 용지 수 계산 (양면 정렬 완벽 보정 적용)
            let totalPages = 0;
            printableStudents.forEach(student => {
                let studentPages = 0;
                student.incorrectQuestions.forEach(key => {
                    if (key === "41-42" || key === "43-45") {
                        totalPages += 2; // 장문독해는 2페이지
                        studentPages += 2;
                    } else {
                        totalPages += 1; // 일반문항은 1페이지
                        studentPages += 1;
                    }
                });
                // 양면 인쇄 보정: 홀수 장수일 경우 1장을 더해 짝수로 만듬 (백지 삽입 처리 반영)
                if (studentPages % 2 !== 0) {
                    totalPages += 1;
                }
            });

            let html = `
                <div style="background-color: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 25px; margin-bottom: 25px; border: 1px solid #e2e8f0; font-family: inherit;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #edf2f7; padding-bottom: 15px; margin-bottom: 20px;">
                        <h3 style="margin: 0; font-size: 1.15rem; color: #1a202c; display: flex; align-items: center; gap: 8px;">
                            <span style="display: inline-block; width: 4px; height: 16px; background-color: #3182ce; border-radius: 2px;"></span>
                            📋 전체 출력 대기 현황판 (인쇄 큐 요약)
                        </h3>
                        <button class="btn-sm btn-sm-primary" style="padding: 10px 20px; font-size: 0.85rem; background-color: #319795; font-weight: bold; border-radius: 6px; box-shadow: 0 2px 4px rgba(49,151,149,0.2);" onclick="triggerSelectedStudentsBulkPrint()">
                            🖨️ 지정 학생 일괄 인쇄 (${targetStudentsCount}명)
                        </button>
                    </div>

                    <!-- 요약 지표 카드 그룹 -->
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px;">
                        <div style="background-color: #f7fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center;">
                            <div style="font-size: 0.78rem; color: #718096; margin-bottom: 4px; font-weight: bold;">등록된 총 학생 수</div>
                            <div style="font-size: 1.5rem; color: #2d3748; font-weight: 800;">${totalStudents}명</div>
                        </div>
                        <div style="background-color: #ebf8ff; padding: 15px; border-radius: 8px; border: 1px solid #bee3f8; text-align: center;">
                            <div style="font-size: 0.78rem; color: #2b6cb0; margin-bottom: 4px; font-weight: bold;">인쇄 지정 학생 수</div>
                            <div style="font-size: 1.5rem; color: #2b6cb0; font-weight: 800;">${targetStudentsCount}명</div>
                        </div>
                        <div style="background-color: #e6fffa; padding: 15px; border-radius: 8px; border: 1px solid #b2f5ea; text-align: center;">
                            <div style="font-size: 0.78rem; color: #319795; margin-bottom: 4px; font-weight: bold;">총 인쇄 예정 용지</div>
                            <div style="font-size: 1.5rem; color: #319795; font-weight: 800;">A4 ${totalPages}장</div>
                        </div>
                    </div>

                    <!-- 전체 출력 대기 현황 상세 테이블 -->
                    <div style="overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px;">
                        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem;">
                            <thead>
                                <tr style="background-color: #f7fafc; border-bottom: 2px solid #e2e8f0;">
                                    <th style="padding: 12px 15px; width: 8%; text-align: center; color: #4a5568; font-weight: bold;">지정</th>
                                    <th style="padding: 12px 15px; width: 22%; color: #4a5568; font-weight: bold;">학생 이름</th>
                                    <th style="padding: 12px 15px; width: 15%; text-align: center; color: #4a5568; font-weight: bold;">인쇄 장수</th>
                                    <th style="padding: 12px 15px; width: 45%; color: #4a5568; font-weight: bold;">오답 설정 문항 번호</th>
                                    <th style="padding: 12px 15px; width: 10%; text-align: center; color: #4a5568; font-weight: bold;">관리</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            if (studentsList.length === 0) {
                html += `
                                <tr>
                                    <td colspan="5" style="padding: 40px; text-align: center; color: #a0aec0; font-weight: bold;">
                                        등록된 학생이 없습니다. 사이드바에서 학생을 먼저 추가해 주세요!
                                    </td>
                                </tr>
                `;
            } else {
                studentsList.forEach((student, index) => {
                    const isChecked = student.printChecked !== false;
                    const numQuestions = student.incorrectQuestions ? student.incorrectQuestions.length : 0;
                    
                    // 개별 인쇄 장수 계산 (양면 보정 여부 포함)
                    let studentPages = 0;
                    if (student.incorrectQuestions) {
                        student.incorrectQuestions.forEach(key => {
                            if (key === "41-42" || key === "43-45") studentPages += 2;
                            else studentPages += 1;
                        });
                    }

                    let pageDisplayStr = `A4 ${studentPages}장`;
                    if (studentPages % 2 !== 0) {
                        pageDisplayStr = `<span title="양면 인쇄 시 보정 백지 1장 포함">A4 ${studentPages}장 <span style="font-size: 0.72rem; color: #a0aec0; font-weight: normal;">(양면+1)</span></span>`;
                    }

                    // 오답 설정 정렬 구절 생성
                    let sortedQsStr = '없음';
                    if (student.incorrectQuestions && student.incorrectQuestions.length > 0) {
                        const sortedQuestions = [...student.incorrectQuestions].sort((a, b) => {
                            const numA = parseInt(a.split('-')[0]) || 0;
                            const numB = parseInt(b.split('-')[0]) || 0;
                            return numA - numB;
                        });
                        sortedQsStr = sortedQuestions.map(q => `${q}번`).join(', ');
                    }

                    const isEditingThis = student.id === activeStudentId;

                    html += `
                                <tr style="border-bottom: 1px solid #edf2f7; background-color: ${isEditingThis ? '#f0f9ff' : 'white'}; transition: background 0.15s;">
                                    <td style="padding: 12px 15px; text-align: center; vertical-align: middle;">
                                        <input type="checkbox" ${isChecked ? 'checked' : ''} style="width: 15px; height: 14px; cursor: pointer;" 
                                               onchange="toggleDashboardStudentPrint('${student.id}', this.checked)">
                                    </td>
                                    <td style="padding: 12px 15px; font-weight: bold; color: #2d3748; vertical-align: middle; display: flex; align-items: center; gap: 8px;">
                                        <span style="font-size: 0.9rem;">${student.name}</span>
                                        ${isEditingThis ? '<span style="font-size: 0.65rem; padding: 2px 6px; background-color: #f6ad55; color: #1a202c; font-weight: bold; border-radius: 3px;">편집중</span>' : ''}
                                    </td>
                                    <td style="padding: 12px 15px; text-align: center; color: #4a5568; font-weight: bold; vertical-align: middle;">
                                        ${pageDisplayStr}
                                    </td>
                                    <td style="padding: 12px 15px; color: #4a5568; line-height: 1.4; vertical-align: middle;">
                                        <span style="font-weight: 500; font-family: monospace; font-size: 0.8rem; background-color: #f7fafc; padding: 3px 8px; border-radius: 4px; border: 1px solid #edf2f7; display: inline-block;">
                                            ${sortedQsStr}
                                        </span>
                                    </td>
                                    <td style="padding: 12px 15px; text-align: center; vertical-align: middle;">
                                        <button class="btn-sm btn-sm-secondary" style="padding: 4px 8px; font-size: 0.72rem; font-weight: bold; border-radius: 4px; background-color: #edf2f7; color: #4a5568;" onclick="editStudentFromDashboard('${student.id}')">✏️ 편집</button>
                                    </td>
                                </tr>
                    `;
                });
            }

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // 대시보드 내부의 체크박스 상태 전환 핸들러
        function toggleDashboardStudentPrint(id, checked) {
            const student = studentsList.find(s => s.id === id);
            if (student) {
                student.printChecked = checked;
                saveStudentsData();
                buildStudentList(); // 사이드바 목록 상태 연동 갱신
                buildPrintDashboard(); // 대시보드 지표 및 테이블 갱신
            }
        }

        // 대시보드 내부의 편집 버튼 핸들러
        function editStudentFromDashboard(id) {
            selectStudent(id);
            switchWorkspaceView('preview'); // 미리보기 뷰로 자동 회귀
            switchSidebarTab('questions'); // 오답지정 탭 자동 회귀
        }

        // 일반 오답 체크 개수 업데이트 동기화
        function updatePrintButtonText() {
            const activeStudent = getActiveStudent();
            const count = activeStudent ? activeStudent.incorrectQuestions.length : 0;
            const btn = document.getElementById('sidebar-print-btn');
            if (btn) btn.innerText = `🖨️ 인쇄 (${count}개)`;
        }
    </script>
</body>
</html>
