 comprehended</div><div class=\"school-option\">② objective　　　 ……　 perceived</div><div class=\"school-option\">③ ineffective　　　……　 ignored</div><div class=\"school-option\">④ impactful　　　 ……　 distributed</div><div class=\"school-option\">⑤ significant　　　……　 evaluated</div>", "layout": "standard"}, "27": {"title_question": "27. 다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것을 고르시오.", "score": "3.7점", "type": "요약문 완성", "passage": "Humans first appeared at a time when resources were scarce and dangers were everywhere, so our natural habit of sharing and cooperating becomes complicated when we have plenty of resources and face few threats from outside. When we have less, we are usually more willing to share what we own. For example, some nomadic tribes own very little, but they are glad to share because it benefits them. If you meet them while traveling, they will welcome you into their homes and offer you food and kindness. This is not simply because they are kind people. Rather, their survival depends on sharing, since they know that someday they themselves may be the travelers who need food and a place to stay. Ironically, the more we own, the higher we build our fences, the more advanced our security systems become to keep others out, and the less willing we are to share. Our desire to have more, together with fewer face-to-face encounters with ordinary people, begins to cut us off from reality and make us blind to it.\n↓\nPeople tend to share more readily when resources are _____(A)_____, because sharing helps them survive, but as they gain more wealth, they tend to _____(B)_____ themselves from others.\n(A)　　　　　　　　　(B)\n① plentiful　　　　……　 separate\n② limited　　　　 ……　 separate\n③ limited　　　　 ……　 unite\n④ plentiful　　　　……　 unite\n⑤ unpredictable　　……　 compare", "options": ["① plentiful　　　　……　 separate", "② limited　　　　 ……　 separate", "③ limited　　　　 ……　 unite", "④ plentiful　　　　……　 unite", "⑤ unpredictable　　……　 compare"], "correctAnswer": "②", "explanation": "자원이 부족할(limited) 때 공유하며, 부유해질수록 타인과 자신을 **분리(separate)**합니다.", "contentHtml": "<div class=\"text-question-title\">27. 다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Humans first appeared at a time when resources were scarce and dangers were everywhere, so our natural habit of sharing and cooperating becomes complicated when we have plenty of resources and face few threats from outside. When we have less, we are usually more willing to share what we own. For example, some nomadic tribes own very little, but they are glad to share because it benefits them. If you meet them while traveling, they will welcome you into their homes and offer you food and kindness. This is not simply because they are kind people. Rather, their survival depends on sharing, since they know that someday they themselves may be the travelers who need food and a place to stay. Ironically, the more we own, the higher we build our fences, the more advanced our security systems become to keep others out, and the less willing we are to share. Our desire to have more, together with fewer face-to-face encounters with ordinary people, begins to cut us off from reality and make us blind to it.</p></div><div class=\"summary-arrow\">↓</div><div class=\"given\"><p>People tend to share more readily when resources are <span class=\"answer-blank summary-blank\">(A)</span>, because sharing helps them survive, but as they gain more wealth, they tend to <span class=\"answer-blank summary-blank\">(B)</span> themselves from others.</p></div><div class=\"option-head\">　　　　(A)　　　　　　　　(B)</div><div class=\"school-option\">① plentiful　　　　……　 separate</div><div class=\"school-option\">② limited　　　　 ……　 separate</div><div class=\"school-option\">③ limited　　　　 ……　 unite</div><div class=\"school-option\">④ plentiful　　　　……　 unite</div><div class=\"school-option\">⑤ unpredictable　　……　 compare</div>", "layout": "standard"}};
const keys=Object.keys(DB);let students=[],active='',question='1',view='preview',storageWarning='',sidebarView='students';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random())}
function current(){return students.find(s=>s.id===active)}
function normalize(data){if(!Array.isArray(data)||data.length>1000)throw Error('학생 목록 형식이 올바르지 않습니다.');const ids=new Set();return data.map(s=>{if(!s||typeof s.name!=='string'||!s.name.trim()||!Array.isArray(s.incorrectQuestions)||s.incorrectQuestions.some(k=>!keys.includes(k)))throw Error('학생 또는 문항 데이터가 올바르지 않습니다.');let id=typeof s.id==='string'&&/^[a-zA-Z0-9-]+$/.test(s.id)&&!ids.has(s.id)?s.id:uid();ids.add(id);return{id,name:s.name.trim().slice(0,100),incorrectQuestions:[...new Set(s.incorrectQuestions)].sort((a,b)=>parseInt(a)-parseInt(b)),printChecked:s.printChecked!==false}})}
try{const saved=localStorage.getItem(STORAGE);if(saved)students=normalize(JSON.parse(saved));}catch(e){storageWarning='자동 저장 기록을 읽지 못했습니다. 기존 기록은 덮어쓰지 않았습니다. 필요하면 백업을 복원해 주세요.'}active=students[0]?.id||'';
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(students));storageWarning=''}catch(e){storageWarning='자동 저장에 실패했습니다. 기록 백업으로 별도 저장해 주세요.'}}
function add(){const input=document.getElementById('names');let names=input.value.split(/[,\n]+/).map(s=>s.trim()).filter(Boolean);if(!names.length)return;for(const name of names){const s={id:uid(),name:name.slice(0,100),incorrectQuestions:[],printChecked:true};students.push(s);active=s.id}input.value='';save();render()}
function select(id){if(!students.some(s=>s.id===id))return;active=id;sidebarView='questions';view='preview';render()}
function removeStudent(id){const s=students.find(s=>s.id===id);if(!confirm(s.name+' 학생의 이 시험 오답 기록을 삭제할까요?'))return;students=students.filter(s=>s.id!==id);if(active===id)active=students[0]?.id||'';save();render()}
function toggleQuestion(k,checked){const s=current();if(!s){alert('학생을 먼저 등록해 주세요.');render();return}s.incorrectQuestions=checked?[...new Set([...s.incorrectQuestions,k])]:s.incorrectQuestions.filter(q=>q!==k);s.incorrectQuestions.sort((a,b)=>parseInt(a)-parseInt(b));question=k;save();render()}
function allQuestions(check){const s=current();if(!s)return alert('학생을 먼저 등록해 주세요.');s.incorrectQuestions=check?[...keys]:[];save();render()}
function markStudent(id,check){students.find(s=>s.id===id).printChecked=check;save();render()}
function markStudents(check){students.forEach(s=>s.printChecked=check);save();render()}
function isLongQuestion(key){return DB[key]?.layout==='long'}
function pageCount(s){return s.incorrectQuestions.reduce((n,k)=>n+(isLongQuestion(k)?2:1),0)}
function box(label,cl=''){return `<div class="box ${cl}"><div class="section-label">${label}</div><div class="ruled"></div></div>`}
function reason(cl=''){return `<div class="box ${cl}"><div class="section-label">오답을 고른 이유</div><div class="checks">□ 어휘·숙어 해석 부족<br>□ 매력적 오답에 유혹됨<br>□ 구문 독해 오류<br>□ 시간 부족·대충 읽음</div><div class="ruled"></div></div>`}
function vocab(cl='',count=12){return `<div class="box ${cl}"><div class="section-label">핵심 어휘 정리</div><table><tr><th>단어·숙어</th><th>뜻</th></tr>${'<tr><td></td><td></td></tr>'.repeat(count)}</table></div>`}
function longVocab(){const heads='<th scope="col">단어·숙어</th><th scope="col">뜻</th>'.repeat(3);let rows='';for(let r=0;r<6;r++){let cells='';for(let c=0;c<3;c++)cells+='<td></td><td></td>';rows+='<tr>'+cells+'</tr>'}return `<div class="box long-vocab"><div class="section-label">핵심 어휘 정리</div><table><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table></div>`}
function head(k,s,label){const d=DB[k];const answers=d.answers?Object.entries(d.answers).map(([n,a])=>`${n}번 ${a}`).join(' / '):d.correctAnswer;return `<div class="sheet-head"><div class="sheet-title"><div>${s?`[${esc(s.name)} 학생] `:''}${esc(EXAM.title)}</div><span>${label}</span></div><div class="meta"><span>문항: ${k}번</span><span>유형: ${esc(d.type)}</span><span>배점: ${d.score}</span><span>나의 답: ${d.answers?Object.keys(d.answers).map(n=>n+'번 ____').join(' / '):'____'}</span><span>실제 정답: ${answers}</span></div></div>`}
function foot(k,p){return `<div class="footer"><span>${esc(EXAM.title)} · ${esc(EXAM.subject)} · ${k}번</span><span>${p}</span></div>`}
function sheet(k,s){const d=DB[k],img=`<div class="text-frame"><div class="text-content">${d.contentHtml}</div></div>`;if(isLongQuestion(k))return `<section class="sheet">${head(k,s,'영어 오답노트')}<div class="long-problem"><div class="section-label">영어 문제 및 지문 · 밑줄·선택지 포함</div>${img}</div>${foot(k,'1 / 2')}</section><section class="sheet">${head(k,s,'오답 분석')}<div class="analysis-grid">${reason()}${box('정답의 근거 및 단서')}${box('핵심·구문 분석이 필요한 문장 및 해석','wide')}</div><div class="long-vocab-wrapper">${longVocab()}</div>${foot(k,'2 / 2')}</section>`;return `<section class="sheet">${head(k,s,'영어 오답노트')}<div class="body-grid"><div class="left"><div class="problem"><div class="section-label">${d.instruction||"영어 문제 및 지문"}</div>${img}</div>${box('핵심·구문 분석이 필요한 문장 및 해석','analysis')}</div><div class="right">${reason('reason')}${box('정답의 근거 및 단서','evidence')}${vocab('vocab',15)}</div></div>${foot(k,'1 / 1')}</section>`}
function fitProblems(root){let failed=false;root.querySelectorAll(".text-frame").forEach(frame=>{if(!frame.clientHeight)return;const style=getComputedStyle(frame);const available=frame.clientHeight-parseFloat(style.paddingTop||0)-parseFloat(style.paddingBottom||0);const content=frame.querySelector(".text-content");content.style.fontSize="";let size=parseFloat(getComputedStyle(content).fontSize);while(content.scrollHeight>available+1&&size>9){size-=0.25;content.style.fontSize=size+"px"}if(content.scrollHeight>available+2)failed=true});return !failed}
function syncSidebar(){const editing=sidebarView==='questions';document.getElementById('student-panel').hidden=editing;document.getElementById('question-panel').hidden=!editing;document.getElementById('student-tab').setAttribute('aria-selected',String(!editing));document.getElementById('question-tab').setAttribute('aria-selected',String(editing));const picker=document.getElementById('student-picker');picker.innerHTML=students.length?students.map(s=>`<option value="${s.id}" ${s.id===active?'selected':''}>${esc(s.name)}</option>`).join(''):'<option value="">학생을 먼저 등록해 주세요</option>';picker.disabled=!students.length}
function switchSidebar(tab){sidebarView=tab==='questions'?'questions':'students';render()}
function render(){syncSidebar();document.getElementById("teacher-explanation").textContent=question+"번 정답 "+DB[question].correctAnswer+" · "+DB[question].explanation;const s=current();document.getElementById('activeName').textContent=s?s.name:'학생을 등록해 주세요';document.getElementById('students').innerHTML=students.map(s=>`<div class="student ${s.id===active?'active':''}"><input type="checkbox" ${s.printChecked?'checked':''} onchange="markStudent('${s.id}',this.checked)" aria-label="${esc(s.name)} 인쇄 지정"><div class="name" onclick="select('${s.id}')">${esc(s.name)}<br><small>${s.incorrectQuestions.length}개 묶음 · ${pageCount(s)}쪽</small></div><button class="danger" onclick="removeStudent('${s.id}')" aria-label="${esc(s.name)} 삭제">×</button></div>`).join('');document.getElementById('questions').innerHTML=keys.map(k=>`<label class="question ${k===question?'current':''}"><input type="checkbox" ${s?.incorrectQuestions.includes(k)?'checked':''} onchange="toggleQuestion('${k}',this.checked)"><a href="#" onclick="event.preventDefault();question='${k}';view='preview';render()">${k}번 · ${esc(DB[k].type)}</a></label>`).join('');document.getElementById('status').textContent=storageWarning||(s?`${s.name} · 오답 ${s.incorrectQuestions.length}개 묶음 · 기본 출력 ${pageCount(s)}쪽`:'학생을 등록한 뒤 틀린 문항을 체크해 주세요. 현재는 빈 양식 미리보기입니다.');document.getElementById('content').innerHTML=view==='preview'?(!students.length?'<div class="help">① 왼쪽에서 학생 등록 → ② 틀린 문항 체크 → ③ 현재 학생 또는 지정 학생 일괄 인쇄<br>인쇄 설정: A4 · 배율 100% · 여백 없음 · 머리글/바닥글 끄기. 학생은 출력물에 직접 작성합니다.</div>':'')+sheet(question,s):`<div id="dashboard"><div class="stats">등록 ${students.length}명 · 인쇄 지정 ${students.filter(s=>s.printChecked&&pageCount(s)).length}명</div><table><tr><th>인쇄</th><th>학생</th><th>오답 문항</th><th>기본 쪽수</th></tr>${students.map(s=>`<tr><td><input type="checkbox" ${s.printChecked?'checked':''} onchange="markStudent('${s.id}',this.checked)"></td><td><button onclick="select('${s.id}')">${esc(s.name)}</button></td><td>${s.incorrectQuestions.join(', ')||'없음'}</td><td>${pageCount(s)}</td></tr>`).join('')}</table></div>`;requestAnimationFrame(()=>fitProblems(document.getElementById('content')))}
function printPlan(student,duplex){let count=0;const plan=[];const ordered=[...student.incorrectQuestions].sort((a,b)=>parseInt(a)-parseInt(b));for(const key of ordered){const pages=isLongQuestion(key)?2:1;plan.push({kind:'question',key,startPage:count+1,pages});count+=pages}if(duplex&&count%2===1)plan.push({kind:'blank'});return plan}
function studentPrintHtml(student,duplex){return printPlan(student,duplex).map(item=>item.kind==='blank'?'<section class="sheet blank"><p>우리는 당신의 내일을 응원합니다.</p></section>':sheet(item.key,student)).join('')}
async function printSelected(bulk){const list=bulk?students.filter(s=>s.printChecked&&s.incorrectQuestions.length):[current()].filter(s=>s?.incorrectQuestions.length);if(!list.length)return alert('학생을 등록하고 오답 문항을 선택해 주세요.');const duplex=document.getElementById('duplex').checked;document.getElementById('print').innerHTML=list.map(s=>studentPrintHtml(s,duplex)).join('');const target=document.getElementById('print');target.classList.add('measuring');await Promise.all([...target.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));await new Promise(requestAnimationFrame);if(!fitProblems(target)){target.classList.remove('measuring');alert('문항이 인쇄 영역을 초과합니다. 인쇄를 중단했습니다.');return}target.classList.remove('measuring');window.print()}
function backup(){const payload={schemaVersion:1,examId:EXAM_ID,exportedAt:new Date().toISOString(),students};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=EXAM.id+'-student-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
async function restoreBackup(input){try{const f=input.files[0];if(!f)return;if(f.size>5e6)throw Error('백업 파일이 너무 큽니다.');const data=JSON.parse(await f.text());if(data.examId!==EXAM_ID||data.schemaVersion!==1)throw Error(EXAM.title+'용 백업 파일을 선택해 주세요.');const restored=normalize(data.students);if(!confirm(`현재 이 시험의 학생 기록을 백업의 ${restored.length}명 기록으로 교체할까요?`))return;students=restored;active=students[0]?.id||'';save();render()}catch(e){alert('복원하지 못했습니다: '+e.message)}finally{input.value=''}}
function configureExam(){document.title=EXAM.title+' '+EXAM.subject+' 오답노트 (v'+EXAM.version+')';document.getElementById('exam-title').textContent=EXAM.title+' '+EXAM.subject+' 오답노트';document.getElementById('version-badge').textContent='텍스트형 v'+EXAM.version;document.getElementById('exam-subtitle').textContent=EXAM.rangeLabel+' · 학생별 오답 지정 및 A4 출력 · 텍스트형 v'+EXAM.version+' · 지문 드래그·복사 가능';const groups=keys.filter(isLongQuestion);document.getElementById('long-group-note').textContent=groups.length?groups.map(k=>k.replace('-','~')+'번').join(', ')+'은 묶음 단위로 출력합니다.':''}
configureExam();render();
</script></html>
