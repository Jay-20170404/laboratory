<script>
const EXAM={id:'2026-hankwang-g1-s2-midterm-english',title:'한광고 1학년 2학기 중간고사',subject:'영어',rangeLabel:'1~27번',version:3};
const EXAM_ID=EXAM.id,STORAGE='incorrect-notes:'+EXAM_ID+':v1';
const DB={"1": {"title_question": "1. 다음 글의 요지로 가장 적절한 것은?", "score": "3.1점", "type": "글의 요지", "passage": "Fake news on social media spreads significantly farther and faster than true stories. A study by the Massachusetts Institute of Technology in the US has shown that fake news spreads online 6 times faster than real news on average. One explanation for this phenomenon is that people like new and provocative things. When information is astonishing, people not only feel that it is surprising, but they also want to share the stimulating news with others. By passing it to others on social media, they can gain attention because they are the first to post previously unknown, but possibly false, information. Also, fake news goes viral because people in their daily lives tend to think simply and effortlessly. It is more likely for them to believe new information without any proof, instead of critically examining it.\n① 소셜 미디어에서 새로운 정보를 공유하는 것을 피해야 한다.\n② 소셜 미디어에서 관심을 많이 받는 정보일수록 사실일 가능성이 높다.\n③ 사람들은 이미 알고 있는 정보보다 새로운 정보를 더 정확하게 판단한다.\n④ 가짜 뉴스는 주로 정보의 사실 여부를 확인하기 어려워서 확산된다.\n⑤ 가짜 뉴스는 사람들의 자극적인 정보에 대한 관심과 비판적 사고의 부족 때문에 빠르게 확산될 수 있다.", "options": ["① 소셜 미디어에서 새로운 정보를 공유하는 것을 피해야 한다.", "② 소셜 미디어에서 관심을 많이 받는 정보일수록 사실일 가능성이 높다.", "③ 사람들은 이미 알고 있는 정보보다 새로운 정보를 더 정확하게 판단한다.", "④ 가짜 뉴스는 주로 정보의 사실 여부를 확인하기 어려워서 확산된다.", "⑤ 가짜 뉴스는 사람들의 자극적인 정보에 대한 관심과 비판적 사고의 부족 때문에 빠르게 확산될 수 있다."], "correctAnswer": "⑤", "explanation": "자극적인 새 정보에 대한 관심과 비판적 검토 부족이 가짜 뉴스의 확산을 촉진합니다.", "contentHtml": "<div class=\"text-question-title\">1. 다음 글의 요지로 가장 적절한 것은?</div><div class=\"given\"><p>Fake news on social media spreads significantly farther and faster than true stories. A study by the Massachusetts Institute of Technology in the US has shown that fake news spreads online 6 times faster than real news on average. One explanation for this phenomenon is that people like new and provocative things. When information is astonishing, people not only feel that it is surprising, but they also want to share the stimulating news with others. By passing it to others on social media, they can gain attention because they are the first to post previously unknown, but possibly false, information. Also, fake news goes viral because people in their daily lives tend to think simply and effortlessly. It is more likely for them to believe new information without any proof, instead of critically examining it.</p></div><div class=\"school-option\">① 소셜 미디어에서 새로운 정보를 공유하는 것을 피해야 한다.</div><div class=\"school-option\">② 소셜 미디어에서 관심을 많이 받는 정보일수록 사실일 가능성이 높다.</div><div class=\"school-option\">③ 사람들은 이미 알고 있는 정보보다 새로운 정보를 더 정확하게 판단한다.</div><div class=\"school-option\">④ 가짜 뉴스는 주로 정보의 사실 여부를 확인하기 어려워서 확산된다.</div><div class=\"school-option\">⑤ 가짜 뉴스는 사람들의 자극적인 정보에 대한 관심과 비판적 사고의 부족 때문에 빠르게 확산될 수 있다.</div>", "layout": "standard"}, "2": {"title_question": "2. 다음 글에 드러난 ‘I’의 심경 변화로 가장 적절한 것은?", "score": "3.1점", "type": "심경 변화", "passage": "There is a look of impatience on the faces of the people in line. There is even hostility, hidden by a thin layer of politeness. Even that politeness is stretched thin. As I approach the back of the store for water bottles, I realize I am too late. The shelves are already empty. I manage my way to the side aisle, trying my luck. Sometimes people place unwanted items in the wrong shelves. Lucky! I find a single case of water that someone abandoned there maybe yesterday, when it wasn’t such a precious commodity. I reach for it, only to find it pulled away at the last second by a woman. She stacks it on top of her cart like a crown on top of her canned goods.\n① frustrated → skeptical\n② hopeful → frustrated\n③ bored → excited\n④ calm → grateful\n⑤ indifferent → content", "options": ["① frustrated → skeptical", "② hopeful → frustrated", "③ bored → excited", "④ calm → grateful", "⑤ indifferent → content"], "correctAnswer": "②", "explanation": "생수를 발견해 기대했다가 다른 사람이 가져가 좌절합니다.", "contentHtml": "<div class=\"text-question-title\">2. 다음 글에 드러난 ‘I’의 심경 변화로 가장 적절한 것은?</div><div class=\"given\"><p>There is a look of impatience on the faces of the people in line. There is even hostility, hidden by a thin layer of politeness. Even that politeness is stretched thin. As I approach the back of the store for water bottles, I realize I am too late. The shelves are already empty. I manage my way to the side aisle, trying my luck. Sometimes people place unwanted items in the wrong shelves. Lucky! I find a single case of water that someone abandoned there maybe yesterday, when it wasn’t such a precious commodity. I reach for it, only to find it pulled away at the last second by a woman. She stacks it on top of her cart like a crown on top of her canned goods.</p></div><div class=\"school-option\">① frustrated → skeptical</div><div class=\"school-option\">② hopeful → frustrated</div><div class=\"school-option\">③ bored → excited</div><div class=\"school-option\">④ calm → grateful</div><div class=\"school-option\">⑤ indifferent → content</div>", "layout": "standard"}, "3": {"title_question": "3. 다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "score": "3.1점", "type": "어법", "passage": "Moreover, people are inclined to believe information that ① fits their prejudices or experiences even when not true. In this process, people ② easily fall into the trap of “confirmation bias.” That is, they selectively accept news in a way that only confirms their beliefs and ignore news that doesn’t support ③ them. During election season, for example, people tend to blindly believe any news describing their favored candidates in a positive way, while unconsciously ④ believe news that reports something negative about other candidates. With so much information on the Internet, how can you make sure that fake news does not ⑤ mislead you?", "options": ["① fits", "② easily", "③ them", "④ believe", "⑤ mislead"], "correctAnswer": "④", "explanation": "while unconsciously believe → while unconsciously believing. 접속사 뒤에서 주어를 생략한 분사 형태가 필요합니다.", "contentHtml": "<div class=\"text-question-title\">3. 다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?</div><div class=\"given\"><p>Moreover, people are inclined to believe information that ① <u>fits</u> their prejudices or experiences even when not true. In this process, people ② <u>easily</u> fall into the trap of “confirmation bias.” That is, they selectively accept news in a way that only confirms their beliefs and ignore news that doesn’t support ③ <u>them</u>. During election season, for example, people tend to blindly believe any news describing their favored candidates in a positive way, while unconsciously ④ <u>believe</u> news that reports something negative about other candidates. With so much information on the Internet, how can you make sure that fake news does not ⑤ <u>mislead</u> you?</p></div><div class=\"text-options grammar-options\"><div>① fits</div><div>② easily</div><div>③ them</div><div>④ believe</div><div>⑤ mislead</div></div>", "layout": "standard"}, "4": {"title_question": "4. 밑줄 친 one favor deserves another가 다음 글에서 의미하는 바로 가장 적절한 것은?", "score": "3.1점", "type": "함축 의미", "passage": "The cart is ridiculously heavy now, and almost impossible to push. Then, a man in a business suit comes up behind us. He smiles. “Looks like you could use some help.” He doesn’t wait for us to answer before grabbing the cart’s handle. “Thank you for helping us,” I tell him. “Not a problem. We all need to help one another.” He smiles again, and I return the smile. It is good to know that difficult times can bring out the best in people. I decide that one favor deserves another. “Why don’t you take a bag of ice for yourself,” I suggest. His smile does not fade. “I have a better idea,” he says. “Why don’t you take a bag of ice for yourselves, and I’ll keep the rest.”\n① I should ask the man to do one more thing for us.\n② It is wiser to accept help than to refuse it in hard times.\n③ People usually help others only when they expect a reward.\n④ I should return the man’s kindness by giving him something.\n⑤ We should keep what we have because others may take it away.", "options": ["① I should ask the man to do one more thing for us.", "② It is wiser to accept help than to refuse it in hard times.", "③ People usually help others only when they expect a reward.", "④ I should return the man’s kindness by giving him something.", "⑤ We should keep what we have because others may take it away."], "correctAnswer": "④", "explanation": "도움을 받은 데 대해 얼음을 주어 보답하려는 뜻입니다.", "contentHtml": "<div class=\"text-question-title\">4. 밑줄 친 one favor deserves another가 다음 글에서 의미하는 바로 가장 적절한 것은?</div><div class=\"given\"><p>The cart is ridiculously heavy now, and almost impossible to push. Then, a man in a business suit comes up behind us. He smiles. “Looks like you could use some help.” He doesn’t wait for us to answer before grabbing the cart’s handle. “Thank you for helping us,” I tell him. “Not a problem. We all need to help one another.” He smiles again, and I return the smile. It is good to know that difficult times can bring out the best in people. I decide that <u>one favor deserves another</u>. “Why don’t you take a bag of ice for yourself,” I suggest. His smile does not fade. “I have a better idea,” he says. “Why don’t you take a bag of ice for yourselves, and I’ll keep the rest.”</p></div><div class=\"school-option\">① I should ask the man to do one more thing for us.</div><div class=\"school-option\">② It is wiser to accept help than to refuse it in hard times.</div><div class=\"school-option\">③ People usually help others only when they expect a reward.</div><div class=\"school-option\">④ I should return the man’s kindness by giving him something.</div><div class=\"school-option\">⑤ We should keep what we have because others may take it away.</div>", "layout": "standard"}, "5": {"title_question": "5. 다음 글에서 필자가 주장하는 바로 가장 적절한 것은?", "score": "3.7점", "type": "필자의 주장", "passage": "Why are we under the false impression that intensive studying right before a test is the optimal learning method? It is because we fail to tell the difference between the distinct systems within our memory. Upon finishing our reading of the study materials, the knowledge is vividly retained in our brains. It sits in our conscious working memory, in an active form. Its presence in short-term memory gives us a false sense of mastery, yet this temporary storage is entirely unrelated to the long-term memory required for later retrieval. Working memory begins to fade within moments, and over a few days, the loss is substantial; without subsequent testing, the acquired knowledge completely decays. For the successful transfer of knowledge into long-term memory, it is crucial to combine studying with self-testing instead of exclusively devoting your time to reading.\n① The limitation of short-term memory in comprehending complex study materials\n② The need to incorporate self-testing to transfer knowledge into long-term memory\n③ The illusion of mastery caused by intensive studying right before a major exam\n④ The importance of distinguishing between different types of memory systems\n⑤ The absolute necessity of repeated reading to prevent working memory from fading", "options": ["① The limitation of short-term memory in comprehending complex study materials", "② The need to incorporate self-testing to transfer knowledge into long-term memory", "③ The illusion of mastery caused by intensive studying right before a major exam", "④ The importance of distinguishing between different types of memory systems", "⑤ The absolute necessity of repeated reading to prevent working memory from fading"], "correctAnswer": "②", "explanation": "장기기억으로 전환하려면 공부와 자기 시험을 병행해야 한다는 주장입니다.", "contentHtml": "<div class=\"text-question-title\">5. 다음 글에서 필자가 주장하는 바로 가장 적절한 것은?</div><div class=\"given\"><p>Why are we under the false impression that intensive studying right before a test is the optimal learning method? It is because we fail to tell the difference between the distinct systems within our memory. Upon finishing our reading of the study materials, the knowledge is vividly retained in our brains. It sits in our conscious working memory, in an active form. Its presence in short-term memory gives us a false sense of mastery, yet this temporary storage is entirely unrelated to the long-term memory required for later retrieval. Working memory begins to fade within moments, and over a few days, the loss is substantial; without subsequent testing, the acquired knowledge completely decays. For the successful transfer of knowledge into long-term memory, it is crucial to combine studying with self-testing instead of exclusively devoting your time to reading.</p></div><div class=\"school-option\">① The limitation of short-term memory in comprehending complex study materials</div><div class=\"school-option\">② The need to incorporate self-testing to transfer knowledge into long-term memory</div><div class=\"school-option\">③ The illusion of mastery caused by intensive studying right before a major exam</div><div class=\"school-option\">④ The importance of distinguishing between different types of memory systems</div><div class=\"school-option\">⑤ The absolute necessity of repeated reading to prevent working memory from fading</div>", "layout": "standard"}, "6": {"title_question": "6. 밑줄 친 Monday Morning Quarterback이 다음 글에서 의미하는 바로 가장 적절한 것은?", "score": "3.1점", "type": "함축 의미", "passage": "There is a reason why the title “Monday Morning Quarterback” exists. If you simply glance at fans’ social media comments about weekend matches, it becomes immediately apparent how many people believe they could play, coach, and manage sport teams more competently than actual professionals. This phenomenon extends directly to the corporate side of sports as well. Professionals with years of training and specialized degrees in sport business may also find themselves receiving unsolicited guidance on how to do their jobs from friends, family, or even total strangers with zero professional background. Executives in sport management have decades of knowledge and experience in their respective fields. Nevertheless, these seasoned experts frequently encounter backlash from fans and locals who try to dictate how the franchise should be operated. Very few tell doctors how to perform surgery or accountants how to prepare taxes, but many readily offer unwarranted feedback on how sport organizations should be managed.\n① An executive in a Monday sports meeting held for team management\n② A passionate fan who unconditionally defends local sports teams\n③ A head coach leading the team by analyzing the previous day’s games\n④ A qualified sports expert who analyzes games on Monday morning broadcasts\n⑤ A fan without expertise who pretends to be a qualified advisor in sports management", "options": ["① An executive in a Monday sports meeting held for team management", "② A passionate fan who unconditionally defends local sports teams", "③ A head coach leading the team by analyzing the previous day’s games", "④ A qualified sports expert who analyzes games on Monday morning broadcasts", "⑤ A fan without expertise who pretends to be a qualified advisor in sports management"], "correctAnswer": "⑤", "explanation": "전문성 없이 스포츠 전문가에게 훈수를 두는 팬을 의미합니다.", "contentHtml": "<div class=\"text-question-title\">6. 밑줄 친 Monday Morning Quarterback이 다음 글에서 의미하는 바로 가장 적절한 것은?</div><div class=\"given\"><p>There is a reason why the title “<u>Monday Morning Quarterback</u>” exists. If you simply glance at fans’ social media comments about weekend matches, it becomes immediately apparent how many people believe they could play, coach, and manage sport teams more competently than actual professionals. This phenomenon extends directly to the corporate side of sports as well. Professionals with years of training and specialized degrees in sport business may also find themselves receiving unsolicited guidance on how to do their jobs from friends, family, or even total strangers with zero professional background. Executives in sport management have decades of knowledge and experience in their respective fields. Nevertheless, these seasoned experts frequently encounter backlash from fans and locals who try to dictate how the franchise should be operated. Very few tell doctors how to perform surgery or accountants how to prepare taxes, but many readily offer unwarranted feedback on how sport organizations should be managed.</p></div><div class=\"school-option\">① An executive in a Monday sports meeting held for team management</div><div class=\"school-option\">② A passionate fan who unconditionally defends local sports teams</div><div class=\"school-option\">③ A head coach leading the team by analyzing the previous day’s games</div><div class=\"school-option\">④ A qualified sports expert who analyzes games on Monday morning broadcasts</div><div class=\"school-option\">⑤ A fan without expertise who pretends to be a qualified advisor in sports management</div>", "layout": "standard"}, "7": {"title_question": "7. 밑줄 친 Accumulated biological debt eventually comes with a cost가 다음 글에서 의미하는 바로 가장 적절한 것은?", "score": "3.7점", "type": "함축 의미", "passage": "While you might postpone bedtime to maximize daily productivity, the physiological drive to sleep ultimately becomes unstoppable. This daily drive for sleep appears to be due, in part, to a compound known as adenosine. This natural chemical builds up in your blood as time awake increases. While you sleep, your body breaks down the adenosine. Thus, this molecule may be what your body uses to keep track of lost sleep and to trigger sleep when needed. An accumulation of adenosine and other factors might explain why, after several nights of less than optimal amounts of sleep, you build up a sleep debt that you must make up by sleeping longer than normal. This internal chemical system means your body can never just get used to running on too little sleep. Accumulated biological debt eventually comes with a cost.\n① Your body biologically forces you to recover the missing sleep.\n② You gradually adapt to functioning normally with minimal sleep.\n③ The level of adenosine drops suddenly, making you stay awake.\n④ You manage to overcome extreme exhaustion through willpower.\n⑤ Your brain fails to retain its natural ability to track the sleep debt.", "options": ["① Your body biologically forces you to recover the missing sleep.", "② You gradually adapt to functioning normally with minimal sleep.", "③ The level of adenosine drops suddenly, making you stay awake.", "④ You manage to overcome extreme exhaustion through willpower.", "⑤ Your brain fails to retain its natural ability to track the sleep debt."], "correctAnswer": "①", "explanation": "누적된 수면 부족은 결국 신체가 부족한 잠을 보충하도록 만든다는 뜻입니다.", "contentHtml": "<div class=\"text-question-title\">7. 밑줄 친 Accumulated biological debt eventually comes with a cost가 다음 글에서 의미하는 바로 가장 적절한 것은?</div><div class=\"given\"><p>While you might postpone bedtime to maximize daily productivity, the physiological drive to sleep ultimately becomes unstoppable. This daily drive for sleep appears to be due, in part, to a compound known as adenosine. This natural chemical builds up in your blood as time awake increases. While you sleep, your body breaks down the adenosine. Thus, this molecule may be what your body uses to keep track of lost sleep and to trigger sleep when needed. An accumulation of adenosine and other factors might explain why, after several nights of less than optimal amounts of sleep, you build up a sleep debt that you must make up by sleeping longer than normal. This internal chemical system means your body can never just get used to running on too little sleep. <u>Accumulated biological debt eventually comes with a cost.</u></p></div><div class=\"school-option\">① Your body biologically forces you to recover the missing sleep.</div><div class=\"school-option\">② You gradually adapt to functioning normally with minimal sleep.</div><div class=\"school-option\">③ The level of adenosine drops suddenly, making you stay awake.</div><div class=\"school-option\">④ You manage to overcome extreme exhaustion through willpower.</div><div class=\"school-option\">⑤ Your brain fails to retain its natural ability to track the sleep debt.</div>", "layout": "standard"}, "8": {"title_question": "8. 다음 글의 주제로 가장 적절한 것을 고르시오.", "score": "3.7점", "type": "글의 주제", "passage": "The famous primatologist Frans de Waal, of Emory University, says that humans downplay similarities between us and other animals as a way of maintaining our spot at the top of our imaginary ladder. Scientists, de Waal points out, can be some of the worst offenders — employing technical language to distance the other animals from us. They call “kissing” in chimps “mouth-to-mouth contact”; they call “friends” between primates “favorite affiliation partners”; they interpret evidence showing that crows and chimps can make tools as being somehow qualitatively different from the kind of toolmaking said to define humanity. If an animal can beat us at a cognitive task — like how certain bird species can remember the precise locations of thousands of seeds — they write it off as instinct, not intelligence. This and so many more tricks of language are what de Waal has termed “linguistic castration,” the way we use our tongues to disempower animals, the way we invent words to maintain our spot at the top.\n① Cognitive similarities between humans and primates\n② The uniqueness created by the use of technical language\n③ Language learning experiments conducted on animals with high cognitive abilities\n④ Cognitive differences between humans and primates regarding the concept of “friends”\n⑤ The way humans manipulate language to keep themselves at the top of the animal hierarchy", "options": ["① Cognitive similarities between humans and primates", "② The uniqueness created by the use of technical language", "③ Language learning experiments conducted on animals with high cognitive abilities", "④ Cognitive differences between humans and primates regarding the concept of “friends”", "⑤ The way humans manipulate language to keep themselves at the top of the animal hierarchy"], "correctAnswer": "⑤", "explanation": "인간은 동물보다 우월한 지위를 유지하려고 언어를 조작합니다.", "contentHtml": "<div class=\"text-question-title\">8. 다음 글의 주제로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>The famous primatologist Frans de Waal, of Emory University, says that humans downplay similarities between us and other animals as a way of maintaining our spot at the top of our imaginary ladder. Scientists, de Waal points out, can be some of the worst offenders — employing technical language to distance the other animals from us. They call “kissing” in chimps “mouth-to-mouth contact”; they call “friends” between primates “favorite affiliation partners”; they interpret evidence showing that crows and chimps can make tools as being somehow qualitatively different from the kind of toolmaking said to define humanity. If an animal can beat us at a cognitive task — like how certain bird species can remember the precise locations of thousands of seeds — they write it off as instinct, not intelligence. This and so many more tricks of language are what de Waal has termed “linguistic castration,” the way we use our tongues to disempower animals, the way we invent words to maintain our spot at the top.</p></div><div class=\"school-option\">① Cognitive similarities between humans and primates</div><div class=\"school-option\">② The uniqueness created by the use of technical language</div><div class=\"school-option\">③ Language learning experiments conducted on animals with high cognitive abilities</div><div class=\"school-option\">④ Cognitive differences between humans and primates regarding the concept of “friends”</div><div class=\"school-option\">⑤ The way humans manipulate language to keep themselves at the top of the animal hierarchy</div>", "layout": "standard"}, "9": {"title_question": "9. 다음 글의 제목으로 가장 적절한 것을 고르시오.", "score": "3.7점", "type": "글의 제목", "passage": "Big mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat. Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don’t run until necessary. Naturally, the nervous species are difficult to keep in captivity. If put into an enclosure, they are likely to panic, and either die of shock or hit themselves repeatedly to death against the fence in their attempts to escape. That’s true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!\n① Speed and Acuteness as Keys to Survival in the Wild\n② The Hidden Dangers of Keeping Wild Animals in Zoos\n③ Gazelles: The Most Valuable Game in the Fertile Crescent\n④ Standing Together: How Herds Defend Themselves Against Predators\n⑤ Too Nervous to Tame: Why Some Wild Animals Resist Domestication", "options": ["① Speed and Acuteness as Keys to Survival in the Wild", "② The Hidden Dangers of Keeping Wild Animals in Zoos", "③ Gazelles: The Most Valuable Game in the Fertile Crescent", "④ Standing Together: How Herds Defend Themselves Against Predators", "⑤ Too Nervous to Tame: Why Some Wild Animals Resist Domestication"], "correctAnswer": "⑤", "explanation": "지나치게 예민하고 도주 성향이 강한 동물이 가축화되기 어려운 이유입니다.", "contentHtml": "<div class=\"text-question-title\">9. 다음 글의 제목으로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Big mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat. Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don’t run until necessary. Naturally, the nervous species are difficult to keep in captivity. If put into an enclosure, they are likely to panic, and either die of shock or hit themselves repeatedly to death against the fence in their attempts to escape. That’s true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!</p></div><div class=\"school-option\">① Speed and Acuteness as Keys to Survival in the Wild</div><div class=\"school-option\">② The Hidden Dangers of Keeping Wild Animals in Zoos</div><div class=\"school-option\">③ Gazelles: The Most Valuable Game in the Fertile Crescent</div><div class=\"school-option\">④ Standing Together: How Herds Defend Themselves Against Predators</div><div class=\"school-option\">⑤ Too Nervous to Tame: Why Some Wild Animals Resist Domestication</div>", "layout": "standard"}, "10": {"title_question": "10. 다음 글의 제목으로 가장 적절한 것을 고르시오.", "score": "3.7점", "type": "글의 제목", "passage": "You hear again and again that some of the greatest composers were misunderstood in their own day. Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day. The reason for this initial lack of acceptance is unfamiliarity. The musical forms, or ideas expressed within them, were completely new. And yet, this is exactly one of the things that makes them so great. Effective composers have their own ideas. Have you ever seen the classic movie Amadeus? The composer Antonio Salieri is the “host” of this movie; he’s depicted as one of the most famous non-great composers — he lived at the time of Mozart and was completely overshadowed by him. Now, Salieri wasn’t a bad composer; in fact, he was a very good one. But he wasn’t one of the world’s great composers because his work wasn’t original. What he wrote sounded just like what everyone else was composing at the time.\n① Originality: What Makes a Composer Great\n② How Salieri Became More Famous Than Mozart\n③ Why Great Composers Avoid New Musical Ideas\n④ The Importance of Making Music Easy to Understand\n⑤ Why Familiar Music Is More Successful Than New Music", "options": ["① Originality: What Makes a Composer Great", "② How Salieri Became More Famous Than Mozart", "③ Why Great Composers Avoid New Musical Ideas", "④ The Importance of Making Music Easy to Understand", "⑤ Why Familiar Music Is More Successful Than New Music"], "correctAnswer": "①", "explanation": "위대한 작곡가를 만드는 핵심은 독창성입니다.", "contentHtml": "<div class=\"text-question-title\">10. 다음 글의 제목으로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>You hear again and again that some of the greatest composers were misunderstood in their own day. Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day. The reason for this initial lack of acceptance is unfamiliarity. The musical forms, or ideas expressed within them, were completely new. And yet, this is exactly one of the things that makes them so great. Effective composers have their own ideas. Have you ever seen the classic movie Amadeus? The composer Antonio Salieri is the “host” of this movie; he’s depicted as one of the most famous non-great composers — he lived at the time of Mozart and was completely overshadowed by him. Now, Salieri wasn’t a bad composer; in fact, he was a very good one. But he wasn’t one of the world’s great composers because his work wasn’t original. What he wrote sounded just like what everyone else was composing at the time.</p></div><div class=\"school-option\">① Originality: What Makes a Composer Great</div><div class=\"school-option\">② How Salieri Became More Famous Than Mozart</div><div class=\"school-option\">③ Why Great Composers Avoid New Musical Ideas</div><div class=\"school-option\">④ The Importance of Making Music Easy to Understand</div><div class=\"school-option\">⑤ Why Familiar Music Is More Successful Than New Music</div>", "layout": "standard"}, "11": {"title_question": "11. 다음 글의 내용과 일치하지 않는 것은?", "score": "3.7점", "type": "내용 불일치", "passage": "Philosophical activity is based on the recognition of ignorance. The philosopher’s thirst for knowledge is shown through attempts to find better answers to questions even if those answers are never found. At the same time, a philosopher also knows that being too sure can hinder the discovery of other and better possibilities. In a philosophical dialogue, the participants are aware that there are things they do not know or understand. The goal of the dialogue is to arrive at a conception that one did not know or understand beforehand. In traditional schools, where philosophy is not present, students often work with factual questions, they learn specific content listed in the curriculum, and they are not required to solve philosophical problems. However, we know that awareness of what one does not know can be a good way to acquire knowledge. Knowledge and understanding are developed through thinking and talking. Putting things into words makes things clearer. Therefore, students must not be afraid of saying something wrong or talking without first being sure that they are right.\n① 철학자는 질문에 대한 해답을 결코 찾지 못해도 더 나은 답을 찾기 위해 노력한다.\n② 철학자는 지나친 확신이 더 나은 가능성을 발견하는 것을 방해할 수 있다고 생각한다.\n③ 철학적 대화의 목표는 참여자들이 사전에 이미 알고 있던 개념을 명확하게 재확인하는 것이다.\n④ 철학이 부재한 전통적인 학교의 학생들은 철학적 문제를 해결하도록 요구받지 않는다.\n⑤ 학생들은 자신이 옳다는 확신이 없는 상태에서 말하거나 틀린 말을 하는 것을 두려워해서는 안 된다.", "options": ["① 철학자는 질문에 대한 해답을 결코 찾지 못해도 더 나은 답을 찾기 위해 노력한다.", "② 철학자는 지나친 확신이 더 나은 가능성을 발견하는 것을 방해할 수 있다고 생각한다.", "③ 철학적 대화의 목표는 참여자들이 사전에 이미 알고 있던 개념을 명확하게 재확인하는 것이다.", "④ 철학이 부재한 전통적인 학교의 학생들은 철학적 문제를 해결하도록 요구받지 않는다.", "⑤ 학생들은 자신이 옳다는 확신이 없는 상태에서 말하거나 틀린 말을 하는 것을 두려워해서는 안 된다."], "correctAnswer": "③", "explanation": "철학적 대화의 목표는 이미 아는 개념의 재확인이 아니라, 이전에 모르거나 이해하지 못했던 개념에 도달하는 것입니다.", "contentHtml": "<div class=\"text-question-title\">11. 다음 글의 내용과 일치하지 않는 것은?</div><div class=\"given\"><p>Philosophical activity is based on the recognition of ignorance. The philosopher’s thirst for knowledge is shown through attempts to find better answers to questions even if those answers are never found. At the same time, a philosopher also knows that being too sure can hinder the discovery of other and better possibilities. In a philosophical dialogue, the participants are aware that there are things they do not know or understand. The goal of the dialogue is to arrive at a conception that one did not know or understand beforehand. In traditional schools, where philosophy is not present, students often work with factual questions, they learn specific content listed in the curriculum, and they are not required to solve philosophical problems. However, we know that awareness of what one does not know can be a good way to acquire knowledge. Knowledge and understanding are developed through thinking and talking. Putting things into words makes things clearer. Therefore, students must not be afraid of saying something wrong or talking without first being sure that they are right.</p></div><div class=\"school-option\">① 철학자는 질문에 대한 해답을 결코 찾지 못해도 더 나은 답을 찾기 위해 노력한다.</div><div class=\"school-option\">② 철학자는 지나친 확신이 더 나은 가능성을 발견하는 것을 방해할 수 있다고 생각한다.</div><div class=\"school-option\">③ 철학적 대화의 목표는 참여자들이 사전에 이미 알고 있던 개념을 명확하게 재확인하는 것이다.</div><div class=\"school-option\">④ 철학이 부재한 전통적인 학교의 학생들은 철학적 문제를 해결하도록 요구받지 않는다.</div><div class=\"school-option\">⑤ 학생들은 자신이 옳다는 확신이 없는 상태에서 말하거나 틀린 말을 하는 것을 두려워해서는 안 된다.</div>", "layout": "standard"}, "12": {"title_question": "12. 다음 밑줄 친 부분 중, 어법상 틀린 것을 고르시오.", "score": "3.7점", "type": "어법", "passage": "Biologists distinguish two kinds of similarity. “Analogous” traits refer to those sharing a common function despite ① having evolved on different branches of the evolutionary tree and are in an important sense not “the same” organ. The wings of birds and the wings of bees are both used for flight and are similar in some ways since any anatomical structure ② designating for flying needs to be constructed in such a specific way, but they arose independently in evolution and have nothing in common beyond their use in flight. “Homologous” traits, in contrast, may or may not have a common function, but they descended from a common ancestor and hence have some common structure that indicates ③ their being “the same” organ. The wing of a bat and the front leg of a horse have very different functions, but they are all modifications of the forelimb of the ancestor of all mammals. As a result, they share nonfunctional traits such as the number of bones and the manner ④ in which they articulate with one another. To distinguish analogy from homology, biologists usually look at the overall architecture of the organs, paying special attention to characteristics that appear functionally ⑤ irrelevant.", "options": ["① having evolved", "② designating", "③ their", "④ in which", "⑤ irrelevant"], "correctAnswer": "②", "explanation": "구조물이 비행용으로 지정·설계된다는 수동 의미이므로 designating → designated가 필요합니다. 의미상 designed for flying도 자연스럽습니다.", "contentHtml": "<div class=\"text-question-title\">12. 다음 밑줄 친 부분 중, 어법상 틀린 것을 고르시오.</div><div class=\"given\"><p>Biologists distinguish two kinds of similarity. “Analogous” traits refer to those sharing a common function despite ① <u>having evolved</u> on different branches of the evolutionary tree and are in an important sense not “the same” organ. The wings of birds and the wings of bees are both used for flight and are similar in some ways since any anatomical structure ② <u>designating</u> for flying needs to be constructed in such a specific way, but they arose independently in evolution and have nothing in common beyond their use in flight. “Homologous” traits, in contrast, may or may not have a common function, but they descended from a common ancestor and hence have some common structure that indicates ③ <u>their</u> being “the same” organ. The wing of a bat and the front leg of a horse have very different functions, but they are all modifications of the forelimb of the ancestor of all mammals. As a result, they share nonfunctional traits such as the number of bones and the manner ④ <u>in which</u> they articulate with one another. To distinguish analogy from homology, biologists usually look at the overall architecture of the organs, paying special attention to characteristics that appear functionally ⑤ <u>irrelevant</u>.</p></div><div class=\"text-options grammar-options\"><div>① having evolved</div><div>② designating</div><div>③ their</div><div>④ in which</div><div>⑤ irrelevant</div></div>", "layout": "standard"}, "13": {"title_question": "13. 다음 밑줄 친 부분 중, 어법상 틀린 것을 고르시오.", "score": "3.7점", "type": "어법", "passage": "Whether we feel happy or sad, content or discontent, ① is not determined merely by each individual successive moment of life experience — a good thing happens and I’m happy, a bad thing happens and I’m sad. While our experiences affect our mood, we are not blown in a ② completely new direction by each gust of wind. As humans, we adjust — to new information and events both good and bad — and ③ return to our personal default level of well-being. There will be highs and lows, but over time, like water seeking its own level, we are pulled toward our baseline — back up after bad news and back down after good. The euphoria of first love fades, and so ④ does the despairs of a break-up. This tendency is best seen with little kids and their toy joy: When they get ⑤ what they’ve longed for, they believe they will be happy for the rest of their lives. And for the first few minutes of the rest of their lives, they are. But then the kids — like adults — adapt.", "options": ["① is", "② completely", "③ return", "④ does", "⑤ what"], "correctAnswer": "④", "explanation": "주어 the despairs가 복수 형태이므로 does → do로 고쳐 수를 일치시킵니다. 아래 설명을 참고해 주세요.", "contentHtml": "<div class=\"text-question-title\">13. 다음 밑줄 친 부분 중, 어법상 틀린 것을 고르시오.</div><div class=\"given\"><p>Whether we feel happy or sad, content or discontent, ① <u>is</u> not determined merely by each individual successive moment of life experience — a good thing happens and I’m happy, a bad thing happens and I’m sad. While our experiences affect our mood, we are not blown in a ② <u>completely</u> new direction by each gust of wind. As humans, we adjust — to new information and events both good and bad — and ③ <u>return</u> to our personal default level of well-being. There will be highs and lows, but over time, like water seeking its own level, we are pulled toward our baseline — back up after bad news and back down after good. The euphoria of first love fades, and so ④ <u>does</u> the despairs of a break-up. This tendency is best seen with little kids and their toy joy: When they get ⑤ <u>what</u> they’ve longed for, they believe they will be happy for the rest of their lives. And for the first few minutes of the rest of their lives, they are. But then the kids — like adults — adapt.</p></div><div class=\"text-options grammar-options\"><div>① is</div><div>② completely</div><div>③ return</div><div>④ does</div><div>⑤ what</div></div>", "layout": "standard"}, "14": {"title_question": "14. 다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것을 고르시오.", "score": "3.7점", "type": "문맥상 어휘", "passage": "Collaboration between a culturally diverse workforce and the native population could ① enhance productivity, driven by beneficial side effects such as the sharing of expertise. This is only an advantage up to a certain degree. When the variety of backgrounds is too large, over-segmentation may cause ② moderate transaction costs for communication, which may lower productivity. Diversity extends its influence beyond the job market, potentially altering the living standards within a specific area. A tolerant native population may ③ value a multicultural city or region because of an increase in the range of available goods and services. On the other hand, diversity could be regarded as a(n) ④ unwelcome element if natives perceive it as a distortion of what they consider to be their national identity. They might even ⑤ discriminate against other ethnic groups and they might fear that overseas disputes among different foreign communities might be brought directly to their doorsteps.", "options": [], "correctAnswer": "②", "explanation": "과도한 세분화가 생산성을 낮추는 문맥이므로 moderate → high / excessive가 적절합니다.", "contentHtml": "<div class=\"text-question-title\">14. 다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것을 고르시오.</div><div class=\"given\"><p>Collaboration between a culturally diverse workforce and the native population could ① <u>enhance</u> productivity, driven by beneficial side effects such as the sharing of expertise. This is only an advantage up to a certain degree. When the variety of backgrounds is too large, over-segmentation may cause ② <u>moderate</u> transaction costs for communication, which may lower productivity. Diversity extends its influence beyond the job market, potentially altering the living standards within a specific area. A tolerant native population may ③ <u>value</u> a multicultural city or region because of an increase in the range of available goods and services. On the other hand, diversity could be regarded as a(n) ④ <u>unwelcome</u> element if natives perceive it as a distortion of what they consider to be their national identity. They might even ⑤ <u>discriminate</u> against other ethnic groups and they might fear that overseas disputes among different foreign communities might be brought directly to their doorsteps.</p></div>", "layout": "standard"}, "15": {"title_question": "15. 다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것을 고르시오.", "score": "3.7점", "type": "문맥상 어휘", "passage": "The desert tortoise deals with the extreme heat of Death Valley in a simple way: it ① avoids it. This slow-moving animal hibernates in winter and stays in its underground tunnel for most of the summer, which means it spends over 90 percent of its life ② inactive. In fact, the tortoise usually comes out only after a heavy rain. Then it becomes ③ active, storing up water by eating plants and digging holes to catch rainwater. However, to keep enough water during its long hibernation, the tortoise depends on something else: its highly developed bladder. Unlike that of most animals, the tortoise’s bladder works like a storage tank, allowing the tortoise to ④ release water out of its body. Amazingly, a desert tortoise can survive a whole year without drinking any fresh water. Because the bladder is so important for its survival, park rangers often tell visitors not to pick up tortoises to help them cross the road. When people lift them, the tortoises get so frightened that they empty their bladders, losing their ⑤ precious water supply.", "options": [], "correctAnswer": "④", "explanation": "방광은 물을 몸 밖으로 내보내는 것이 아니라 저장·보존합니다. release → retain / store가 적절합니다.", "contentHtml": "<div class=\"text-question-title\">15. 다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것을 고르시오.</div><div class=\"given\"><p>The desert tortoise deals with the extreme heat of Death Valley in a simple way: it ① <u>avoids</u> it. This slow-moving animal hibernates in winter and stays in its underground tunnel for most of the summer, which means it spends over 90 percent of its life ② <u>inactive</u>. In fact, the tortoise usually comes out only after a heavy rain. Then it becomes ③ <u>active</u>, storing up water by eating plants and digging holes to catch rainwater. However, to keep enough water during its long hibernation, the tortoise depends on something else: its highly developed bladder. Unlike that of most animals, the tortoise’s bladder works like a storage tank, allowing the tortoise to ④ <u>release</u> water out of its body. Amazingly, a desert tortoise can survive a whole year without drinking any fresh water. Because the bladder is so important for its survival, park rangers often tell visitors not to pick up tortoises to help them cross the road. When people lift them, the tortoises get so frightened that they empty their bladders, losing their ⑤ <u>precious</u> water supply.</p></div>", "layout": "standard"}, "16": {"title_question": "16. 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.", "score": "4.3점", "type": "빈칸 추론", "passage": "It is widely acknowledged that individuals evaluate others based on their attire. Typically, studies investigating these perceptions indicate a preference for predictable outfits, though there is one remarkable exception. Research published in 2014 investigated how onlookers responded to individuals who made minor deviations from accepted social norms. In one situation, a man at a formal event was thought to be more successful and capable due to his choice of a red bow tie. Furthermore, the findings indicated that an audience’s preference for unconventionality positively impacted their perception of a red-sneaker-wearing professor’s status and proficiency. The data indicates that individuals perceive minor departures from convention favorably, as it implies that they ____________________. Various studies indicate that an individual is perceived favorably when they make minor deviations from expected attire.\n① strictly conform to the traditional dress codes of their society\n② lack the social awareness required to blend in with the crowd\n③ are highly sensitive to the latest trends in the fashion industry\n④ tend to prioritize their personal comfort over professional duties\n⑤ possess sufficient authority to endure the social penalties of such actions", "options": ["① strictly conform to the traditional dress codes of their society", "② lack the social awareness required to blend in with the crowd", "③ are highly sensitive to the latest trends in the fashion industry", "④ tend to prioritize their personal comfort over professional duties", "⑤ possess sufficient authority to endure the social penalties of such actions"], "correctAnswer": "⑤", "explanation": "사소한 규범 위반에 따르는 사회적 불이익을 감당할 지위나 권한이 있다고 인식하기 때문입니다.", "contentHtml": "<div class=\"text-question-title\">16. 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>It is widely acknowledged that individuals evaluate others based on their attire. Typically, studies investigating these perceptions indicate a preference for predictable outfits, though there is one remarkable exception. Research published in 2014 investigated how onlookers responded to individuals who made minor deviations from accepted social norms. In one situation, a man at a formal event was thought to be more successful and capable due to his choice of a red bow tie. Furthermore, the findings indicated that an audience’s preference for unconventionality positively impacted their perception of a red-sneaker-wearing professor’s status and proficiency. The data indicates that individuals perceive minor departures from convention favorably, as it implies that they <span class=\"answer-blank wide-blank\">&nbsp;</span>. Various studies indicate that an individual is perceived favorably when they make minor deviations from expected attire.</p></div><div class=\"school-option\">① strictly conform to the traditional dress codes of their society</div><div class=\"school-option\">② lack the social awareness required to blend in with the crowd</div><div class=\"school-option\">③ are highly sensitive to the latest trends in the fashion industry</div><div class=\"school-option\">④ tend to prioritize their personal comfort over professional duties</div><div class=\"school-option\">⑤ possess sufficient authority to endure the social penalties of such actions</div>", "layout": "standard"}, "17": {"title_question": "17. 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.", "score": "4.3점", "type": "빈칸 추론", "passage": "The discovery of mirror neurons has fundamentally reshaped our understanding of a basic human capacity: learning through observation. As children, we absorb a great deal from watching the people around us. In the first week after birth, infants already display an innate tendency to poke out their tongues when a parent does the same. This mimicry is, however, far from exact. An infant will not necessarily respond each time you stick out your tongue, but if you repeat the gesture many times, the tongue will appear more often than it does after some other gesture. Babies also babble, and eventually begin to reproduce the sounds their parents make. Later still, they play with vacuum cleaners and hammers, copying what their parents do. The modern cultures we inhabit, in which people write, read, build spaceships, and attend school, could not function if every individual were confined to inborn behavior or to whatever trial and error happened to teach. They are viable only because ____________________.\n① the behavior that infants imitate is gradually refined until it becomes identical to that of the model\n② children’s imitation is selectively directed toward behaviors that bring them immediate rewards\n③ observed actions are automatically converted into innate responses that can be inherited by later generations\n④ formal institutions such as schools systematically replace spontaneous imitation with deliberate instruction\n⑤ the results of one person’s experience can be taken over by others without their having to go through the same process", "options": ["① the behavior that infants imitate is gradually refined until it becomes identical to that of the model", "② children’s imitation is selectively directed toward behaviors that bring them immediate rewards", "③ observed actions are automatically converted into innate responses that can be inherited by later generations", "④ formal institutions such as schools systematically replace spontaneous imitation with deliberate instruction", "⑤ the results of one person’s experience can be taken over by others without their having to go through the same process"], "correctAnswer": "⑤", "explanation": "다른 사람이 경험한 결과를 동일한 시행착오 없이 관찰·모방으로 습득할 수 있기 때문입니다.", "contentHtml": "<div class=\"text-question-title\">17. 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>The discovery of mirror neurons has fundamentally reshaped our understanding of a basic human capacity: learning through observation. As children, we absorb a great deal from watching the people around us. In the first week after birth, infants already display an innate tendency to poke out their tongues when a parent does the same. This mimicry is, however, far from exact. An infant will not necessarily respond each time you stick out your tongue, but if you repeat the gesture many times, the tongue will appear more often than it does after some other gesture. Babies also babble, and eventually begin to reproduce the sounds their parents make. Later still, they play with vacuum cleaners and hammers, copying what their parents do. The modern cultures we inhabit, in which people write, read, build spaceships, and attend school, could not function if every individual were confined to inborn behavior or to whatever trial and error happened to teach. They are viable only because <span class=\"answer-blank wide-blank\">&nbsp;</span>.</p></div><div class=\"school-option\">① the behavior that infants imitate is gradually refined until it becomes identical to that of the model</div><div class=\"school-option\">② children’s imitation is selectively directed toward behaviors that bring them immediate rewards</div><div class=\"school-option\">③ observed actions are automatically converted into innate responses that can be inherited by later generations</div><div class=\"school-option\">④ formal institutions such as schools systematically replace spontaneous imitation with deliberate instruction</div><div class=\"school-option\">⑤ the results of one person’s experience can be taken over by others without their having to go through the same process</div>", "layout": "standard"}, "18": {"title_question": "18. 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.", "score": "4.3점", "type": "빈칸 추론", "passage": "Those who oppose animal research assert that the reduction in mortality rates cannot be solely attributed to modern medicine, adding that numerous medical breakthroughs beneficial to human health were achieved without animal experimentation. Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter. Opponents of research reject this inference. After all, we have independent reasons to expect these phenomena to be correlated. Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals. Therefore, the apparent connection between animal trials and medical progress is actually ____________________, instead of valid evidence showing a causal relationship. Moreover, several influential physicians have offered historical evidence that animal experimentation has not been as responsible for biomedical discovery as defenders suggest. They claim that clinical discoveries played a more substantial role than animal researchers have led us to believe.\n① a major obstacle to applying new surgical techniques\n② a complex moral dilemma faced by modern researchers\n③ an unavoidable outcome dictated by established medical laws\n④ an undeniable foundation for all biomedical breakthroughs\n⑤ an independent phenomenon unrelated to falling death rates", "options": ["① a major obstacle to applying new surgical techniques", "② a complex moral dilemma faced by modern researchers", "③ an unavoidable outcome dictated by established medical laws", "④ an undeniable foundation for all biomedical breakthroughs", "⑤ an independent phenomenon unrelated to falling death rates"], "correctAnswer": "③", "explanation": "동물실험과 의학 발전의 상관관계는 법적 의무에 따라 생긴 결과일 수 있으므로, 그 자체로 인과관계를 입증하지 못합니다.", "contentHtml": "<div class=\"text-question-title\">18. 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Those who oppose animal research assert that the reduction in mortality rates cannot be solely attributed to modern medicine, adding that numerous medical breakthroughs beneficial to human health were achieved without animal experimentation. Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter. Opponents of research reject this inference. After all, we have independent reasons to expect these phenomena to be correlated. Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals. Therefore, the apparent connection between animal trials and medical progress is actually <span class=\"answer-blank wide-blank\">&nbsp;</span>, instead of valid evidence showing a causal relationship. Moreover, several influential physicians have offered historical evidence that animal experimentation has not been as responsible for biomedical discovery as defenders suggest. They claim that clinical discoveries played a more substantial role than animal researchers have led us to believe.</p></div><div class=\"school-option\">① a major obstacle to applying new surgical techniques</div><div class=\"school-option\">② a complex moral dilemma faced by modern researchers</div><div class=\"school-option\">③ an unavoidable outcome dictated by established medical laws</div><div class=\"school-option\">④ an undeniable foundation for all biomedical breakthroughs</div><div class=\"school-option\">⑤ an independent phenomenon unrelated to falling death rates</div>", "layout": "standard"}, "19": {"title_question": "19. 다음 글에서 흐름과 관계없는 문장을 고르시오.", "score": "3.7점", "type": "무관한 문장", "passage": "When you pull and release a guitar string, it moves back and forth hundreds of times every second. Naturally, this movement is so fast that you cannot see it — you just see the blurred outline of the moving string. ① Strings vibrating in this way on their own make hardly any noise because strings are very thin and don’t push much air about. ② But if you attach a string to a big hollow box (like a guitar body), then the vibration is amplified and the note is heard loud and clear. ③ The motion of the vibrating string is transmitted to the wooden panels of the guitar, causing them to vibrate at an identical frequency. ④ Because sound is amplified more loudly as the wooden panels become thicker, they are manufactured to be as thick and durable as possible. ⑤ The vibration of the wood creates more powerful waves in the air pressure, which travel away from the guitar, and when the waves reach your eardrums they flex in and out the same number of times a second as the original string.", "options": [], "correctAnswer": "④", "explanation": "기타의 진동이 전달되어 소리가 커지는 원리에서 벗어나, 목재 두께와 내구성에 관한 설명으로 전환됩니다.", "contentHtml": "<div class=\"text-question-title\">19. 다음 글에서 흐름과 관계없는 문장을 고르시오.</div><div class=\"given\"><p>When you pull and release a guitar string, it moves back and forth hundreds of times every second. Naturally, this movement is so fast that you cannot see it — you just see the blurred outline of the moving string. ① Strings vibrating in this way on their own make hardly any noise because strings are very thin and don’t push much air about. ② But if you attach a string to a big hollow box (like a guitar body), then the vibration is amplified and the note is heard loud and clear. ③ The motion of the vibrating string is transmitted to the wooden panels of the guitar, causing them to vibrate at an identical frequency. ④ Because sound is amplified more loudly as the wooden panels become thicker, they are manufactured to be as thick and durable as possible. ⑤ The vibration of the wood creates more powerful waves in the air pressure, which travel away from the guitar, and when the waves reach your eardrums they flex in and out the same number of times a second as the original string.</p></div>", "layout": "standard"}, "20": {"title_question": "20. 다음 글에서 흐름과 관계없는 문장을 고르시오.", "score": "4.3점", "type": "무관한 문장", "passage": "One of the common themes of the Western philosophical tradition is the distinction between sensual perceptions and rational knowledge. Since Plato, the supremacy of rational reason is based on the assertion that it is able to extract true knowledge from experience. ① As the discussion in the Republic helps to explain, perceptions are inherently unreliable and misleading because the senses are subject to errors and illusions. ② Only the rational discourse has the tools to overcome illusions and to point towards true knowledge. ③ Modern optical technology, such as cameras and digital displays, has made it possible to capture accurate visual images that perfectly imitate human perception. ④ For instance, perception suggests that a figure in the distance is smaller than it really is. ⑤ Yet, the application of logical reasoning will reveal that the figure only appears small because it obeys the laws of geometrical perspective. Nevertheless, even after the perspectival correction is applied and reason concludes that perception is misleading, the figure still appears small, and the truth of the matter is revealed not in the perception of the figure but in its rational representation.", "options": [], "correctAnswer": "③", "explanation": "감각의 오류와 이성적 판단의 관계를 설명하는 글에 광학 기술의 발전은 무관합니다.", "contentHtml": "<div class=\"text-question-title\">20. 다음 글에서 흐름과 관계없는 문장을 고르시오.</div><div class=\"given\"><p>One of the common themes of the Western philosophical tradition is the distinction between sensual perceptions and rational knowledge. Since Plato, the supremacy of rational reason is based on the assertion that it is able to extract true knowledge from experience. ① As the discussion in the Republic helps to explain, perceptions are inherently unreliable and misleading because the senses are subject to errors and illusions. ② Only the rational discourse has the tools to overcome illusions and to point towards true knowledge. ③ Modern optical technology, such as cameras and digital displays, has made it possible to capture accurate visual images that perfectly imitate human perception. ④ For instance, perception suggests that a figure in the distance is smaller than it really is. ⑤ Yet, the application of logical reasoning will reveal that the figure only appears small because it obeys the laws of geometrical perspective. Nevertheless, even after the perspectival correction is applied and reason concludes that perception is misleading, the figure still appears small, and the truth of the matter is revealed not in the perception of the figure but in its rational representation.</p></div>", "layout": "standard"}, "21": {"title_question": "21. 다음 글에서 흐름과 관계없는 문장을 고르시오.", "score": "3.7점", "type": "무관한 문장", "passage": "American journalist Richard Heinberg claims that building renewable energy systems to fight global warming is one of the biggest projects of change in human history. ① Besides solar panels and wind turbines, we also need to create new systems for transportation, farming, and industry, and this huge change cannot take place without fossil fuels. ② For example, making concrete structures and steel parts takes a great deal of energy, which can currently be supplied only by fossil fuels. ③ Likewise, solar panels are made from rare and costly minerals that have to be dug out of the ground, a process that also depends on fossil fuels. ④ In recent years, solar panels have become much cheaper for ordinary homeowners, so more and more families are installing them on their roofs. ⑤ As a result, the faster we move toward renewable energy, the more fossil fuels we must burn to build it, which is not only costly but also weakens our efforts to reduce global emissions. Heinberg points out that plans for this energy transition rarely include the cost of building the new infrastructure, as they usually focus only on how much energy will be supplied.", "options": [], "correctAnswer": "④", "explanation": "재생에너지 기반 시설을 만드는 데 화석연료가 필요하다는 흐름에서 가정용 태양광의 가격·보급 이야기는 벗어납니다.", "contentHtml": "<div class=\"text-question-title\">21. 다음 글에서 흐름과 관계없는 문장을 고르시오.</div><div class=\"given\"><p>American journalist Richard Heinberg claims that building renewable energy systems to fight global warming is one of the biggest projects of change in human history. ① Besides solar panels and wind turbines, we also need to create new systems for transportation, farming, and industry, and this huge change cannot take place without fossil fuels. ② For example, making concrete structures and steel parts takes a great deal of energy, which can currently be supplied only by fossil fuels. ③ Likewise, solar panels are made from rare and costly minerals that have to be dug out of the ground, a process that also depends on fossil fuels. ④ In recent years, solar panels have become much cheaper for ordinary homeowners, so more and more families are installing them on their roofs. ⑤ As a result, the faster we move toward renewable energy, the more fossil fuels we must burn to build it, which is not only costly but also weakens our efforts to reduce global emissions. Heinberg points out that plans for this energy transition rarely include the cost of building the new infrastructure, as they usually focus only on how much energy will be supplied.</p></div>", "layout": "standard"}, "22": {"title_question": "22. 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.", "score": "3.7점", "type": "글의 순서", "passage": "Every day, consciously or not, we engage in negotiations. However, the actual skill of negotiating is rarely learned by most individuals.\n(A) With this in mind, it’s essential to achieve successful results for ourselves and maintain a healthy relationship with our negotiating partners at the same time. In today’s closely linked society of business partnerships and enduring connections, a mutually beneficial outcome is fast becoming the only acceptable result.\n(B) When people do learn, they tend to focus on classic competitive tactics instead of seeking a framework that yields mutual gains.\n(C) This outdated, adversarial approach may be useful in a one-off negotiation where you will probably not deal with that person again. However, such transactions are becoming increasingly rare, since we continually interact with a recurring circle of individuals, ranging from family members to professional contacts.\n① (A) - (C) - (B)　　② (B) - (A) - (C)\n③ (B) - (C) - (A)　　④ (C) - (A) - (B)\n⑤ (C) - (B) - (A)", "options": ["① (A) - (C) - (B)", "② (B) - (A) - (C)", "③ (B) - (C) - (A)", "④ (C) - (A) - (B)", "⑤ (C) - (B) - (A)"], "correctAnswer": "③", "explanation": "B → C → A. 경쟁적 협상 방식 소개 → 그 방식의 한계 → 상호 이익을 추구해야 한다는 결론입니다.", "contentHtml": "<div class=\"text-question-title\">22. 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Every day, consciously or not, we engage in negotiations. However, the actual skill of negotiating is rarely learned by most individuals.</p></div><p class=\"sequence\">(A) With this in mind, it’s essential to achieve successful results for ourselves and maintain a healthy relationship with our negotiating partners at the same time. In today’s closely linked society of business partnerships and enduring connections, a mutually beneficial outcome is fast becoming the only acceptable result.</p><p class=\"sequence\">(B) When people do learn, they tend to focus on classic competitive tactics instead of seeking a framework that yields mutual gains.</p><p class=\"sequence\">(C) This outdated, adversarial approach may be useful in a one-off negotiation where you will probably not deal with that person again. However, such transactions are becoming increasingly rare, since we continually interact with a recurring circle of individuals, ranging from family members to professional contacts.</p><div class=\"school-option\">① (A) - (C) - (B)</div><div class=\"school-option\">② (B) - (A) - (C)</div><div class=\"school-option\">③ (B) - (C) - (A)</div><div class=\"school-option\">④ (C) - (A) - (B)</div><div class=\"school-option\">⑤ (C) - (B) - (A)</div>", "layout": "standard"}, "23": {"title_question": "23. 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.", "score": "4.4점", "type": "글의 순서", "passage": "The evolutionary history of a species or a disease is like any other kind of history. There is no experiment, in the usual sense, that we can do now to decide how long ago our ancestors first started to use fires for cooking or other purposes and what subsequent evolutionary effects that change may have had.\n(A) Likewise, the chemical structure of proteins and DNA may be read to reveal relationships among now strikingly different organisms. Until a time machine is invented, we will not be able to go back and watch the evolution of major traits.\n(B) History can be investigated only by examining the records it has left. Charred bones or even carbon deposits from an ancient campfire can be informative documents to people who know how to read them.\n(C) We can nonetheless reconstruct prehistoric events by the records they’ve left in fossils, carbon traces, structures, and behavioral tendencies, as well as protein and DNA structures. Even when we cannot reconstruct the history of a trait, we can often still be confident that it was shaped by natural selection.\n① (A) - (C) - (B)　　② (B) - (A) - (C)\n③ (B) - (C) - (A)　　④ (C) - (A) - (B)\n⑤ (C) - (B) - (A)", "options": ["① (A) - (C) - (B)", "② (B) - (A) - (C)", "③ (B) - (C) - (A)", "④ (C) - (A) - (B)", "⑤ (C) - (B) - (A)"], "correctAnswer": "②", "explanation": "B → A → C. 역사적 흔적의 조사 → DNA도 같은 역할을 한다는 설명 → 과거를 직접 관찰하지 못해도 재구성할 수 있다는 정리입니다.", "contentHtml": "<div class=\"text-question-title\">23. 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>The evolutionary history of a species or a disease is like any other kind of history. There is no experiment, in the usual sense, that we can do now to decide how long ago our ancestors first started to use fires for cooking or other purposes and what subsequent evolutionary effects that change may have had.</p></div><p class=\"sequence\">(A) Likewise, the chemical structure of proteins and DNA may be read to reveal relationships among now strikingly different organisms. Until a time machine is invented, we will not be able to go back and watch the evolution of major traits.</p><p class=\"sequence\">(B) History can be investigated only by examining the records it has left. Charred bones or even carbon deposits from an ancient campfire can be informative documents to people who know how to read them.</p><p class=\"sequence\">(C) We can nonetheless reconstruct prehistoric events by the records they’ve left in fossils, carbon traces, structures, and behavioral tendencies, as well as protein and DNA structures. Even when we cannot reconstruct the history of a trait, we can often still be confident that it was shaped by natural selection.</p><div class=\"school-option\">① (A) - (C) - (B)</div><div class=\"school-option\">② (B) - (A) - (C)</div><div class=\"school-option\">③ (B) - (C) - (A)</div><div class=\"school-option\">④ (C) - (A) - (B)</div><div class=\"school-option\">⑤ (C) - (B) - (A)</div>", "layout": "standard"}, "24": {"title_question": "24. 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.", "score": "3.7점", "type": "문장 삽입", "passage": "This statement perfectly summarizes the quest for essences.\nConcepts are vital to human survival, but we must also be careful with them because concepts open the door to essentialism. ( ① ) They encourage us to see things that aren’t present. ( ② ) Stuart Firestein opens his book, Ignorance, with an old proverb, “It is very difficult to find a black cat in a dark room, especially when there is no cat.” ( ③ ) History has many examples of scientists who searched fruitlessly for an essence because they used the wrong concept to guide their hypotheses. ( ④ ) Firestein gives the example of luminiferous ether, a mysterious substance that was thought to fill the universe so that light would have a medium to move through. ( ⑤ ) The ether was a black cat, writes Firestein, and physicists had been theorizing in a dark room, and then experimenting in it, looking for evidence of a cat that did not exist.", "options": [], "correctAnswer": "③", "explanation": "This statement가 바로 앞의 ‘존재하지 않는 검은 고양이 찾기’라는 격언을 가리킵니다.", "contentHtml": "<div class=\"text-question-title\">24. 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.</div><div class=\"given\"><p>This statement perfectly summarizes the quest for essences.</p></div><p class=\"sequence\">Concepts are vital to human survival, but we must also be careful with them because concepts open the door to essentialism. <span class=\"insertion-point\">(①)</span> They encourage us to see things that aren’t present. <span class=\"insertion-point\">(②)</span> Stuart Firestein opens his book, Ignorance, with an old proverb, “It is very difficult to find a black cat in a dark room, especially when there is no cat.” <span class=\"insertion-point\">(③)</span> History has many examples of scientists who searched fruitlessly for an essence because they used the wrong concept to guide their hypotheses. <span class=\"insertion-point\">(④)</span> Firestein gives the example of luminiferous ether, a mysterious substance that was thought to fill the universe so that light would have a medium to move through. <span class=\"insertion-point\">(⑤)</span> The ether was a black cat, writes Firestein, and physicists had been theorizing in a dark room, and then experimenting in it, looking for evidence of a cat that did not exist.</p>", "layout": "standard"}, "25": {"title_question": "25. 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.", "score": "4.3점", "type": "문장 삽입", "passage": "Despite these numbers, emotion still dictates their preference for driving, clouding rational thought.\nMany individuals are deeply frightened of flying. In most cases, this panic is derived from not being in charge. ( ① ) The pilot is in control, not the passengers, and this lack of control instills fear. ( ② ) Overwhelmed by this fear, many prospective passengers choose to cover extensive distances by car as an alternative to flying. ( ③ ) Logic says that statistically, the odds of dying in a car crash are around 1 in 5,000, while the odds of dying in a plane crash are closer to 1 in 11 million. ( ④ ) If you’re going to take a risk, especially one that could possibly involve your well-being, wouldn’t you want the odds in your favor? ( ⑤ ) However, most people choose the option that will cause them the least amount of anxiety. Pay attention to the thoughts you have about taking the risk and make sure you’re basing your decision on facts, not just feelings.", "options": [], "correctAnswer": "④", "explanation": "these numbers가 바로 앞에 제시된 자동차·항공기 사고 사망 확률을 받습니다.", "contentHtml": "<div class=\"text-question-title\">25. 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.</div><div class=\"given\"><p>Despite these numbers, emotion still dictates their preference for driving, clouding rational thought.</p></div><p class=\"sequence\">Many individuals are deeply frightened of flying. In most cases, this panic is derived from not being in charge. <span class=\"insertion-point\">(①)</span> The pilot is in control, not the passengers, and this lack of control instills fear. <span class=\"insertion-point\">(②)</span> Overwhelmed by this fear, many prospective passengers choose to cover extensive distances by car as an alternative to flying. <span class=\"insertion-point\">(③)</span> Logic says that statistically, the odds of dying in a car crash are around 1 in 5,000, while the odds of dying in a plane crash are closer to 1 in 11 million. <span class=\"insertion-point\">(④)</span> If you’re going to take a risk, especially one that could possibly involve your well-being, wouldn’t you want the odds in your favor? <span class=\"insertion-point\">(⑤)</span> However, most people choose the option that will cause them the least amount of anxiety. Pay attention to the thoughts you have about taking the risk and make sure you’re basing your decision on facts, not just feelings.</p>", "layout": "standard"}, "26": {"title_question": "26. 다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것을 고르시오.", "score": "3.7점", "type": "요약문 완성", "passage": "Most people have no doubt heard this question: Does a sound truly exist if a tree collapses in a deserted forest with no observers present to perceive it? The correct answer is no. Sound is more than pressure waves, and indeed there can be no sound without a hearer. And similarly, scientific communication is a two-way process. Just as a signal of any kind is useless unless it is perceived, a published scientific paper (signal) is useless unless it is both received and understood by its intended audience. Thus we can restate the axiom of science as follows: A scientific experiment is not complete until the results have been published and understood. Publication is no more than pressure waves unless the published paper is understood. Countless scientific publications fail to reach their audience, making no meaningful impact.\n↓\nIn the same way that a sound needs a listener to actually exist, simply publishing a scientific paper remains _____(A)_____, except when its findings are adequately _____(B)_____ by its target audience.\n(A)　　　　　　　　　(B)\n① meaningless　　 ……　 comprehended\n② objective　　　 ……　 perceived\n③ ineffective　　　……　 ignored\n④ impactful　　　 ……　 distributed\n⑤ significant　　　……　 evaluated", "options": ["① meaningless　　 ……　 comprehended", "② objective　　　 ……　 perceived", "③ ineffective　　　……　 ignored", "④ impactful　　　 ……　 distributed", "⑤ significant　　　……　 evaluated"], "correctAnswer": "①", "explanation": "논문은 독자가 이해해야(comprehended) 의미가 있으므로, 이해되지 않은 출판은 **무의미(meaningless)**합니다.", "contentHtml": "<div class=\"text-question-title\">26. 다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Most people have no doubt heard this question: Does a sound truly exist if a tree collapses in a deserted forest with no observers present to perceive it? The correct answer is no. Sound is more than pressure waves, and indeed there can be no sound without a hearer. And similarly, scientific communication is a two-way process. Just as a signal of any kind is useless unless it is perceived, a published scientific paper (signal) is useless unless it is both received and understood by its intended audience. Thus we can restate the axiom of science as follows: A scientific experiment is not complete until the results have been published and understood. Publication is no more than pressure waves unless the published paper is understood. Countless scientific publications fail to reach their audience, making no meaningful impact.</p></div><div class=\"summary-arrow\">↓</div><div class=\"given\"><p>In the same way that a sound needs a listener to actually exist, simply publishing a scientific paper remains <span class=\"answer-blank summary-blank\">(A)</span>, except when its findings are adequately <span class=\"answer-blank summary-blank\">(B)</span> by its target audience.</p></div><div class=\"option-head\">　　　　(A)　　　　　　　　(B)</div><div class=\"school-option\">① meaningless　　 ……
