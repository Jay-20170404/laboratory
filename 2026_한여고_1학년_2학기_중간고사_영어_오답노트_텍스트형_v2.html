<script>
const EXAM={id:'2026-hanyeo-g1-s2-midterm-english',title:'한여고 1학년 2학기 중간고사',subject:'영어',rangeLabel:'객관식 1~21번 · 논술형 1~4번',version:2};
const EXAM_ID=EXAM.id,STORAGE='incorrect-notes:'+EXAM_ID+':v1';
const DB={"1": {"label": "1번", "type": "심경 변화", "score": "3.1점", "correctAnswer": "①", "answerItems": [{"label": "1번", "answer": "①", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">1. 다음 글에 드러난 Paul Farmer의 심경 변화로 가장 적절한 것은?</div><div class=\"given\"><p>Paul Farmer had long been aware of social inequality, but his experience in Haiti made the issue more real to him. After graduating from Duke University, he began volunteer work at a hospital in Cangé, Haiti. There, he saw many poor people suffering because they could not receive proper medical treatment. Farmer was deeply troubled by what he saw and wondered whether he could make a difference. Still, he refused to give up and devoted himself to improving health care for the poor. In 1987, he cofounded Partners In Health, which provided medical treatment in countries such as Haiti, Rwanda, and Peru. Over the years, his efforts helped improve many people’s lives. Seeing these positive changes, Farmer felt encouraged and hopeful. This inspired him to continue working for better health care throughout his life.</p></div><div class=\"text-options\"><div>① troubled → hopeful</div><div>② confident → disappointed</div><div>③ indifferent → curious</div><div>④ grateful → frightened</div><div>⑤ embarrassed → relieved</div></div></div>", "layout": "standard", "members": ["1"], "sourceText": "\nPaul Farmer had long been aware of social inequality, but his experience in Haiti made the issue more real to him. After graduating from Duke University, he began volunteer work at a hospital in Cangé, Haiti. There, he saw many poor people suffering because they could not receive proper medical treatment. Farmer was deeply troubled by what he saw and wondered whether he could make a difference. Still, he refused to give up and devoted himself to improving health care for the poor. In 1987, he cofounded Partners In Health, which provided medical treatment in countries such as Haiti, Rwanda, and Peru. Over the years, his efforts helped improve many people’s lives. Seeing these positive changes, Farmer felt encouraged and hopeful. This inspired him to continue working for better health care throughout his life.\n① troubled → hopeful　　② confident → disappointed\n③ indifferent → curious　　④ grateful → frightened\n⑤ embarrassed → relieved"}, "2": {"label": "2번", "type": "글의 요지", "score": "3.1점", "correctAnswer": "④", "answerItems": [{"label": "2번", "answer": "④", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">2. 다음 글의 요지로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Why do we have the illusion that cramming for an exam is the best learning strategy? Because we are unable to differentiate between the various sections of our memory. Immediately after reading our textbook or our class notes, information is fully present in our mind. It sits in our conscious working memory, in an active form. We feel as if we know it, because it is present in our short-term storage space ... but this short-term section has nothing to do with the long-term memory that we will need in order to recall the same information a few days later. After a few seconds or minutes, working memory already starts disappearing, and after a few days, the effect becomes enormous: unless you retest your knowledge, memory vanishes. To get information into long-term memory, it is essential to study the material, then test yourself, rather than spend all your time studying.</p></div><div class=\"text-options\"><div>① 시험 직전에 벼락치기를 적극 활용해야 한다.</div><div>② 기억력을 높이려면 충분한 수면을 취해야 한다.</div><div>③ 교과서보다 수업 필기를 중심으로 학습해야 한다.</div><div>④ 오래 기억하려면 학습한 내용을 스스로 시험해 보아야 한다.</div><div>⑤ 효과적으로 암기하려면 배운 내용을 점검하기보다 계속 읽어야 한다.</div></div></div>", "layout": "standard", "members": ["2"], "sourceText": "\nWhy do we have the illusion that cramming for an exam is the best learning strategy? Because we are unable to differentiate between the various sections of our memory. Immediately after reading our textbook or our class notes, information is fully present in our mind. It sits in our conscious working memory, in an active form. We feel as if we know it, because it is present in our short-term storage space ... but this short-term section has nothing to do with the long-term memory that we will need in order to recall the same information a few days later. After a few seconds or minutes, working memory already starts disappearing, and after a few days, the effect becomes enormous: unless you retest your knowledge, memory vanishes. To get information into long-term memory, it is essential to study the material, then test yourself, rather than spend all your time studying.\n① 시험 직전에 벼락치기를 적극 활용해야 한다.\n② 기억력을 높이려면 충분한 수면을 취해야 한다.\n③ 교과서보다 수업 필기를 중심으로 학습해야 한다.\n④ 오래 기억하려면 학습한 내용을 스스로 시험해 보아야 한다.\n⑤ 효과적으로 암기하려면 배운 내용을 점검하기보다 계속 읽어야 한다."}, "3": {"label": "3번", "type": "글의 요지", "score": "3.1점", "correctAnswer": "③", "answerItems": [{"label": "3번", "answer": "③", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">3. 다음 글의 요지로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Writing is visual - it catches the eye before it has a chance to catch the brain. Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type can discourage a reader from even starting to read. Newspaper paragraphs should be only two or three sentences long; newspaper type is set in a narrow width, and the inches quickly add up. You may think such frequent paragraphing will damage the development of your point. Obviously The New Yorker is obsessed by this fear - a reader can go for miles without relief. Don’t worry; the gains far outweigh the hazards. But don’t go too far. A succession of tiny paragraphs is as annoying as a paragraph that’s too long. I’m thinking of all those tiny paragraphs - verbless wonders - written by modern journalists trying to make their articles quick ’n’ easy. Actually they make the reader’s job difficult by chopping up a natural train of thought.</p></div><div class=\"text-options\"><div>① 독자의 시선을 끌기 위해 글의 내용을 가능한 한 많은 짧은 문단으로 나누어야 한다.</div><div>② 신문 글은 제한된 지면 때문에 일반적인 글보다 더 많은 내용을 한 문단에 담아야 한다.</div><div>③ 가독성을 높이기 위해 문단은 짧게 구성하되 글의 흐름이 끊길 정도로 나누어서는 안 된다.</div><div>④ 효과적인 글쓰기를 위해서는 문단의 길이보다 각 문장의 표현 방식과 어휘 선택이 더 중요하다.</div><div>⑤ 논리의 흐름을 유지하기 위해 문단 나누기를 최소화하고 하나의 생각을 깊이 있게 전개해야 한다.</div></div></div>", "layout": "standard", "members": ["3"], "sourceText": "\nWriting is visual - it catches the eye before it has a chance to catch the brain. Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type can discourage a reader from even starting to read. Newspaper paragraphs should be only two or three sentences long; newspaper type is set in a narrow width, and the inches quickly add up. You may think such frequent paragraphing will damage the development of your point. Obviously The New Yorker is obsessed by this fear - a reader can go for miles without relief. Don’t worry; the gains far outweigh the hazards. But don’t go too far. A succession of tiny paragraphs is as annoying as a paragraph that’s too long. I’m thinking of all those tiny paragraphs - verbless wonders - written by modern journalists trying to make their articles quick ’n’ easy. Actually they make the reader’s job difficult by chopping up a natural train of thought.\n① 독자의 시선을 끌기 위해 글의 내용을 가능한 한 많은 짧은 문단으로 나누어야 한다.\n② 신문 글은 제한된 지면 때문에 일반적인 글보다 더 많은 내용을 한 문단에 담아야 한다.\n③ 가독성을 높이기 위해 문단은 짧게 구성하되 글의 흐름이 끊길 정도로 나누어서는 안 된다.\n④ 효과적인 글쓰기를 위해서는 문단의 길이보다 각 문장의 표현 방식과 어휘 선택이 더 중요하다.\n⑤ 논리의 흐름을 유지하기 위해 문단 나누기를 최소화하고 하나의 생각을 깊이 있게 전개해야 한다."}, "4": {"label": "4번", "type": "글의 제목", "score": "3.5점", "correctAnswer": "②", "answerItems": [{"label": "4번", "answer": "②", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">4. 다음 글의 제목으로 가장 적절한 것은?</div><div class=\"given\"><p>Even before telescopes existed, people looked out into space and tried to understand the universe. The Egyptians, Babylonians, Greeks, and Maya were among the first peoples to map the movements of the stars. In Europe, a 16th-century Polish mathematician named Nicolaus Copernicus put forth a revolutionary idea. Copernicus watched the stars and took measurements by eye. He concluded that the view of the universe accepted at the time - that the Sun traveled around Earth - was wrong, and that it was in fact Earth that traveled around the Sun. Despite widespread objections to his ideas, he published his theory in a book. Later astronomers built on Copernicus’ work. Technological improvements led to the development of the telescope in the early 17th century. Using a telescope, the Italian scientist Galileo Galilei discovered the four largest moons of Jupiter and observed craters on Earth’s Moon. He also confirmed that Copernicus’ theory was correct. Over the centuries, scientific discoveries and information from telescopes advanced our knowledge of how the universe works.</p></div><div class=\"text-options\"><div>① The Ancient Origins of Astronomy and the Mapping of the Stars</div><div>② How Telescopes Expanded Our Understanding of the Universe</div><div>③ From the Earth to the Sun: The Changing View of Our Solar System</div><div>④ Technological Advances That Made Space Exploration Possible</div><div>⑤ Copernicus and Galileo: The Scientists Who Changed Astronomy</div></div></div>", "layout": "standard", "members": ["4"], "sourceText": "\nEven before telescopes existed, people looked out into space and tried to understand the universe. The Egyptians, Babylonians, Greeks, and Maya were among the first peoples to map the movements of the stars. In Europe, a 16th-century Polish mathematician named Nicolaus Copernicus put forth a revolutionary idea. Copernicus watched the stars and took measurements by eye. He concluded that the view of the universe accepted at the time - that the Sun traveled around Earth - was wrong, and that it was in fact Earth that traveled around the Sun. Despite widespread objections to his ideas, he published his theory in a book. Later astronomers built on Copernicus’ work. Technological improvements led to the development of the telescope in the early 17th century. Using a telescope, the Italian scientist Galileo Galilei discovered the four largest moons of Jupiter and observed craters on Earth’s Moon. He also confirmed that Copernicus’ theory was correct. Over the centuries, scientific discoveries and information from telescopes advanced our knowledge of how the universe works.\n① The Ancient Origins of Astronomy and the Mapping of the Stars\n② How Telescopes Expanded Our Understanding of the Universe\n③ From the Earth to the Sun: The Changing View of Our Solar System\n④ Technological Advances That Made Space Exploration Possible\n⑤ Copernicus and Galileo: The Scientists Who Changed Astronomy"}, "5": {"label": "5번", "type": "글의 주제", "score": "3.5점", "correctAnswer": "③", "answerItems": [{"label": "5번", "answer": "③", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">5. 다음 글의 주제로 가장 적절한 것은?</div><div class=\"given\"><p>Our number one criterion for how we care for our pets should be, “Is this what they actually need? How is it impacting them?” rather than, “What do I want?” For example, we have encountered many dog owners who bathe their dogs religiously multiple times a week because they want to avoid the doggy smell, but veterinary dermatologists warn against such practices, as they are not good for a dog’s skin. If someone is really concerned about their dog’s smell they can use waterless shampoo and thoroughly brush their dog every day but keep the baths down to once or twice a week at most. Unless they have a skin condition for which a vet has prescribed medicated baths, most dogs don’t need to be bathed on a regular basis. Even dogs with thick, heavy coats generally only need baths every 6 to 8 weeks.</p></div><div class=\"text-options\"><div>① ways of maintaining dogs’ skin through frequent bathing</div><div>② proper bathing schedules for dogs with thick, heavy coats</div><div>③ prioritizing dogs’ needs over owners’ preferences in pet care</div><div>④ considering owners’ concerns when caring for their pets</div><div>⑤ benefits of waterless shampoo for dogs with unpleasant smells</div></div></div>", "layout": "standard", "members": ["5"], "sourceText": "\nOur number one criterion for how we care for our pets should be, “Is this what they actually need? How is it impacting them?” rather than, “What do I want?” For example, we have encountered many dog owners who bathe their dogs religiously multiple times a week because they want to avoid the doggy smell, but veterinary dermatologists warn against such practices, as they are not good for a dog’s skin. If someone is really concerned about their dog’s smell they can use waterless shampoo and thoroughly brush their dog every day but keep the baths down to once or twice a week at most. Unless they have a skin condition for which a vet has prescribed medicated baths, most dogs don’t need to be bathed on a regular basis. Even dogs with thick, heavy coats generally only need baths every 6 to 8 weeks.\n① ways of maintaining dogs’ skin through frequent bathing\n② proper bathing schedules for dogs with thick, heavy coats\n③ prioritizing dogs’ needs over owners’ preferences in pet care\n④ considering owners’ concerns when caring for their pets\n⑤ benefits of waterless shampoo for dogs with unpleasant smells"}, "6": {"label": "6번", "type": "안내문 내용 불일치", "score": "3.1점", "correctAnswer": "⑤", "answerItems": [{"label": "6번", "answer": "⑤", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">6. Saintville Art Week Stamp Tour에 관한 다음 안내문의 내용과 일치하지 않는 것은?</div><div class=\"given\"><p><b>Saintville Art Week Stamp Tour</b></p><p>The 8th annual Saintville Art Week Stamp Tour is back this year! Anyone can participate in our event. Join us and enjoy exhibitions and new collections.</p><p>□ <b>When:</b> The first week of October, 2026</p><p>□ <b>Where:</b> Saintville Arts District</p><p>□ <b>How:</b></p><p>Step 1. Take a stamp tour map from the Saintville Arts Center.</p><p>Step 2. Get stamps from at least 3 out of 5 spots and receive your gift.</p><p>- You can choose either an umbrella or a mug with printed artwork on it for your gift.</p><p>※ For more information, please visit our website at www.SaintvilleArtsCenter.com.</p></div><div class=\"text-options\"><div>① 누구나 참가할 수 있다.</div><div>② 10월 첫째 주에 진행된다.</div><div>③ Saintville Arts Center에서 스탬프 투어 지도를 받는다.</div><div>④ 적어도 세 곳에서 도장을 받아야 선물을 받는다.</div><div>⑤ 선물로 우산과 머그잔을 모두 받을 수 있다.</div></div></div>", "layout": "standard", "members": ["6"], "sourceText": "\nSaintville Art Week Stamp Tour\nThe 8th annual Saintville Art Week Stamp Tour is back this year! Anyone can participate in our event. Join us and enjoy exhibitions and new collections.\n□ When: The first week of October, 2026\n□ Where: Saintville Arts District\n□ How:\nStep 1. Take a stamp tour map from the Saintville Arts Center.\nStep 2. Get stamps from at least 3 out of 5 spots and receive your gift.\n- You can choose either an umbrella or a mug with printed artwork on it for your gift.\n※ For more information, please visit our website at www.SaintvilleArtsCenter.com.\n① 누구나 참가할 수 있다.\n② 10월 첫째 주에 진행된다.\n③ Saintville Arts Center에서 스탬프 투어 지도를 받는다.\n④ 적어도 세 곳에서 도장을 받아야 선물을 받는다.\n⑤ 선물로 우산과 머그잔을 모두 받을 수 있다."}, "7-E1": {"label": "7번 + 논술형 1번", "type": "내용 불일치 · 논술형", "score": "7번 3.1점 / 논술형 1번 6점", "correctAnswer": "7번 ③ / 논술형 1번 ③ was / ⑤ bored / ⑥ active", "answerItems": [{"label": "7번", "answer": "③", "note": ""}, {"label": "논술형 1번", "answer": "③ was / ⑤ bored / ⑥ active", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"shared-passage\"><div class=\"given\"><p>On July 29, our club arrived at the Free Animals sanctuary. Jane, the staff member in charge of animal care, welcomed us with a big smile and gave us a tour of the facility. It was amazing ① <u>to see</u> bears and elephants moving freely in a large field. Our tasks for the day included cleaning the shelter and preparing food for the animals. While cleaning the habitats, we checked if there were any hazards that could harm the animals. Then, we helped prepare the food by cutting up fruits and vegetables and ② <u>dividing</u> them into several large baskets. For old elephants with weak teeth, we chopped bananas instead of the sugarcane that they usually eat. Spending the whole day helping out with the animals ③ <u>were</u> an incredible experience for me. It was a rewarding experience, and I was impressed with the attention the staff members gave to all the animals.</p><p>The next day we did something special for Ben and Lily. These two baby bears were rescued after they had been raised illegally in a tiny cage on a farm for many years. To help the bears ④ <u>restore</u> their natural instincts, we carried out some special activities known as “behavioral enrichment.” For example, we made honey-log feeders for the bears. First, we made several holes in a log and filled them with honey. Then, we hung the honey-log feeders on trees near the bears’ habitat. As bears are intelligent and curious creatures, they can become ⑤ <u>boring</u> when lacking mental and physical stimulation. The honey-log feeders stimulate their natural curiosity and keep them as ⑥ <u>actively</u> as they would be in the wild. After a while, Ben and Lily approached the feeders and started eating the honey inside.</p></div></div><div class=\"group-questions\"><div class=\"question-section\"><div class=\"text-question-title\">7. 윗글의 내용과 일치하지 않는 것은?</div><div class=\"text-options\"><div>① Jane은 우리에게 Sanctuary의 시설을 안내해 주었다.</div><div>② 우리는 청소를 하면서 동물들에게 해를 입힐 만한 위험 요소가 있는지 확인했다.</div><div>③ 나이가 많고 이가 약한 코끼리에게도 평소와 같은 사탕수수를 제공했다.</div><div>④ 곰들의 본능 회복을 돕기 위해 행동 풍부화 활동을 시행했다.</div><div>⑤ 꿀이 든 통나무 먹이통은 곰의 호기심을 자극하여 야생에서 만큼의 활발함을 유지하도록 도와준다.</div></div></div><div class=\"question-section\"><div class=\"text-question-title\">[논술형 1] 밑줄 친 부분 중, 어법상 틀린 것을 3개 찾아 번호를 쓰고 바르게 고치시오.</div><table class=\"source-table\"><tr><th>번호</th><th>수정본</th></tr><tr><td><span class=\"number-entry-line\" aria-label=\"번호 작성란\"></span></td><td>____________________________</td></tr><tr><td><span class=\"number-entry-line\" aria-label=\"번호 작성란\"></span></td><td>____________________________</td></tr><tr><td><span class=\"number-entry-line\" aria-label=\"번호 작성란\"></span></td><td>____________________________</td></tr></table></div></div>", "layout": "long", "members": ["7", "E1"], "sourceText": "On July 29, our club arrived at the Free Animals sanctuary. Jane, the staff member in charge of animal care, welcomed us with a big smile and gave us a tour of the facility. It was amazing ① to see bears and elephants moving freely in a large field. Our tasks for the day included cleaning the shelter and preparing food for the animals. While cleaning the habitats, we checked if there were any hazards that could harm the animals. Then, we helped prepare the food by cutting up fruits and vegetables and ② dividing them into several large baskets. For old elephants with weak teeth, we chopped bananas instead of the sugarcane that they usually eat. Spending the whole day helping out with the animals ③ were an incredible experience for me. It was a rewarding experience, and I was impressed with the attention the staff members gave to all the animals.\nThe next day we did something special for Ben and Lily. These two baby bears were rescued after they had been raised illegally in a tiny cage on a farm for many years. To help the bears ④ restore their natural instincts, we carried out some special activities known as “behavioral enrichment.” For example, we made honey-log feeders for the bears. First, we made several holes in a log and filled them with honey. Then, we hung the honey-log feeders on trees near the bears’ habitat. As bears are intelligent and curious creatures, they can become ⑤ boring when lacking mental and physical stimulation. The honey-log feeders stimulate their natural curiosity and keep them as ⑥ actively as they would be in the wild. After a while, Ben and Lily approached the feeders and started eating the honey inside.\n① Jane은 우리에게 Sanctuary의 시설을 안내해 주었다.\n② 우리는 청소를 하면서 동물들에게 해를 입힐 만한 위험 요소가 있는지 확인했다.\n③ 나이가 많고 이가 약한 코끼리에게도 평소와 같은 사탕수수를 제공했다.\n④ 곰들의 본능 회복을 돕기 위해 행동 풍부화 활동을 시행했다.\n⑤ 꿀이 든 통나무 먹이통은 곰의 호기심을 자극하여 야생에서 만큼의 활발함을 유지하도록 도와준다.\n번호 | 수정본\n________ | ____________________________ [2점]\n________ | ____________________________ [2점]\n________ | ____________________________ [2점]"}, "8": {"label": "8번", "type": "함축 의미", "score": "3.5점", "correctAnswer": "②", "answerItems": [{"label": "8번", "answer": "②", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">8. 밑줄 친 “a certain common parent trap”이 다음 글에서 의미하는 바로 가장 적절한 것은?</div><div class=\"given\"><p>As the parent of a gifted child, you need to be aware of “<u>a certain common parent trap</u>.” Of course you are a proud parent, and you should be. While it is very easy to talk nonstop about your little genius and his or her remarkable behavior, this can be very stressful on your child. It is extremely important to limit your bragging behavior to your very close friends, or your parents. Gifted children feel pressured when their parents show them off too much. This behavior creates expectations that they may not be able to live up to, and also creates a false sense of self for your child. You want your child to be who they are, not who they seem to be as defined by their incredible achievements. If not, you could end up with a driven perfectionist child or perhaps a drop-out, or worse.</p></div><div class=\"text-options\"><div>① comparing their children’s talents with others</div><div>② drawing too much attention to their children’s talents</div><div>③ placing excessive academic demands on their children</div><div>④ offering emotional support when their children face difficulties</div><div>⑤ limiting conversations about their children’s achievements</div></div></div>", "layout": "standard", "members": ["8"], "sourceText": "\nAs the parent of a gifted child, you need to be aware of “a certain common parent trap.” Of course you are a proud parent, and you should be. While it is very easy to talk nonstop about your little genius and his or her remarkable behavior, this can be very stressful on your child. It is extremely important to limit your bragging behavior to your very close friends, or your parents. Gifted children feel pressured when their parents show them off too much. This behavior creates expectations that they may not be able to live up to, and also creates a false sense of self for your child. You want your child to be who they are, not who they seem to be as defined by their incredible achievements. If not, you could end up with a driven perfectionist child or perhaps a drop-out, or worse.\n① comparing their children’s talents with others\n② drawing too much attention to their children’s talents\n③ placing excessive academic demands on their children\n④ offering emotional support when their children face difficulties\n⑤ limiting conversations about their children’s achievements"}, "9": {"label": "9번", "type": "어법", "score": "3.5점", "correctAnswer": "③", "answerItems": [{"label": "9번", "answer": "③", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">9. 다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?</div><div class=\"given\"><p>The discovery of mirror neurons ① <u>has</u> profoundly changed the way we think of a fundamental human capacity, learning by observation. As children we learn a lot by observing ② <u>what</u> our parents and friends do. Newborns, in the first week of life, have an inborn tendency to stick out their tongue if their parents stick out ③ <u>themselves</u>. Such imitation is not perfect. You may not see the tongue stick out each time you stick yours out at your newborn, but if you do it many times, the tongue will come out more often than if you do something different. Babies babble and ④ <u>start</u> to imitate the sounds their parents produce. Later still, they play with vacuum cleaners and hammers in imitation of their parents. Our modern cultures, ⑤ <u>in which</u> we write, speak, read, build spaceships and go to school, can work only because we are not restricted to the behavior we are born with or learn by trial and error. We can learn a lot by simply watching others.</p></div><div class=\"text-options grammar-options\"><div>① has</div><div>② what</div><div>③ themselves</div><div>④ start</div><div>⑤ in which</div></div></div>", "layout": "standard", "members": ["9"], "sourceText": "\nThe discovery of mirror neurons ① has profoundly changed the way we think of a fundamental human capacity, learning by observation. As children we learn a lot by observing ② what our parents and friends do. Newborns, in the first week of life, have an inborn tendency to stick out their tongue if their parents stick out ③ themselves. Such imitation is not perfect. You may not see the tongue stick out each time you stick yours out at your newborn, but if you do it many times, the tongue will come out more often than if you do something different. Babies babble and ④ start to imitate the sounds their parents produce. Later still, they play with vacuum cleaners and hammers in imitation of their parents. Our modern cultures, ⑤ in which we write, speak, read, build spaceships and go to school, can work only because we are not restricted to the behavior we are born with or learn by trial and error. We can learn a lot by simply watching others."}, "10": {"label": "10번", "type": "문맥상 어휘", "score": "4.0점", "correctAnswer": "⑤", "answerItems": [{"label": "10번", "answer": "⑤", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">10. 다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것을 고르시오.</div><div class=\"given\"><p>You hear again and again that some of the greatest composers were overlooked in their own day. Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day. The reason for this initial ① <u>lack</u> of acceptance is unfamiliarity. The musical forms, or ideas expressed within them, were completely ② <u>innovative</u>. And yet, this is exactly one of the things that makes them so ③ <u>great</u>. Effective composers have their own ideas. Have you ever seen the classic movie Amadeus? The composer Antonio Salieri is the “host” of this movie; he’s depicted as one of the most famous non-great composers - he lived at the time of Mozart and was completely ④ <u>outshone</u> by him. Now, Salieri wasn’t a bad composer; in fact, he was a very good one. But he wasn’t one of the world’s great composers because his work was ⑤ <u>distinctive</u>. What he wrote sounded just like what everyone else was composing at the time.</p></div></div>", "layout": "standard", "members": ["10"], "sourceText": "\nYou hear again and again that some of the greatest composers were overlooked in their own day. Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day. The reason for this initial ① lack of acceptance is unfamiliarity. The musical forms, or ideas expressed within them, were completely ② innovative. And yet, this is exactly one of the things that makes them so ③ great. Effective composers have their own ideas. Have you ever seen the classic movie Amadeus? The composer Antonio Salieri is the “host” of this movie; he’s depicted as one of the most famous non-great composers - he lived at the time of Mozart and was completely ④ outshone by him. Now, Salieri wasn’t a bad composer; in fact, he was a very good one. But he wasn’t one of the world’s great composers because his work was ⑤ distinctive. What he wrote sounded just like what everyone else was composing at the time."}, "11": {"label": "11번", "type": "문맥상 어휘", "score": "4.0점", "correctAnswer": "④", "answerItems": [{"label": "11번", "answer": "④", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">11. 다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것을 고르시오.</div><div class=\"given\"><p>To understand how breathing affects athletic performance, we first need to understand how the body makes energy from air and food. There are two options: with oxygen, a process known as aerobic respiration, and without it, which is called anaerobic respiration. Anaerobic energy is generated only with glucose (a simple sugar), and it’s quicker and ① <u>easier</u> for our bodies to access. It’s a kind of backup system and turbo boost when the body ② <u>lacks</u> oxygen. But anaerobic energy is ③ <u>inefficient</u> and toxic, creating too much lactic acid. The sickness, muscle weakness, and sweating you experience after you’ve pushed it too hard at the gym is the feeling of anaerobic overload. This process explains why the first few minutes of an intense workout are often ④ <u>manageable</u>. Our lungs and respiratory system haven’t caught up to supply the oxygen our bodies need, and so the body has to use anaerobic respiration. This also explains why, after we’re warmed up, exercise feels less ⑤ <u>strenuous</u>. The body has switched from anaerobic to aerobic respiration.</p></div></div>", "layout": "standard", "members": ["11"], "sourceText": "\nTo understand how breathing affects athletic performance, we first need to understand how the body makes energy from air and food. There are two options: with oxygen, a process known as aerobic respiration, and without it, which is called anaerobic respiration. Anaerobic energy is generated only with glucose (a simple sugar), and it’s quicker and ① easier for our bodies to access. It’s a kind of backup system and turbo boost when the body ② lacks oxygen. But anaerobic energy is ③ inefficient and toxic, creating too much lactic acid. The sickness, muscle weakness, and sweating you experience after you’ve pushed it too hard at the gym is the feeling of anaerobic overload. This process explains why the first few minutes of an intense workout are often ④ manageable. Our lungs and respiratory system haven’t caught up to supply the oxygen our bodies need, and so the body has to use anaerobic respiration. This also explains why, after we’re warmed up, exercise feels less ⑤ strenuous. The body has switched from anaerobic to aerobic respiration."}, "12": {"label": "12번", "type": "빈칸 추론", "score": "4.0점", "correctAnswer": "①", "answerItems": [{"label": "12번", "answer": "①", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">12. 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>With millions of members in a colony, leaf-cutter ants cultivate their own food. Just like humans, they’re farmers. Some of the ants set forth from the nest to find fresh vegetation; when they find it, they chew off large pieces that they carry back to the nest. However, the ants don’t eat these leaves. Instead, smaller worker ants take the pieces of leaves, chew them into smaller pieces, and use these as fertilizer to grow fungus in large underground “gardens.” The ants feed the fungus, and the fungus blossoms into small fruiting bodies which the ants later eat. Using this successful farming strategy, the ants build enormous nests underground, sometimes spanning hundreds of square meters. Just like humans, they have developed ____________________.</p></div><div class=\"text-options\"><div>① a highly organized farming society</div><div>② a system for storing fresh vegetation</div><div>③ a way of sharing food among workers</div><div>④ a complex system of social communication</div><div>⑤ a method of protecting their underground nests</div></div></div>", "layout": "standard", "members": ["12"], "sourceText": "\nWith millions of members in a colony, leaf-cutter ants cultivate their own food. Just like humans, they’re farmers. Some of the ants set forth from the nest to find fresh vegetation; when they find it, they chew off large pieces that they carry back to the nest. However, the ants don’t eat these leaves. Instead, smaller worker ants take the pieces of leaves, chew them into smaller pieces, and use these as fertilizer to grow fungus in large underground “gardens.” The ants feed the fungus, and the fungus blossoms into small fruiting bodies which the ants later eat. Using this successful farming strategy, the ants build enormous nests underground, sometimes spanning hundreds of square meters. Just like humans, they have developed ____________________.\n① a highly organized farming society\n② a system for storing fresh vegetation\n③ a way of sharing food among workers\n④ a complex system of social communication\n⑤ a method of protecting their underground nests"}, "13": {"label": "13번", "type": "빈칸 추론", "score": "4.4점", "correctAnswer": "②", "answerItems": [{"label": "13번", "answer": "②", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">13. 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>By improving accessibility of the workplace for workers that are typically at a disadvantage in the labour market, AI can ____________________. AI-powered assistive devices to aid workers with visual, speech or hearing difficulties are becoming more widespread, improving the access to, and the quality of work for, people with disabilities. For example, speech recognition solutions for people with dysarthric voices, or live captioning systems for deaf and hard of hearing people can facilitate communication with colleagues and access to jobs where inter-personal communication is necessary. AI can also enhance the capabilities of low-skilled workers, with potentially positive effects on their wages and career prospects. For example, AI’s capacity to translate written and spoken word in real-time can improve the performance of non-native speakers in the workplace. Moreover, recent developments in AI-powered text generators can instantly improve the performance of lower-skilled individuals in domains such as writing, coding or customer service.</p></div><div class=\"text-options\"><div>① encourage workers to seek jobs better suited to their abilities</div><div>② reduce barriers to workplace participation for people with different needs</div><div>③ replace low-skilled manual workers with more efficient automated systems</div><div>④ increase employees’ competence to improve organizational performance</div><div>⑤ promote inclusiveness by applying the same standards to all employees</div></div></div>", "layout": "standard", "members": ["13"], "sourceText": "\nBy improving accessibility of the workplace for workers that are typically at a disadvantage in the labour market, AI can ____________________. AI-powered assistive devices to aid workers with visual, speech or hearing difficulties are becoming more widespread, improving the access to, and the quality of work for, people with disabilities. For example, speech recognition solutions for people with dysarthric voices, or live captioning systems for deaf and hard of hearing people can facilitate communication with colleagues and access to jobs where inter-personal communication is necessary. AI can also enhance the capabilities of low-skilled workers, with potentially positive effects on their wages and career prospects. For example, AI’s capacity to translate written and spoken word in real-time can improve the performance of non-native speakers in the workplace. Moreover, recent developments in AI-powered text generators can instantly improve the performance of lower-skilled individuals in domains such as writing, coding or customer service.\n① encourage workers to seek jobs better suited to their abilities\n② reduce barriers to workplace participation for people with different needs\n③ replace low-skilled manual workers with more efficient automated systems\n④ increase employees’ competence to improve organizational performance\n⑤ promote inclusiveness by applying the same standards to all employees"}, "14": {"label": "14번", "type": "빈칸 추론", "score": "4.7점", "correctAnswer": "①", "answerItems": [{"label": "14번", "answer": "①", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">14. 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>The laws and constants of physics and the fundamental forces in our universe have very precise forms and values. This means that if they were only very slightly different, life would not have been possible. For instance, the precise value of gravity has enabled our universe to arise by permitting the aggregation of dust and gas particles to proto-stars around which planets later came to orbit, including the Earth around the Sun. If the value of the electron had been ever so slightly larger or smaller, chemistry, as we know it, would not have been possible and life, which is based on organic chemistry, could not have started. The universe was not designed for us to evolve, and we have no privileged position in the universe; however, ____________________.</p></div><div class=\"text-options\"><div>① their precise values made the emergence of advanced life possible</div><div>② physical laws favorable to life grant humanity a privileged cosmic status</div><div>③ precise physical laws made advanced life inevitable rather than merely possible</div><div>④ physical laws were ultimately arranged to bring human beings into existence</div><div>⑤ life emerged through adaptation regardless of the precise values of physical constants</div></div></div>", "layout": "standard", "members": ["14"], "sourceText": "\nThe laws and constants of physics and the fundamental forces in our universe have very precise forms and values. This means that if they were only very slightly different, life would not have been possible. For instance, the precise value of gravity has enabled our universe to arise by permitting the aggregation of dust and gas particles to proto-stars around which planets later came to orbit, including the Earth around the Sun. If the value of the electron had been ever so slightly larger or smaller, chemistry, as we know it, would not have been possible and life, which is based on organic chemistry, could not have started. The universe was not designed for us to evolve, and we have no privileged position in the universe; however, ____________________.\n① their precise values made the emergence of advanced life possible\n② physical laws favorable to life grant humanity a privileged cosmic status\n③ precise physical laws made advanced life inevitable rather than merely possible\n④ physical laws were ultimately arranged to bring human beings into existence\n⑤ life emerged through adaptation regardless of the precise values of physical constants"}, "15": {"label": "15번", "type": "빈칸 추론", "score": "4.7점", "correctAnswer": "④", "answerItems": [{"label": "15번", "answer": "④", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">15. 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>The word “migration” is almost always reported in the popular media and even in scientific literature as a problem or a crisis. For example, migrants are assumed to overcrowd cities, clog up labor markets, and increase poverty. The other questionable assumption is that most migration is involuntary - people fleeing natural or man-made disasters. The reality, however, is more complex, and many migrants are simply seeking greater economic opportunity. Of course migration can and does create social and economic problems. But migration can also ____________________. For example, out-migration generally redistributes workers from places of labor surplus to areas where there is greater demand or more opportunity. Migration is generally selective of persons who are younger, healthier, more flexible, and more willing to endure hardship in hopes of a better life relative to their prospects in their places of origin. Most research that examines long-term outcomes of migration, including remittances and intergenerational mobility, finds positive “long-term” effects on places of origin and destination.</p></div><div class=\"text-notes\">* clog: 막히게 하다 ** remittance: 송금</div><div class=\"text-options\"><div>① reduce economic opportunities in areas with labor shortages</div><div>② intensify the problems already experienced by local communities</div><div>③ replace voluntary migration with movement caused by disasters</div><div>④ serve as a way of addressing existing social and economic difficulties</div><div>⑤ discourage younger and healthier workers from seeking better opportunities</div></div></div>", "layout": "standard", "members": ["15"], "sourceText": "\nThe word “migration” is almost always reported in the popular media and even in scientific literature as a problem or a crisis. For example, migrants are assumed to overcrowd cities, clog up labor markets, and increase poverty. The other questionable assumption is that most migration is involuntary - people fleeing natural or man-made disasters. The reality, however, is more complex, and many migrants are simply seeking greater economic opportunity. Of course migration can and does create social and economic problems. But migration can also ____________________. For example, out-migration generally redistributes workers from places of labor surplus to areas where there is greater demand or more opportunity. Migration is generally selective of persons who are younger, healthier, more flexible, and more willing to endure hardship in hopes of a better life relative to their prospects in their places of origin. Most research that examines long-term outcomes of migration, including remittances and intergenerational mobility, finds positive “long-term” effects on places of origin and destination.\n* clog: 막히게 하다 ** remittance: 송금\n① reduce economic opportunities in areas with labor shortages\n② intensify the problems already experienced by local communities\n③ replace voluntary migration with movement caused by disasters\n④ serve as a way of addressing existing social and economic difficulties\n⑤ discourage younger and healthier workers from seeking better opportunities"}, "16": {"label": "16번", "type": "글의 순서", "score": "4.4점", "correctAnswer": "④", "answerItems": [{"label": "16번", "answer": "④", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">16. 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Perhaps you have heard of the Law of Attraction, which states that ‘like attracts like’ and that by focusing on positive or negative thoughts, one can bring about positive or negative results.</p></div><p>(A) But the most powerful attractor is our belief system. You can create poster boards full of images of what you want and affirm every day that you are available for an abundant successful, passionate career or a loving relationship.</p><p>(B) However, if you don’t truly believe you are enough, worthy, lovable, and deserving, then attracting a great career or relationship into your life may be more challenging.</p><p>(C) A common flaw in our understanding of this law is believing that simply thinking about or visualizing something will manifest it. Our thoughts and words are magnetic, and we attract at the level of our own vibration.</p><div class=\"text-options\"><div>① (A) - (C) - (B)</div><div>② (B) - (A) - (C)</div><div>③ (B) - (C) - (A)</div><div>④ (C) - (A) - (B)</div><div>⑤ (C) - (B) - (A)</div></div></div>", "layout": "standard", "members": ["16"], "sourceText": "\nPerhaps you have heard of the Law of Attraction, which states that ‘like attracts like’ and that by focusing on positive or negative thoughts, one can bring about positive or negative results.\n(A) But the most powerful attractor is our belief system. You can create poster boards full of images of what you want and affirm every day that you are available for an abundant successful, passionate career or a loving relationship.\n(B) However, if you don’t truly believe you are enough, worthy, lovable, and deserving, then attracting a great career or relationship into your life may be more challenging.\n(C) A common flaw in our understanding of this law is believing that simply thinking about or visualizing something will manifest it. Our thoughts and words are magnetic, and we attract at the level of our own vibration.\n① (A) - (C) - (B)　　② (B) - (A) - (C)　　③ (B) - (C) - (A)\n④ (C) - (A) - (B)　　⑤ (C) - (B) - (A)"}, "17": {"label": "17번", "type": "글의 순서", "score": "4.4점", "correctAnswer": "⑤", "answerItems": [{"label": "17번", "answer": "⑤", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">17. 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Every time a new medium comes along - whether it’s the invention of the printed book, or TV, or SNS - and you start to use it, it’s like you are putting on a new kind of goggles, with their own special colors and lenses.</p></div><p>(A) It is gently guiding us to see the world according to a new set of codes. The way information gets to you, McLuhan argued, is more important than the information itself. TV teaches you that the world is fast; that it’s about surfaces and appearances.</p><p>(B) That’s why Marshall McLuhan said that every time a new medium comes along - a new way for humans to communicate - it has buried in it a message.</p><p>(C) Each set of goggles you put on makes you see things differently. So when you start to watch television, before you absorb the message of any particular TV show - whether it’s Wheel of Fortune or The Wire - you start to see the world as being shaped by television itself.</p><div class=\"text-options\"><div>① (A) - (C) - (B)</div><div>② (B) - (A) - (C)</div><div>③ (B) - (C) - (A)</div><div>④ (C) - (A) - (B)</div><div>⑤ (C) - (B) - (A)</div></div></div>", "layout": "standard", "members": ["17"], "sourceText": "\nEvery time a new medium comes along - whether it’s the invention of the printed book, or TV, or SNS - and you start to use it, it’s like you are putting on a new kind of goggles, with their own special colors and lenses.\n(A) It is gently guiding us to see the world according to a new set of codes. The way information gets to you, McLuhan argued, is more important than the information itself. TV teaches you that the world is fast; that it’s about surfaces and appearances.\n(B) That’s why Marshall McLuhan said that every time a new medium comes along - a new way for humans to communicate - it has buried in it a message.\n(C) Each set of goggles you put on makes you see things differently. So when you start to watch television, before you absorb the message of any particular TV show - whether it’s Wheel of Fortune or The Wire - you start to see the world as being shaped by television itself.\n① (A) - (C) - (B)　　② (B) - (A) - (C)　　③ (B) - (C) - (A)\n④ (C) - (A) - (B)　　⑤ (C) - (B) - (A)"}, "18": {"label": "18번", "type": "문장 삽입", "score": "3.5점", "correctAnswer": "③", "answerItems": [{"label": "18번", "answer": "③", "note": ""}], "explanation": "제공 학교 정답지 기준. 첨부 DOCX의 마지막 문구를 그대로 반영했습니다. 원본 시험지와 대조 필요: “our bodies are so very good at it.”", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">18. 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.</div><div class=\"given\"><p>This definition of art as copying reality has a problem, though.</p></div><p>The ancient Greeks felt that the visual artist’s goal was to copy visual experience. This approach appears in the realism of ancient Greek sculpture and pottery. <span class=\"insertion-point\">(①)</span> We must sadly note that, due to the action of time and weather, no paintings from ancient Greek artists exist today. <span class=\"insertion-point\">(②)</span> We can only surmise their quality based on tales such as that of Zeuxis and Parhassios, the obvious skill in ancient Greek sculpture, and in drawings that survive on ancient Greek pottery. <span class=\"insertion-point\">(③)</span> Jackson Pollock, a leader in the New York School of the 1950’s, intentionally did not copy existing objects in his art. <span class=\"insertion-point\">(④)</span> While painting these works, Pollock and his fellow artists would consciously avoid making marks or passages that resembled recognizable objects. <span class=\"insertion-point\">(⑤)</span> They succeeded at making artwork that did not copy anything, thus demonstrating that the ancient Greek view of art as mimesis - simple copying - our bodies are so very good at it.</p></div>", "layout": "standard", "members": ["18"], "sourceText": "\nThis definition of art as copying reality has a problem, though.\nThe ancient Greeks felt that the visual artist’s goal was to copy visual experience. This approach appears in the realism of ancient Greek sculpture and pottery. ( ① ) We must sadly note that, due to the action of time and weather, no paintings from ancient Greek artists exist today. ( ② ) We can only surmise their quality based on tales such as that of Zeuxis and Parhassios, the obvious skill in ancient Greek sculpture, and in drawings that survive on ancient Greek pottery. ( ③ ) Jackson Pollock, a leader in the New York School of the 1950’s, intentionally did not copy existing objects in his art. ( ④ ) While painting these works, Pollock and his fellow artists would consciously avoid making marks or passages that resembled recognizable objects. ( ⑤ ) They succeeded at making artwork that did not copy anything, thus demonstrating that the ancient Greek view of art as mimesis - simple copying - our bodies are so very good at it."}, "19": {"label": "19번", "type": "문장 삽입", "score": "4.0점", "correctAnswer": "②", "answerItems": [{"label": "19번", "answer": "②", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">19. 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.</div><div class=\"given\"><p>This motivates people to travel by bike rather than by car, making streets safer for everyone.</p></div><p>An excellent alternative to calming traffic is removing it. Some cities reserve an extensive network of lanes and streets for bikes, pedestrians, and the occasional service vehicle. <span class=\"insertion-point\">(①)</span> As bicycles become more popular in a city, planners can convert more automobile lanes and entire streets to accommodate more of them. <span class=\"insertion-point\">(②)</span> Nevertheless, even the most bikeable cities still require motor vehicle lanes for taxis, emergency vehicles, and delivery trucks. <span class=\"insertion-point\">(③)</span> Delivery vehicles are frequently a target of animus, but they are actually an essential component to making cities greener. <span class=\"insertion-point\">(④)</span> A tightly packed delivery truck is a far more efficient transporter of goods than several hybrids carrying a few shopping bags each. <span class=\"insertion-point\">(⑤)</span> Distributing food and other goods to neighborhood vendors allows them to operate smaller stores close to homes so that residents can walk, rather than drive, to get their groceries.</p></div>", "layout": "standard", "members": ["19"], "sourceText": "\nThis motivates people to travel by bike rather than by car, making streets safer for everyone.\nAn excellent alternative to calming traffic is removing it. Some cities reserve an extensive network of lanes and streets for bikes, pedestrians, and the occasional service vehicle. ( ① ) As bicycles become more popular in a city, planners can convert more automobile lanes and entire streets to accommodate more of them. ( ② ) Nevertheless, even the most bikeable cities still require motor vehicle lanes for taxis, emergency vehicles, and delivery trucks. ( ③ ) Delivery vehicles are frequently a target of animus, but they are actually an essential component to making cities greener. ( ④ ) A tightly packed delivery truck is a far more efficient transporter of goods than several hybrids carrying a few shopping bags each. ( ⑤ ) Distributing food and other goods to neighborhood vendors allows them to operate smaller stores close to homes so that residents can walk, rather than drive, to get their groceries."}, "20": {"label": "20번", "type": "요약문 완성", "score": "4.0점", "correctAnswer": "④", "answerItems": [{"label": "20번", "answer": "④", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">20. 다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>Seawater contains an abundance of dissolved oxygen that all marine animals breathe to stay alive. It has long been established in physics that cold water holds more dissolved oxygen than warm water does - this is one reason that cold polar seas are full of life while tropical oceans are blue, clear, and relatively poorly populated with living creatures. Thus, as global warming raises the temperature of marine waters, it is self-evident that the amount of dissolved oxygen will decrease. This is a worrisome and potentially disastrous consequence if allowed to continue to an ecosystem-threatening level. Now scientists have analyzed data indicating that the amount of dissolved oxygen in the oceans has been declining for more than a half century. The data show that the ocean oxygen level has been falling more rapidly than the corresponding rise in water temperature. Falling oxygen levels in water have the potential to impact the habitat of marine organisms worldwide and in recent years this has led to more frequent anoxic events that killed or displaced populations of fish, crabs, and many other organisms.</p></div><div class=\"summary-arrow\">↓</div><div class=\"given\"><p>Global warming causes ocean oxygen levels to <span class=\"answer-blank summary-blank\">(A)</span>, making it harder for marine animals to survive and forcing some to <span class=\"answer-blank summary-blank\">(B)</span>.</p></div><table class=\"summary-options\"><colgroup><col class=\"choice-number\"><col><col></colgroup><thead><tr><th></th><th>(A)</th><th>(B)</th></tr></thead><tbody><tr><td>①</td><td>increase</td><td>migrate</td></tr><tr><td>②</td><td>decline</td><td>remain</td></tr><tr><td>③</td><td>stabilize</td><td>reproduce</td></tr><tr><td>④</td><td>decline</td><td>migrate</td></tr><tr><td>⑤</td><td>increase</td><td>remain</td></tr></tbody></table></div>", "layout": "standard", "members": ["20"], "sourceText": "\nSeawater contains an abundance of dissolved oxygen that all marine animals breathe to stay alive. It has long been established in physics that cold water holds more dissolved oxygen than warm water does - this is one reason that cold polar seas are full of life while tropical oceans are blue, clear, and relatively poorly populated with living creatures. Thus, as global warming raises the temperature of marine waters, it is self-evident that the amount of dissolved oxygen will decrease. This is a worrisome and potentially disastrous consequence if allowed to continue to an ecosystem-threatening level. Now scientists have analyzed data indicating that the amount of dissolved oxygen in the oceans has been declining for more than a half century. The data show that the ocean oxygen level has been falling more rapidly than the corresponding rise in water temperature. Falling oxygen levels in water have the potential to impact the habitat of marine organisms worldwide and in recent years this has led to more frequent anoxic events that killed or displaced populations of fish, crabs, and many other organisms.\n↓\nGlobal warming causes ocean oxygen levels to _____(A)_____, making it harder for marine animals to survive and forcing some to _____(B)_____.\n | (A) | (B)\n① | increase | migrate\n② | decline | remain\n③ | stabilize | reproduce\n④ | decline | migrate\n⑤ | increase | remain"}, "21": {"label": "21번", "type": "요약문 완성", "score": "4.4점", "correctAnswer": "⑤", "answerItems": [{"label": "21번", "answer": "⑤", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">21. 다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것을 고르시오.</div><div class=\"given\"><p>If our bodies know best, why are they easily injured when we do something so seemingly natural as running? On the one hand, running seems very easy, but that is only because our bodies are so very good at it. The most powerful supercomputer on the planet cannot administer the enormous number of computations it takes to run, untethered, on two legs. Wherever our running intelligence is, running is not all conscious to us and is so complicated that only the T-1000 Terminators of our imagination are able to do it. Because our running knowledge is buried so deeply within muscle fibres, cells and our DNA, we have to accept that we cannot fully explain its complexities. That doesn’t mean our bodies don’t know how to do it. We may feel our way towards understanding the alchemy of running by learning how to use our senses, getting them firing, and seeing what they are capable of, and accepting that our bodies know more about running than we ever will.</p></div><div class=\"summary-arrow\">↓</div><div class=\"given\"><p>Humans can perform complex movements without fully <span class=\"answer-blank summary-blank\">(A)</span> them because such abilities are <span class=\"answer-blank summary-blank\">(B)</span> in the body rather than controlled by the conscious mind.</p></div><table class=\"summary-options\"><colgroup><col class=\"choice-number\"><col><col></colgroup><thead><tr><th></th><th>(A)</th><th>(B)</th></tr></thead><tbody><tr><td>①</td><td>evaluating</td><td>encoded</td></tr><tr><td>②</td><td>recognizing</td><td>learned</td></tr><tr><td>③</td><td>explaining</td><td>isolated</td></tr><tr><td>④</td><td>controlling</td><td>acquired</td></tr><tr><td>⑤</td><td>understanding</td><td>embedded</td></tr></tbody></table></div>", "layout": "standard", "members": ["21"], "sourceText": "\nIf our bodies know best, why are they easily injured when we do something so seemingly natural as running? On the one hand, running seems very easy, but that is only because our bodies are so very good at it. The most powerful supercomputer on the planet cannot administer the enormous number of computations it takes to run, untethered, on two legs. Wherever our running intelligence is, running is not all conscious to us and is so complicated that only the T-1000 Terminators of our imagination are able to do it. Because our running knowledge is buried so deeply within muscle fibres, cells and our DNA, we have to accept that we cannot fully explain its complexities. That doesn’t mean our bodies don’t know how to do it. We may feel our way towards understanding the alchemy of running by learning how to use our senses, getting them firing, and seeing what they are capable of, and accepting that our bodies know more about running than we ever will.\n↓\nHumans can perform complex movements without fully _____(A)_____ them because such abilities are _____(B)_____ in the body rather than controlled by the conscious mind.\n | (A) | (B)\n① | evaluating | encoded\n② | recognizing | learned\n③ | explaining | isolated\n④ | controlling | acquired\n⑤ | understanding | embedded"}, "E2": {"label": "논술형 2번", "type": "논술형", "score": "4점", "correctAnswer": "is engagement that enables games to promote learning", "answerItems": [{"label": "논술형 2번", "answer": "is engagement that enables games to promote learning", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">[논술형 2] 다음 글을 읽고, &lt;보기&gt;에 주어진 단어들을 사용하여 &lt;조건&gt;에 맞게 빈칸을 완성하시오.</div><div class=\"given\"><p>Learning games need to be what we call ‘fun enough.’ Many new learning-game developers try to design an entertaining game. Unfortunately, that often makes learning harder rather than easier. Remember, you are not creating the next great commercial game to entertain your learners; you are creating a learning game in which success will be measured by the achievement of learning outcomes. Resist the temptation to create a ton of rules, pile on different game elements, and incorporate multiple dynamics to keep player interest high. Yes, the game should be engaging with a mild level of fun, but learning should be the goal. Focus on engagement rather than entertainment. The goals of the game play should be interactivity and engagement. It ____________________. Given those parameters, making sure the learners are engaged and active is far more important than making sure they are entertained.</p></div><div class=\"given\"><p>&lt;조건&gt;</p><p>○ 보기의 단어를 모두 한 번씩만 사용할 것</p><p>○ 보기의 단어 2개를 어법에 맞게 변형할 것</p></div><div class=\"given\"><p>&lt;보기&gt;</p><p>enable / is / promote / that / engagement / games / learning</p></div><p>답: It __________________________________________________________</p><p>______________________________________________________________</p></div>", "layout": "standard", "members": ["E2"], "sourceText": "\nLearning games need to be what we call ‘fun enough.’ Many new learning-game developers try to design an entertaining game. Unfortunately, that often makes learning harder rather than easier. Remember, you are not creating the next great commercial game to entertain your learners; you are creating a learning game in which success will be measured by the achievement of learning outcomes. Resist the temptation to create a ton of rules, pile on different game elements, and incorporate multiple dynamics to keep player interest high. Yes, the game should be engaging with a mild level of fun, but learning should be the goal. Focus on engagement rather than entertainment. The goals of the game play should be interactivity and engagement. It ____________________. Given those parameters, making sure the learners are engaged and active is far more important than making sure they are entertained.\n<조건>\n○ 보기의 단어를 모두 한 번씩만 사용할 것\n○ 보기의 단어 2개를 어법에 맞게 변형할 것\n<보기>\nenable / is / promote / that / engagement / games / learning\n답: It __________________________________________________________\n______________________________________________________________"}, "E3": {"label": "논술형 3번", "type": "논술형", "score": "6점", "correctAnswer": "(A) interest / (B) enthusiastic reading / (C) find out", "answerItems": [{"label": "논술형 3번", "answer": "(A) interest / (B) enthusiastic reading / (C) find out", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">[논술형 3] 다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B), (C)에 들어갈 말로 가장 적절한 것을 찾아 그대로 쓰시오.</div><div class=\"given\"><p>A key to engagement and achievement is providing students with relevant texts they will be interested in. My scholarly work and my teaching have been deeply influenced by the work of Rosalie Fink. She interviewed twelve adults who were highly successful in their work, including a physicist, a biochemist, and a company CEO. All of them had dyslexia and had had significant problems with reading throughout their school years. While she expected to find that they had avoided reading and discovered ways to bypass it or compensate with other strategies for learning, she found the opposite. “To my surprise, I found that these dyslexics were enthusiastic readers... they rarely avoided reading. On the contrary, they sought out books.” The pattern Fink discovered was that all of her subjects had been passionate in some personal interest. The areas of interest included religion, math, business, science, history, and biography. What mattered was that they read voraciously to find out more.</p></div><div class=\"summary-arrow\">↓</div><div class=\"given\"><p>Providing students with texts that match their personal <span class=\"answer-blank summary-blank\">(A)</span> can encourage <span class=\"answer-blank summary-blank\">(B)</span> and motivate them to <span class=\"answer-blank summary-blank\">(C)</span> more.</p></div><table class=\"source-table\"><tr><td>(A)</td><td>________________________ (한 단어)</td></tr><tr><td>(B)</td><td>________________________ (두 단어)</td></tr><tr><td>(C)</td><td>________________________ (두 단어)</td></tr></table></div>", "layout": "standard", "members": ["E3"], "sourceText": "\nA key to engagement and achievement is providing students with relevant texts they will be interested in. My scholarly work and my teaching have been deeply influenced by the work of Rosalie Fink. She interviewed twelve adults who were highly successful in their work, including a physicist, a biochemist, and a company CEO. All of them had dyslexia and had had significant problems with reading throughout their school years. While she expected to find that they had avoided reading and discovered ways to bypass it or compensate with other strategies for learning, she found the opposite. “To my surprise, I found that these dyslexics were enthusiastic readers... they rarely avoided reading. On the contrary, they sought out books.” The pattern Fink discovered was that all of her subjects had been passionate in some personal interest. The areas of interest included religion, math, business, science, history, and biography. What mattered was that they read voraciously to find out more.\n↓\nProviding students with texts that match their personal _____(A)_____ can encourage _____(B)_____ and motivate them to _____(C)_____ more.\n(A) | ________________________ (한 단어) [2점]\n(B) | ________________________ (두 단어) [2점]\n(C) | ________________________ (두 단어) [2점]"}, "E4": {"label": "논술형 4번", "type": "논술형", "score": "4점", "correctAnswer": "is to choose to be with other persons who have already resolved the problem with which we struggle", "answerItems": [{"label": "논술형 4번", "answer": "is to choose to be with other persons who have already resolved the problem with which we struggle", "note": ""}], "explanation": "제공 학교 정답지 기준. ", "contentHtml": "<div class=\"question-section\"><div class=\"text-question-title\">[논술형 4] 다음 괄호 속 우리말의 의미에 맞게 &lt;보기&gt;의 어휘들을 &lt;조건&gt;에 맞게 사용하여 영어 문장을 완성하시오.</div><div class=\"given\"><p>One valuable technique for getting out of helplessness, depression, and situations which are predominantly being run by the thought, “I can’t.” <u>(우리가 분투하고 있는 문제를 해결해 본 타인과 함께 있기로 선택하는 것이다)</u>. This is one of the great powers of self-help groups. When we are in a negative state, we have given a lot of energy to negative thought forms, and the positive thought forms are weak. Those who are in a higher vibration are free of the energy from their negative thoughts and have energized positive thought forms. Merely to be in their presence is beneficial. In some self-help groups, this is called “hanging out with the winners.” The benefit here is on the psychic level of consciousness, and there is a transfer of positive energy and relighting of one’s own latent positive thought forms.</p></div><div class=\"given\"><p>&lt;조건&gt;</p><p>○ 보기의 단어를 모두 한 번씩만 사용할 것</p><p>○ 보기의 단어 2개를 어법에 맞게 변형할 것</p></div><div class=\"given\"><p>&lt;보기&gt;</p><p>the problem / we / which / to be with other persons / who / be / have resolved / struggle / to choose</p></div><p>답: ____________________________________________________________</p><p>______________________________________________________________</p></div>", "layout": "standard", "members": ["E4"], "sourceText": "\nOne valuable technique for getting out of helplessness, depression, and situations which are predominantly being run by the thought, “I can’t.” (우리가 분투하고 있는 문제를 해결해 본 타인과 함께 있기로 선택하는 것이다). This is one of the great powers of self-help groups. When we are in a negative state, we have given a lot of energy to negative thought forms, and the positive thought forms are weak. Those who are in a higher vibration are free of the energy from their negative thoughts and have energized positive thought forms. Merely to be in their presence is beneficial. In some self-help groups, this is called “hanging out with the winners.” The benefit here is on the psychic level of consciousness, and there is a transfer of positive energy and relighting of one’s own latent positive thought forms.\n<조건>\n○ 보기의 단어를 모두 한 번씩만 사용할 것\n○ 보기의 단어 2개를 어법에 맞게 변형할 것\n<보기>\nthe problem / we / which / to be with other persons / who / be / have resolved / struggle / to choose\n답: ____________________________________________________________\n______________________________________________________________"}};
